event_stage_intro_20914=奥斯本的计划成功地让各方势力在南美丛林中打得不可开交。日本与苏联的民族主义者们也利用这个间隙主动攻击了驻日美军的基地。据说苏军已经研制出了卫星武器，这正是我们抢夺这项技术的好时机！尤丁采夫安排了一位通信卫星方面的专家，他会在库页岛的苏军基地附近与我们会合。
event_stage_intro_20915=马歇尔计划加速了西欧的重建，各国经济飞速发展。但近期意大利国内腐败滋生，社会动荡，甚至总理都遇刺身亡。与此同时苏军迅速占领了捷克斯洛伐克全境，并持续向巴尔干半岛增兵。东欧这个火药桶已被我们点燃，欧洲格局即将被重构。
