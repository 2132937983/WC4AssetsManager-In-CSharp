feat_desc_161=无法被选为直接伤害类主动技能目标，免疫所有负面状态。受到1格距离攻击时，所受伤害降低{1}%；受到2–3格距离攻击时，所受伤害降低{2}%
feat_desc_162=标记2格范围内的{1}个目标，同时无视其闪避/烟幕弹/潜行效果，攻击该目标时对其造成的伤害增加60%，持续1回合，冷却2回合。若标记目标被三角洲特种部队击杀，可以再次攻击，且造成的伤害额外提升20%
