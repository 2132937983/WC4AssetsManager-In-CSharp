elite_intro_101=库兹涅佐夫号航空母舰是苏联时代建造的最后一代大型水面作战舰艇之一，也是俄罗斯海军最具代表性的旗舰。它采用滑跃甲板设计，可搭载苏-33、米格-29K等舰载机，并配备强大的反舰与防空导弹系统，兼具航空打击、舰队防空和远洋威慑能力，展现了苏联海军“大舰巨炮与航空力量并重”的设计理念。


