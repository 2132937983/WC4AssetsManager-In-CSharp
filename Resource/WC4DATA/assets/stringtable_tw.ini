synergy_tactics_1_1=・所有“幽灵师”单位行动力+3；
synergy_tactics_1_2=・协同攻势：装甲单位自身周围2格内，每有1个友方“幽灵师”单位，自身攻击时额外造成2%的伤害。
synergy_tactics_1_3=・追亡逐北：步兵单位相邻的友方“幽灵师”单位在本回合消灭了1个敌军，该步兵单位本回合可以额外移动1次（效果一回合一次）。
synergy_tactics_1_4=・前沿观测：炮兵单位若其相邻1格内有友方“幽灵师”步兵单位，伤害增加10%。
synergy_tactics_2_1=・所有“矛头师”单位攻击力+10；
synergy_tactics_2_2=・步坦协同：装甲单位若其相邻1格内有友方“矛头师”步兵单位，则致命一击伤害+20%。
synergy_tactics_2_3=・集群机动：步兵单位自身周围2格内，每有1个友方“矛头师”单位，行动力+2。
synergy_tactics_2_4=・阵地援护：炮兵单位相邻1格内有友方“矛头师”单位，受到的伤害减少15%。
synergy_tactics_3_1=・所有“塔曼旅”陆军单位获得10%闪避率（空袭无视该闪避）；
synergy_tactics_3_2=・两栖机动：海军单位周围2格内的友方“塔曼旅”陆军单位无视下海时对行动力的影响，行动力+2。
synergy_tactics_3_3=・发射引导：炮兵单位自身周围2格内，每有1个友方“塔曼旅”单位，致命一击概率+4%。
synergy_tactics_3_4=・火力支援：步兵单位相邻1格内有友方“塔曼旅”单位，则射程+1，攻击最远距离时伤害-15%。

