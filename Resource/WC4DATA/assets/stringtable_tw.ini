feat_name_164=持续追击
feat_name_165=截击反制

feat_desc_163=对目标发射一枚“花岗岩”导弹，造成{1}%导弹伤害，并对目标周围1格范围内的目标造成{2}%的溅射伤害。同时施加“火控干扰”效果。冷却1回合
