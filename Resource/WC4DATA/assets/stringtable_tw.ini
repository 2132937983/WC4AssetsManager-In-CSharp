dialogue_3500=成功击败英军核心军团，继续坚守，转机已经出现！
dialogue_3501=德军的挣扎只是徒劳。暂停推进，后备军团到位后继续进攻!
dialogue_3502=苏军的进攻部队被挡住了，元首的反击计划并不是幻梦！
dialogue_3503=重新整编军队，柏林，我势在必得！
dialogue_3504=简直是奇迹！我们成功破坏了美军的后勤中转站，敌人现在手无寸铁！
dialogue_3505=启用备用中转站，前线部队稍作等待，补给马上送到。
dialogue_3506=我带来了我能控制的所有部队。保证我的安全，意大利的民众会为盟军服务。
dialogue_3507=该死，找他的副官来，我们必须安抚意大利人。
dialogue_3508=前线部队向卡昂集中，阻止敌军进一步推进。
dialogue_3509=南线情况不妙，出动预备队制止敌军进一步推进。向司令部发报，我需要更多部队才能维持住防线。
dialogue_3510=司令部派我部来支援。前线战况不佳，我们必须保留更多力量。
dialogue_3511=敌军的进攻锋头折断了，胜利的天平开始倾斜！
dialogue_3512=维持战线，继续进攻。我们没有下一个机会了！
dialogue_3513=巴斯托涅已经拿下，阿登山区的补给不再是问题。
dialogue_3514=自敌军登陆以来，失败一个接着一个。但这一战，我必须取得胜利。
dialogue_3515=安心回港，接下来由我接管海域！
dialogue_3516=这样的失败，我在菲律宾经历一次，就不怕再来一次。
dialogue_3517=危局已解！我军需要朝鲜人民的支持来发起反攻。
dialogue_3518=我军已取得海域控制权，拿下海参崴，夺取苏军导弹基地！
dialogue_3519=这次，我不仅回来了，还让苏联人尝到了失败的滋味！
dialogue_3520=重新夺回南库里尔群岛，务必保证港口安全！
dialogue_3521=请协助占领沿岸港口，海军需要一个鄂霍次克海的进攻支点！
dialogue_3522=很好！舰队马上到位，我们将与陆军一起收复鄂霍次克海！
dialogue_3523=谨守海岸防线，援军会尽快赶来支援。
dialogue_3524=圣劳伦斯岛已经失守，绝不能让敌人在大陆站稳脚跟！
dialogue_3525=支援海岸防线已失去意义。通知后方援军，撤军回防，加固安克雷奇防线。
dialogue_3526=援军已经抵达，资源无限供应。以逸待劳，击垮他们。
dialogue_3527=欧洲援军正在跨洋而来，坚持抵抗，转机很快出现。
dialogue_3528=成功与友军达成联系，做好补给，我们将解放美利坚！
dialogue_3529=战争到了这个地步，跟着美军继续打下去毫无意义。通知苏联谈判，我们要退出这场战争！
dialogue_3530=加拿大要退出战争？这个叛徒！通知军队，将战线维持在加拿大境内。想走？由不得他！
dialogue_3531=根据中央意见，任何可以统战的对象，我军都应当予以帮助。欢迎与我军一同作战！
dialogue_3532=为了国家安全，我不得不如此了。
dialogue_3533=欧洲援军已至！战士们，为了自由，夺回我们的领土！
dialogue_3534=战火已经烧到本土，继续这么打下去真的值得吗？
dialogue_3535=国家已经陷入危险，战士们，保卫我们的祖国！


