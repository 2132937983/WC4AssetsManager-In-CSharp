skill_info_166=指挥舰船部队行动力+5，不受无法反击效果影响。指挥部队每有3点行动力提升[#00FF00#%d%%]攻击和反击伤害。
skill_info_167=自身周围3格的敌军受到伤害提高35%%且斜面装甲，保护装置，挑衅，劫持，并肩作战效果无效。指挥舰船部队歼敌后，有[#00FF00#%d%%]概率再次攻击。
skill_info_168=指挥陆地部队时，周围3格内的敌人被消灭则提升自身士气，且获得“突破集群”状态（效果为造成伤害提高[#00FF00#%d%%]，可叠加至42%%），持续至关卡结束。
skill_info_169=指挥火炮部队时行动力+3，歼敌后有[#00FF00#%d%%]概率再次攻击，部队HP每有200点则额外提升10%%概率

