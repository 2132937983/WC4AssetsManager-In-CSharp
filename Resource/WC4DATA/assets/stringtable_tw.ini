dialogue_3412=苏军的攻势已经在漫长的补给线下显现出了疲态。
dialogue_3413=援军正从各处陆续抵达战场，守住我们的集结点。
dialogue_3414=继续进攻！让敌人在我们的钢铁洪流面前颤抖！
dialogue_3415=主力部队已经集结完毕，反击的时候到了。
dialogue_3416=美军的反攻在我们的战线上打开了一道缺口。组织周边的力量消灭这股进攻部队。
dialogue_3417=美军的堡垒已被我们攻破，敌人的援军已经无法抵达战场了！
dialogue_3418=行动开始！我的舰队会掩护后续的援军完成登陆。
dialogue_3419=向拿骚的英军驻地周边增兵。封锁加勒比海海域，挡住英国海军的增援。
dialogue_3420=该死，苏军早有准备！我们的人没有重型武器，根本无法阻挡敌人装甲部队的进攻。
dialogue_3421=行动基本可以宣告失败了。如果英军能够突出重围，分散苏军的兵力部署，那样我们还有胜利的希望。
dialogue_3422=小心敌军的空降部队，各地区的守军必须做好防御协同。
dialogue_3423=敌人的登陆部队与援军都已被拦截，我们重新控制了哈瓦那南部地区。
dialogue_3424=美军对这片海域的控制力并没有我们预期的那么强，不要畏惧，继续进攻。
dialogue_3425=我们的目的已经达成。暂且撤回前线的部队，在重新评估这里的局势后我们必将重返墨西哥湾。
dialogue_3426=阿拉斯加的苏军已被我们赶回白令海峡。然而那却是个障眼法，苏军在东海岸又卷土重来。
dialogue_3427=古巴的事件成功分散了美军的注意力。华盛顿方面已经没有多少部队可供调遣了。
dialogue_3428=情报屡次出错，我们必须对战场形势做出自己的判断。在援军抵达前我会死守住自己的位置。
dialogue_3429=一艘台风级潜艇突然主动切断了与我们的联系，立即派潜艇部队进行追击。
dialogue_3430=纽约已经失守，现在已经到了最危险的时候。我们必须加快进攻速度了。
dialogue_3431=苏军台风级潜艇的指挥权已经移交给了我们，利用好它，摧毁敌人的要塞群。
dialogue_3432=后方的美军还未集结完毕。现在趁苏军立足未稳，我们可以先发制人！
dialogue_3433=格陵兰岛需要我们的援助！
dialogue_3434=吞并正在发生。我们会赶走侵略者，并扩大美军在岛上的驻军规模。
dialogue_3435=苏军又少了一个进攻的支点，我的舰队会向雷克雅未克方向继续发起进攻。
dialogue_3436=美军切断了我们的又一条补给线。是时候考虑撤退的事宜了。
dialogue_3437=将格陵兰岛周围的舰队重新整编，向冰岛方向撤退。
dialogue_3438=苏军的舰队已经无路可退了，不过欧洲的敌人似乎正在有所行动。必须速战速决！
dialogue_3439=北美的叛军适时地发动了进攻。登陆作战并未遇到过多阻碍，美军已经无暇顾及我们的行动了。
dialogue_3440=苏军并不是我们的盟友，但眼下我们有着同一个敌人。
dialogue_3441=叛军的攻势十分迅猛。
dialogue_3442=敌人正在向东海岸快速推进。
dialogue_3443=我们根本无法阻挡住敌人的进攻。
dialogue_3444=前线的部队怎么会被如此轻易地击溃！如果加拿大无法处理这些问题，我们会替友军解决这场叛乱。
dialogue_3445=尽全力阻止向纽约进攻的苏军。我的人会解决西边的叛军联军。
dialogue_3446=奥斯本刚刚才被击败，怎么会又突然出现在那里。我们会派更多的部队在这片区域进行彻底地搜查。
dialogue_3447=事情不会就这么结束。我终将会夺回我们的遗产。
dialogue_3448=美军以冰岛为基地开始向挪威不断调集兵力，再次进军欧洲。
dialogue_3449=格陵兰岛的行动为我们创造了突袭北欧与英国的契机。
dialogue_3450=苏军快速的双线出击迫使我们在短时间内无法有效分兵援救。
dialogue_3451=必须迅速决定我们的主攻方向。
dialogue_3452=已有大量的苏联陆军完成了登陆，如果不第一时间进行拦截，后果将不堪设想。
dialogue_3453=再不采取行动，形势将无法挽回。
dialogue_3454=小心英美联军赶来支援的舰队，在我们占领挪威和瑞典全境前务必拖住敌人的援军。
dialogue_3455=挡住入侵的苏军并继续向北进攻，不要给美军干涉欧洲事务的机会。
dialogue_3456=苏军先头部队已经攻入了西德与丹麦境内。
dialogue_3457=我们早已无路可退。前进！在北约的部队展开前压缩他们的进攻空间。
dialogue_3458=无论发生任何事，法兰西的抵抗火焰不能熄灭，也决不会熄灭！
dialogue_3459=近点的威胁已经解除，各部队做好出击准备。
dialogue_3460=苏军已经失去了对我们的控制，德国的统一是任何人都不可阻挡的。
dialogue_3461=向东进攻，这次我们绝不会再失败了！
dialogue_3462=如果苏军迟早会卷土重来，那现在就该发动一场反攻，一劳永逸地解决这个问题。
dialogue_3463=北约的联军已经突破了我们的第二道防线，调集兵力重新夺回我们的防御阵地。
dialogue_3464=奥斯陆已经失守，形势对我们十分不利。
dialogue_3465=苏军在波罗的海周边的军力已被调走大半，我们出场的时机到了。
dialogue_3466=这与我的预期并不相符，需要更多的作战数据来进行调整。
dialogue_3467=法国也被击败了，再这样下去我们的联军将不复存在。
dialogue_3468=振作起来，继续进攻。不要因一时的失败而失去信心！


