elite_intro_86=白杨-M洲际弹道导弹是在苏联设计的RT-2PM 白杨的基础上进一步研发出来的新型洲际弹道导弹。依靠三级固体燃料火箭提供的巨大推力，飞行速度可达20马赫以上。可依靠大型运输车进行移动。
elite_intro_87=阿利伯克驱逐舰是美国海军新型驱逐舰，至今仍是世界上战力最强的驱逐舰之一。纵向安装了Mk 41垂直发射系统，可发射中程导弹和战斧巡航导弹，同时处理大量目标。在反恐战争、第二次波斯湾战争中出色的完成了多项护航任务。


