feat_desc_145=1格范围内释放无人机，释放后无人机可立即移动和攻击。无人机作为独立单位每回合只能攻击敌人1次，持续1回合。冷却1回合。
feat_desc_145_Lv2=1格范围内释放无人机，释放后无人机可立即移动和攻击。无人机作为独立单位每回合只能攻击敌人1次，持续2回合。冷却1回合。
feat_desc_145_Lv3=2格范围内释放无人机，释放后无人机可立即移动和攻击。无人机作为独立单位每回合只能攻击敌人1次，持续2回合。冷却1回合。
feat_desc_145_Lv4=2格范围内释放无人机，每回合可释放2次。释放后无人机可立即移动和攻击。无人机作为独立单位每回合只能攻击敌人1次，持续2回合。冷却1回合。
