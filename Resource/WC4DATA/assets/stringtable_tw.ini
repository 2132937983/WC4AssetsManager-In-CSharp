armygroup_event_desc_98=华约装甲集团军向莱茵河北岸发起猛烈突击，试图在48小时内突破西德“莱茵防御带”。美军工程部队被迫提前引爆部分桥梁以延缓推进速度。
armygroup_event_desc_99=北约多国舰队在北海展开协同反潜行动，双方近距离交火数次，苏联多艘潜艇受损。海峡沿岸城市进入一级防御状态。
armygroup_event_desc_100=东西柏林同时爆发巷战，东德守军依托楼宇与工厂构筑多重火力点。西柏林守备军在美军空投支援下展开迂回突破。柏林成为欧洲大陆战火最密集的区域之一。
armygroup_event_desc_101=苏联空降师在清晨突袭布鲁塞尔以东的机场，试图瘫痪北约补给中枢。比利时与荷兰装甲旅火速赶往反击，激战导致欧洲最大弹药库之一部分爆炸。
armygroup_event_desc_102=苏联炮兵集团使用高密度火炮覆盖西德前沿阵地，形成一条“灰烬火力带”。西德城市基础设施被严重破坏。
armygroup_event_desc_103=华约部队改道突进至捷克西南部，以高速装甲突破试图切断北约南线补给。意法军队派出机动部队增援。
armygroup_event_desc_104=北约空军针对华约通讯枢纽布达佩斯进行精确轰炸。匈牙利人民军随即在布达佩斯部署多重防空阵地，夜空被数百枚防空火箭照亮。整个城市在两天内进入战时封锁。
armygroup_event_desc_105=罗马尼亚炮兵团与苏军联手在喀尔巴阡山脉构筑纵深阵地，试图封锁意大利与南德的增援路线。北约山地部队被迫沿极险峻的替代路线突围，补给线岌岌可危。
armygroup_event_desc_106=北约对敖德萨实施封锁，试图阻断苏联南部补给链。华约部队发射导弹实施反封锁行动，海岸线多处侦测到导弹轨迹，敖德萨防空体系承受巨大压力。
armygroup_event_desc_107=瑞典、丹麦与德国海军联手封锁波罗的海出口。苏联波罗的海舰队尝试从里加、加里宁格勒两个方向同时突破，但被北约侦察机实时锁定，两地同时爆发海空交火。
armygroup_event_desc_108=苏联远程航空兵对伦敦实施饱和式导弹打击，泰晤士河南岸出现多处燃烧带。英国战时内阁紧急下令全国进入最高战备，伦敦指挥枢纽短暂失联。
armygroup_event_desc_109=曼彻斯特被攻占，城市周边的工业区被迫停产。英国军工体系短时间内出现“关键部件缺口”，北约急调加拿大与美国的工业产能同步补位。
armygroup_event_desc_110=利物浦失守导致北约的大西洋补给航道受限。美军海运指挥部临时绕行冰岛航路，整个西线部队的补给节奏被迫调整。
armygroup_event_desc_111=苏联航空兵从波罗的海方向实施深度渗透，重创哥德堡港口设施。瑞典全境进入最高级别防空戒备。
armygroup_event_desc_112=哥本哈根被华约突击旅占领，丹麦海峡扼控权落入苏军手中。北约失去波罗的海出口能力。
armygroup_event_desc_113=华约导弹在香榭丽舍大道上空爆炸，巨大的冲击波席卷整条大道。爱丽舍宫随即失去对外通讯，总统紧急转入地下指挥中心。
armygroup_event_desc_114=华约突击队突破布鲁塞尔外围后，北约总部遭到迫近威胁。为避免情报泄露，北约执行“黑夜行动”，部分秘密档案被紧急销毁。
armygroup_event_desc_115=鹿特丹港遭受重型导弹与炮火攻击，大量油库与集装箱区化为火海。北约海运能力大幅下降，全线部队补给普遍延迟。
armygroup_event_desc_116=威尼斯遭海空夹击，多处历史城区被迫疏散。意大利军队陷入苦战，仍难以阻挡东欧方向来的装甲部队。
armygroup_event_desc_117=塞瓦斯托波尔陷落，黑海舰队被迫全线北撤，苏军南翼防线出现严重真空。
armygroup_event_desc_118=明斯克陷落，华约在中线的支撑点被彻底拔除。红军指挥部启动紧急转移，整条斯摩棱斯克走廊风声鹤唳。
armygroup_event_desc_119=华沙被北约占领，波兰正面战区瞬间瓦解。苏军与波兰人民军主力被迫向布列斯特方向溃退，整个华约西翼暴露在敌军火力之下。
armygroup_event_desc_120=基辅落入北约手中，苏军数个集团军被迫越过第聂伯河重组，整个南中线出现巨大真空。
armygroup_event_desc_121=伦敦沦陷，英国全境进入戒严。失去英伦支点的北约西翼摇摇欲坠，海峡防线的崩裂让整个北海与大西洋方向的平衡随之倾覆。
armygroup_event_desc_122=华约在中欧方向大规模投放电子干扰，北约雷达在数十公里范围内全部瘫痪。

