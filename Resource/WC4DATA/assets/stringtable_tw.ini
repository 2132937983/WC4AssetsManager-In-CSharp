event_stage_intro_20416=德军的大规模进攻的确出乎我们的意料。但恶劣的天气同样限制了德国人的推进速度。我的部队已经提前北上，全速赶往战场。随时做好解决这个突出部的准备。
event_stage_intro_20417=德军的精锐已损失殆尽，但他们仍在柏林集结了最后的力量殊死一搏。把柏林留给苏联人，用最快的速度向东前进与苏军会师，围歼各处的德军。柏林的命运早已注定。

title_name_1050=战略天才
title_desc_1050=指挥「精英部队」装甲时，攻击力+18，致命一击伤害+35%

