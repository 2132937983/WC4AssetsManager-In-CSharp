legend_intro_70101=大德意志师是一支伴随第三帝国兴起与败亡的部队。其前身可追溯至1939年由“柏林卫戍团”改编而成的“大德意志步兵团”。该团先后以团级单位身份参与法国战役与巴巴罗萨行动。在图拉战役中，尚未扩编的“大德意志步兵团”作为第2装甲集群的一部分，历时一月围攻图拉城。然而在愈加猛烈的风雪与苏军顽强抵抗下，攻势始终未果，最终在苏军反攻中被迫撤退。此战成为该部队改编为师之前的最后一役，也开启了“东线救火队”之路。
legend_intro_70102=1942年8月初，为驰援岌岌可危的勒热夫战线，“大德意志”摩托化步兵师从“蓝色行动”中被紧急抽调，作为预备队配属给莫德尔的第9集团军。此时，苏军已在该区域转守为攻——朱可夫正策划规模浩大的“火星行动”，意图一举歼灭第9集团军、铲除勒热夫突出部。在惨烈的卢切萨河谷防御战中，“大德意志”师顶住了苏军重兵集团的反复突击，虽承受了高达90%的伤亡率仍死守阵地，“东线救火队”的称呼自此确立。
legend_intro_70103=斯大林格勒战役的胜利，标志着苏军全线转入战略反攻，德军南部战线的危机随之急剧膨胀。刚刚在勒热夫突出部经“火星行动”惨烈洗礼的“大德意志”摩步师，甚至来不及休整喘息，便被火速南调。至1943年2月，苏军因持续狂飙突进，补给线延伸过长、支援保障难以为继的致命弱点开始暴露。曼施坦因敏锐捕捉到这一战机，果断发动哈尔科夫反击战。在这场战役中，“大德意志”师不仅作为突击矛头的主力，协同党卫军装甲军夺回哈尔科夫，更在其他部队的策应下一鼓作气收复别尔哥罗德，为其“东线救火队”的传奇再添一抹光辉。
legend_intro_70104=由于哈尔科夫反击的成功，南部战线进入僵持期。德军在反击中受到了鼓舞，计划通过消灭库尔斯克突出部，夺回战争的主动权。1943年7月5日，城堡行动启动。“大德意志装甲掷弹兵师”（“大德意志摩步师”6月改名而来）作为第48装甲军的的一部分，向库尔斯克发起进攻。面对苏军布置的层层防线，大德意志师不断突破。但由于行动发起时间过迟，苏军在突出部做了充足的准备。面对苏军精锐部队的轮番阻挡，大德意志师最终未能与北部战线友军会师，“城堡”行动功亏一篑。
legend_intro_70105=库尔斯克战役的失败，使德军彻底丧失了战略主动权，苏军随之在全线发起排山倒海般的攻势。1943年8月末，“大德意志”师被仓促投入波尔塔瓦防线的防御作战，试图阻滞苏军向第聂伯河的推进。然而，随着战局急转直下，该师很快便从防守转入掩护，辅助主力部队逐步向第聂伯河西岸后撤。在重镇波尔塔瓦失守后，德军主力被迫加速西撤，“大德意志”师则接获一道冷酷的命令——死守克雷门丘克，确保所有友邻部队能从克雷缅丘克安全撤至西岸。这支被誉为“东线救火队”的精锐部队，再次在绝境中展现了惊人的战术韧性，顽强地履行了断后职责。然而，面对整条战线已成燎原之势、且很大程度上由自身所引发的这场“焚国之火”，区区一支救火队的力量，早已是杯水车薪。
legend_intro_70106=随着反法西斯战争全面转入战略反攻，“大德意志师”也如同它效忠的国家一样，滑向毁灭的深渊。1945年1月，在东普鲁士的冰天雪地中，这支曾被誉为“东线救火队”的精锐部队迎来了自己的最后一战。此刻，饱含着复仇意志的苏军正以排山倒海之势席卷而来，摧枯拉朽般地扫荡着德军仓促布设的防线。“大德意志”师虽竭力抵抗、节节阻击，但在绝对的力量差距面前，一切战术素养与战斗意志都显得苍白无力。部队只能不断向西溃退，最终被压缩至柯尼斯堡防线，在重重围困中艰难支撑。最终，这支伴随帝国崛起的部队，与它所效忠的那个罪恶帝国一起，在历史的废墟中归于尘土。
legend_intro_80101=第4近卫坦克师的前身是二战期间功勋卓著的苏联第4近卫坦克军。1943年8月，该军编入沃罗涅日方面军序列，投身于库尔斯克胜利后的战略反攻。在“鲁缅采夫行动”中，第4近卫坦克军与第27集团军协同作战，连续突破德第48装甲军精心布设的防线，为猛攻别尔哥罗德的主力部队守住了侧翼安全。其凌厉的推进一度直接威胁波尔塔瓦—哈尔科夫交通大动脉，迫使德军指挥部紧急调来包括“大德意志”师和“帝国”师在内的精锐部队，以竭力阻挡苏军的兵锋。此役充分彰显了第4近卫坦克军强大的突击力与战役韧性。
legend_intro_80102=库尔斯克战役的失利迫使德军全线后撤，苏军乘胜追击，兵锋直指第聂伯河防线。为扭转颓势，曼施坦因发起反击，不仅暂时遏制了苏军的推进势头，甚至企图重新夺回基辅。为粉碎德军这一企图，苏军迅速发起日托米尔—别尔季切夫攻势。1943年12月，第4近卫坦克军在第3近卫坦克集团军编成内，与友邻部队一道击退德军反扑，并解放了日托米尔。曼施坦因试图重新闭合的第聂伯河防线，最终在苏军钢铁洪流的猛烈冲击下彻底崩溃。
legend_intro_80103=第聂伯河防线崩溃后，苏军乘胜追击，意图一举击溃德军南方集团军群。至1944年3月，南方集团军群主力已被迫退至乌克兰西南部一隅。苏军旋即发起“普罗斯库里夫—切尔诺维策”进攻战役，旨在分割包围南方集团军群主力。作为第60集团军编成内的突击先锋，第4近卫坦克军协同友邻部队向捷尔诺波尔—普罗斯库里夫防线发起猛烈突击，不仅有力牵制了德军机动兵力，更一举切断利沃夫—敖德萨铁路大动脉，为整个合围行动创造了关键条件。至4月17日，该部最终攻占捷尔诺波尔，为这场旨在粉碎德军第聂伯河以西防御的大规模攻势画下了句号。
legend_intro_80104=1945年1月，苏军已基本收复波兰东部领土，兵临德国本土，东线德军在连番打击下疲惫不堪。为最终攻克柏林、结束战争，1月12日，苏军发起规模空前的“维斯瓦河—奥德河”攻势，意图一鼓作气打开通往柏林的大门。在“桑多梅日—西里西亚”方向，第4近卫坦克军作为机动突击力量，协同第59、第60集团军，于1月22日成功攻克历史名城克拉科夫。因在此役中作战英勇、战功卓著，该军荣获一枚列宁勋章。此役结束后，波兰大部获得解放，通往柏林的进攻通道已被彻底打开，战争终结的曙光就在眼前。
legend_intro_80105=1945年4月16日，第4近卫坦克军随乌克兰第1方面军陈兵尼斯河畔，就此投身于这场终结一个帝国的最后决战。在铺天盖地的炮火准备之后，滚滚钢铁洪流强渡尼斯河，向着柏林发起最后的胜利冲锋。此战中，第4近卫坦克军承担了肃清柏林南部德军残部的任务，虽未能直接参与对柏林市区的攻坚，却也因此成为第一批强渡易北河、与西线盟军胜利会师的部队之一。5月2日，柏林陷落，第三帝国覆灭。然而对于第4近卫坦克军而言，征途仍未结束。
legend_intro_80106=柏林战役的炮火尚未完全平息，其胜利的消息已如星火般点燃了布拉格反抗的意志。1945年5月5日，布拉格市民揭竿而起，掀起武装起义。为救援起义兄弟、并彻底歼灭退守捷克斯洛伐克的德军中央集团军群，苏军发起了东线战场的最后一次大规模进攻战役。5月6日，第4近卫坦克军作为乌克兰第1方面军的突击先锋，随主力部队化作滚滚铁流，翻越险峻的厄尔士山脉，直插布拉格。5月9日，布拉格解放；5月11日，德军中央集团军群残部投降。至此，第4近卫坦克军的二战征程，在胜利的终点站画上了圆满的句号。同年6月，这支功勋部队被正式改编为“第4坎捷米罗夫卡近卫坦克师”，其番号与荣耀被永久镌刻于军史之中，并作为重要的装甲突击力量，在俄罗斯军队中传承至今。



event_109=柏林战役
event_intro_109=1945年，帝国的版图已在连番溃败中崩解，昔日横扫欧洲的军队被压缩至最后的核心——柏林。复仇的红色洪流已越过奥得河，正以压倒性的火力逼近首都；西线的盟军亦步步紧逼，时间与空间都已不再属于德国。最高统帅部仍在命令死守，试图以顽抗换取奇迹，罗斯福的去世甚至让他们幻想西方盟军与苏军之间的决裂。然而现实毫不留情，德军残部在断裂的指挥与混乱的编制中，勉强拼凑起最后的防线。从久经战阵的老兵，到仓促上阵的少年，无一例外被卷入这场注定无法逆转的终局。

dialogue_4482=红军的战士们，我们从伏尔加河走来，从烈火与废墟中走来。我们见过被夷为平地的家园，听过母亲与孩子的哭声，敌人曾以为可以让我们屈服，但他们错了！
dialogue_4483=现在，柏林就在眼前。那里是这场战争的源头，是一切苦难开始的地方。今天，复仇的时刻到了，让我们把这一切彻底结束！
dialogue_4484=柏林不在我们当前的作战目标之内。那里将由东线部队负责进攻。我们不会为一座城市付出不必要的伤亡代价。真正的胜利，是在战争结束之后，还有尽可能多的人能够回家。
dialogue_4485=继续向鲁尔工业区腹地推进，瓦解敌军的工业与补给能力！
dialogue_4486=这或许不是我个人最愿意看到的安排，如果由我来决定，我会继续向东推进。
dialogue_4487=鲁尔的士兵们，局势已经没有任何幻想的空间。我们被包围，补给中断，继续战斗只会让更多人白白死去。
dialogue_4488=我不会执行元首那些毫无意义的焦土命令。德国已经承受了足够多的战火，没有必要再把一切亲手烧掉。
dialogue_4489=你们不再被要求继续作战。各单位可以自行解散，尽可能保存性命，结束这场已经结束的战争。
dialogue_4490=作为一名元帅，我不能以俘虏的身份结束这一切。既然已无路可走，那就由我亲自为这一切画上句号。
dialogue_4491=东线进攻受阻，战局已发生变化。为了尽快结束战争，我命令盟军即刻向柏林方向推进！行动中必须严格识别苏军位置，避免任何误伤。
dialogue_4492=看来我们终于等到了这一刻。将士们，全军出击！
dialogue_4493=对面是法国人？是的，那是查理曼师！他们抵抗的比德军还顽强！
dialogue_4494=他们的选择，我无法理解；他们所处的位置，我也无法接受。只要他们继续抵抗，就必须被消灭，继续进攻！
dialogue_4495=倒在进攻的路上，是军人最好的归宿。继续……前进……
dialogue_4496=元首以自尽结束了一切，抛弃了所有宣誓效忠于他的人。我们在这座废墟之城中已经战斗到了最后一刻，但这无法改变结局，继续抵抗已毫无意义。
dialogue_4497=继续战斗的每一个小时都会延长柏林平民和伤员的可怕痛苦。因此，在与苏军最高指挥部达成一致的情况下，我命令所有部队立即停止抵抗。这是帝国发出最后一道命令。


