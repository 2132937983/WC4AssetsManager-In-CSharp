elite_intro_99=俾斯麦号战列舰是二战时期德国海军的主力战列舰之一，以强大的主炮火力、厚重装甲和出色的远洋作战能力著称。其装备的380毫米主炮能够对远距离目标实施高精度打击，同时具备良好的航速与防护性能，是当时兼顾攻击力与生存能力的重型海上作战平台，象征着德国海军在大型水面舰艇领域的巅峰水平。
elite_intro_100=三角洲特种部队是美国陆军最精锐的特种作战单位之一，专注于反恐、定点清除及高风险渗透任务。该部队成员经过极其严苛的筛选与训练，擅长快速部署、隐蔽渗透与精确打击，通常配备先进的武器与通信系统，能够在复杂环境中迅速完成高价值目标打击，是现代战争中执行关键任务的顶级特种力量。

