event_intro_472=1942年2月8日，日军从新加坡防御最弱的西北部沙滩成功登陆。盟军虽然在人数和补给上占有优势，但缺乏训练和经验。日军因此迅速夺下武吉知马，控制了盟军的粮仓、油库和附近的蓄水池，使岛上的盟军迅速陷入物资短缺。最终，2月15日，盟军无条件投降。
event_intro_473=为了避开空袭，1942年2月11日至13日，德国军舰沙恩霍斯特号、格奈森瑙号和欧根亲王号在扫雷舰和空军的支持下，成功从法国布雷斯特穿越英吉利海峡，前往德国海军基地。地狱犬行动令英军颜面无光。然而，德军水面舰艇的行动范围此后被限制在北海，对大西洋航线不再构成威胁。
event_intro_474=为了防止盟军从西迪布济德东部的法伊德山口冲击敌军控制的沿海平原，切断突尼斯南北部队的联系，德军于1943年2月14日向西迪布济德及其周边发动进攻，重创了盟军部队。盟军丢失了大量阵地，阵线后撤至卡塞林。
event_intro_475=冰雹行动是美国海军于1944年2月17日至18日对日本海军位于中太平洋的特鲁克军事要港实施的一次大规模海空联合袭击。虽然行动的主要目标——联合舰队主力舰只因提前疏散而躲过一劫，但港内的大量运输船和辅助舰只遭到毁灭性打击，严重损害了日军的海上运输能力。
event_intro_476=硫磺岛战役是第二次世界大战太平洋战争中美国与日本之间爆发的一场战役，从1945年2月19日持续到3月26日。在这场战役中，日军放弃了在海滩上建立防线以阻止美军登陆，转而在岛屿内部建立了复杂的纵深防御。这使得美军的进攻极其艰难，原计划7天的攻占行动被拖延了一个多月。最终，美军战胜了日军，折钵山顶升起的星条旗成为美国的重要精神象征。
event_intro_477=为了防止波美拉尼亚的德军在苏军进攻柏林时发起反攻，从而拖延战争，1945年2月24日，苏军派出罗科索夫斯基率领白俄罗斯第2方面军和白俄罗斯第1方面军东翼部队，清扫了盘踞于苏军北方的波美拉尼亚守军，为进攻柏林铺平了道路。
event_intro_478=为了占领爪哇岛，1942年2月27日，日军与盟军舰队于泗水附近海域爆发海战。战斗持续了两天，日军以一艘驱逐舰受损为代价，击伤击沉了盟军多艘军舰，取得了胜利。这场战斗几乎摧毁了爪哇附近水域的盟军船只，极大推动了日军侵占爪哇岛的进程。
event_intro_479=1943年初，新几内亚战役进入盟军进攻阶段。为了扭转局势，日军计划在新几内亚增加兵力发动反攻。2月28日，日军组织舰队从拉包尔出发，计划在3月3日将约6900人运送至莱城。然而，盟军提前获悉了该计划，并在3月2日至3日对舰队发动持续空袭，炸毁了全部运输船。
event_intro_480=为了延迟英军对马雷斯防线的攻击，德军计划在1943年3月6日集中兵力袭击梅德宁，消灭该地的预备部队。然而，英军提前破获了这一计划，并调动部队做好了增援。到袭击当天，德军未能迅速攻克阵地。隆美尔判断，即使胜利，剩余兵力也不足以防守马雷斯防线。因此，他决定放弃继续作战，英军最终获得了胜利。
event_intro_481=为了占领敌人据点、保卫缅甸并切断增援路线等“进攻防御”的战略目标，日军于1944年3月8日发起了英帕尔战役。战斗持续到7月初，最终以日军的惨败告终。失败的主要原因归咎于日军指挥官牟田口廉也的脱离现实且不负责任的作战计划以及逃避指挥责任。在日本，“英帕尔”至今仍是形容某人“有勇无谋”的代名词。
event_intro_482=为了解放棉兰老岛并消灭岛上的日本守军，美军发起了胜利者5号计划，即棉兰老岛战役。战斗从1945年3月10日持续至8月15日。在菲律宾游击队的辅助下，美军以极少的伤亡清除了岛上的全部日军。
event_intro_483=盟军在梅德宁战役后，很快开始攻克马雷斯防线。1943年3月16日，英军兵分两路：一路正面进攻防线，吸引轴心军注意；一路从西南方山口绕道北上，从侧翼发动突袭。在两面夹击下，为防止被包围，轴心军不得不向北撤离。盟军成功占领马雷斯防线。
event_intro_484=在棉兰老岛战役开始后，1945年3月18日，麦克阿瑟将军下令占领菲律宾中部的米沙鄢群岛。此时，各岛的菲律宾游击队正在积极反击，使日军只能守住大城镇，难以在全岛展开防御。美军因此顺利解放了米沙鄢群岛。
event_intro_485=1943年3月23日，为了突破德军防线并推进至马雷斯防线，美军第二军团在盖塔尔与轴心国军队展开战斗。美军在初期取得了一些进展，成功击退了德军的前哨部队。然而，德军迅速反击，派出坦克和步兵对美军进行猛烈打击。双方在盖塔尔峡谷陷入僵持，直到盟军在其他战线完成突破。
event_intro_486=为了消灭德军第1装甲集团军，1944年3月25日，苏军调集乌克兰第1方面军和乌克兰第2方面军，将其围困在卡梅涅茨-波多利斯基地区。在这种情况下，OKW最终允许第1装甲集团军突围。德军在损失大量装备和人员后成功突围，但因此失去了在乌克兰组织防御的能力。
event_intro_487=为了巩固日军在东南亚的控制力并支援入侵缅甸的陆军，1942年3月31日，日军派遣海军第1航空舰队袭击锡兰的舰队基地，试图消灭英国东方舰队。尽管英军提前破获情报，但由于决策失误，印度洋地区的英军海上力量仍然遭受了严重打击，英国东方舰队被迫撤出孟加拉湾。
event_intro_488=为了获得进攻日本本土的跳板，1945年4月1日，美军开始了冲绳岛战役。战役初期，美军迅速占领了冲绳岛中部和北部。然而，在进攻南部的过程中，美军被日军利用洞穴、隧道和坚固的防御工事拖入了惨烈的阵地战。盟军在此战中有约12,000人阵亡，36,000人受伤；日军则有约77,000人阵亡或失踪。如此惨烈的结果加速了美国决定投放原子弹的进程，以迫使日本投降。
event_intro_489=葡萄弹行动是第二次世界大战末期意大利战役中的最后一次盟军进攻。1945年4月6日，盟军向北推进，突破波河两岸的德军防线。意大利游击队也开始起义，加速了轴心国部队的崩溃。最终，1945年5月2日，意大利的德军和意军残余全部投降，盟军解放了整个意大利。

