event_intro_437=1944年10月6日，苏联乌克兰第2方面军发起了德布勒森战役，将盘踞于罗马尼亚境内的德匈联军击退，并夺取了德布勒森，把战线推进了160公里。此战削弱了德军在匈牙利的军事力量，为后续进攻布达佩斯铺平了道路。
event_intro_438=1941年10月10日，德军第3装甲集团军转向加里宁方向，计划在行军中夺取加里宁市，并从西北绕过莫斯科向北进攻，形成包围圈。苏军得知这一消息后，迅速组织加里宁方面军进行阻击。加里宁防御战由此展开，直到12月才告一段落。此战中，德军成功占领了加里宁，但在严冬和苏军的顽强阻击下，其战斗力被严重消耗，战线停滞在加里宁，无法继续推进。
event_intro_439=莫扎伊斯克防线是苏联于1941年7月底开始建立的，用于保护莫斯科以及其西部通道。然而，直到10月份德军兵临莫斯科时，也没能彻底完成。这让德军在10月13日初次进攻就拿下了防线南端的卡卢加，鼓舞了他们对防线正面的进攻。德军在之后数日夺取了防线上的多个城市，突破了主要防御区。尽管苏军在该防线的作战未能阻止德军继续推进，但为防线后方组织防御部队争取了时间。
event_intro_440=在波罗的海行动后，北方集团军群被苏军围困在库尔兰地区。为防止东普鲁士的德军攻击包围圈，苏军派白俄罗斯第3方面军占领东普鲁士，消灭当地德军。1944年10月16日，苏军在炮火轰炸后开始进攻。然而，东普鲁士地区密林、沼泽的地形和德军的防御工事有效地阻碍了苏军攻势。苏军连续作战半个月，才将战线推进至贡宾嫩，但部队损失严重，最终放弃了继续推进。
event_intro_441=为了切断日本与其南亚的驻军的联系，使日本在南亚的驻军得不到补给，1944年10月23日至26日，在菲律宾的莱特湾附近海域，盟军和日军进行了第二次世界大战期间规模最大的一次海战。此战后，日本海军最后的力量被彻底消灭，在中东太平洋的制海权和制空权被彻底剥夺。
event_intro_442=第二次阿拉曼战役是第二次世界大战中北非战场的转折点，与斯大林格勒战役和瓜达尔卡纳尔战役一起标志着同盟国进入战略反攻阶段。这次战役从1942年10月23日持续到11月3日。盟军凭借人员和坦克数量的优势以及绝对的制空权，战胜了轴心国军队，迫使其撤退至突尼斯。
event_intro_443=希意战争是意大利和希腊之间于1940年10月28日至1941年4月23日爆发的军事冲突，标志着第二次世界大战巴尔干战役的开始。意大利军队为了扩张领土，从阿尔巴尼亚入侵希腊，但随后被希腊军队反攻，并迫使意大利撤退。到12月中旬，希腊军队甚至占领了阿尔巴尼亚25%的领土。直到4月6日，德军出兵入侵南斯拉夫和希腊时，意大利军队才恢复进攻。
event_intro_444=布干维尔岛战役是盟军与日军在所罗门群岛附近的布干维尔岛进行的一系列战斗，时间从1943年11月1日持续到1945年8月21日。该战役分为两个阶段，第一阶段从 1943 年 11 月持续到 1944 年 11 月，美军在托罗基纳滩头阵地登陆并控制周边。第二阶段主要以澳大利亚军队为主发动进攻，扫荡仍在坚持抵抗的日军士兵。
event_intro_445=1943年11月3日，苏军在基辅南北桥头堡准备已久，向基辅发起猛烈攻势。基辅城内的德军匆忙应对，但在强大攻势下，不得不撤出基辅。苏军趁势追击，解放了基辅、日托米尔及其周边的右岸地区。这次战役标志着苏联在东线战场上的进一步胜利，为后续反攻奠定了基础，同时对德军士气造成了严重打击。
event_intro_446=为了回应苏联“开辟第二战线”的要求，盟军计划占领法属北非，以对北非的轴心国军队进行钳制。1942年11月8日，英美联军分三路向卡萨布兰卡、奥兰和阿尔及尔发动登陆攻击。当地的维希法国守军无力抵抗。11月16日，三个城市都被盟军占领，成为日后盟军在北非行动的后勤支点。
event_intro_447=为了削弱意军在地中海的海上力量，英军计划使用航空母舰消灭停泊在塔兰托的意军主力舰队。行动在1940 年 11 月 11 日晚上开始，意大利舰队在一夜之间损失了一半的主力舰。这次袭击是历史上首次航空母舰舰载机对海军舰只的进攻，成功展现了海军航空兵对战列舰大炮的优势。此战也为日军袭击珍珠港的作战计划提供了参考。
event_intro_448=1942年11月12日至15日，盟军和日军在瓜岛附近展开了为期四天的海战和空战。日军试图增援瓜岛守军并运送补给，但最终盟军成功阻止了这一行动。此战后，日军失去了在瓜岛海域夜间通行的自由，无力再次发动进攻以夺取亨德森机场。
event_intro_449=1941年11月18日，为了解救被围困在图卜鲁格的盟军部队，并削弱德意联军在北非的力量，英联邦军队对德意联军在利比亚展开了一次大规模攻势。尽管战斗激烈且损失惨重，英联邦军队最终成功打破了围困，迫使德意联军撤退。这次行动标志着盟军在北非战场上的重要胜利，为后续的进攻奠定了基础。
event_intro_450=1941 年 11 月 17 日至 12 月 2 日发生的罗斯托夫战役是红军在苏德战争中首次成功的攻势之一，与莫斯科战役一起导致了德国在 1941 年冬天停止了对苏德前线的进攻。此战中，德军曾一度占领罗斯托夫，但守军的反抗和苏军对攻城部队的包围行动，使德军最终放弃了罗斯托夫。
event_intro_451=为了摧毁固守勒热夫突出部的德军第9集团军，苏军于1942年11月25日至12月20日从多个方向发起进攻，企图将其一举歼灭。然而，此战并未取得苏军预期的结果。苏军人员和装备的损失高于德军，却未能占领多少阵地。这使得此战在很长一段时间内鲜有提及。
event_intro_452=冬季战争是苏联与芬兰在第二次世界大战初期爆发的一场战争。1939年11月30日，苏联入侵芬兰，战争由此展开，最终苏联惨胜芬兰。在终战和谈中，芬兰割让并租借部分领土给苏联。1940年3月13日，双方签订《莫斯科和平协定》，战争结束。
event_intro_453=1941 年 12 月 1 日，德军中央集团军群再次向纳罗-福明斯克方向发起进攻，企图突破中部防线。在德军进攻之初，苏联军队仅能装备主要的防御阵地，导致德军很快突破阵线，在两天内推进了数公里。然而，苏军立即调动前线预备队并组织反击。到12月5日，苏军成功将战线推回到原始阵地，粉碎了德军最后一次试图突入莫斯科的企图。
event_intro_454=1941年12月5日，随着德军在莫斯科战役中转入防守，苏军加里宁方面军主动向加里宁发起进攻，企图解放该地。德军起初坚决抵抗，使苏军推进缓慢，但严寒的天气和补给不足最终迫使德军撤退。12月16日，加里宁被解放，加里宁方面军乘势追击，夺回了许多重要阵地。

