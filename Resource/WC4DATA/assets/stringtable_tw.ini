dialogue_4121=凌晨四点，风暴仍未停歇。所有人都在等待一个答案——推迟，或出发。
dialogue_4122=参谋们还在争论着潮汐、云层、月亮。只有我清楚，几个月的演练就是为了这一刻。犹豫，比敌人的炮弹更致命。
dialogue_4123=出发。愿上帝怜悯我们所有人。
dialogue_4124=风浪太大，连巡逻机都无法起飞。参谋部的电文说盟军不会在这种恶劣天气里行动。
dialogue_4125=今天的海雾格外浓。……雾后那是什么？渔船？一艘、两艘……等等，我的天啊，整个海面都在移动！
dialogue_4126=盟军舰队！是盟军舰队！在这种天气下行动？他们疯了！立即拉响警报！全员进入一级战备！这是登陆！他们在登陆！通知所有人坚守岗位，不得离开防区，未经命令不得下海出击！
dialogue_4127=伞兵？他们以为找到了突破口，那片地尽是浅滩与积水正是元帅预先布下的陷阱。他们跳出飞机的那一刻就已经输了。
dialogue_4128=很好，让他们在泥水里游泳！帝国欢迎他们的“冒险精神”。
dialogue_4129=海岸防线比我们预想得更坚固，敌人的机枪火力如同铁幕！告诉战列舰和空中部队，给我掀开那片碉堡！
dialogue_4130=我看到我的士兵们还在水中挣扎！派救援艇过去，不论代价！我不会让他们孤独地沉没在这片海中！
dialogue_4131=每一寸滩头、每一条战壕、每一座碉堡，都是通向欧洲大陆的钥匙。拿下它们！那是我们回家的路。
dialogue_4132=保持与舰队的联络，我们需要空军支援！按照约定，为我们的飞机做标记！
dialogue_4133=所有部队注意，德军装甲集群正在集结！这是他们最后的反扑，也是我们决定胜负的时刻！
dialogue_4134=他们还在登陆……数不清的舰艇，像海浪一样一波又一波。天啊，他们疯了吗？防线正在崩溃！我们快要抵挡不住了！请求命令……请求命令……！
dialogue_4135=隆美尔元帅此刻不在前线……没人能给我们命令，也没有援军，我们只能靠自己了！
dialogue_4136=隆美尔元帅已经抵达前线！现在，该轮到我们反攻了！英吉利海峡会成为他们的坟墓！
dialogue_4137=士兵们，现在要让他们明白，德意志的士兵，哪怕倒下，也不曾屈膝。 哪怕只剩一人，也绝不会让这条防线沦陷！
dialogue_4138=士兵们不再高喊口号，他们在祈祷，只是想活着……空气里混合着火药、汽油、海水和烧焦的肉腥味。
dialogue_4139=登陆失败……传令所有部队撤回舰上。我们输了这场战役，但我们不会输掉战争。总有一天，我们还会回来。
dialogue_4140=这是我们犯下的最大错误……低估了一个即将崩塌的帝国最后的反击。
dialogue_4141=我们似乎赢得了这场战役，但我在想，我们守护的真的是祖国，还是一场已经失去灵魂的幻梦。元首在远方绘制疆界，却从未见过一个个士兵倒下的样子。
dialogue_4142=盲目服从是士兵的本能，但理性的怀疑也是人类该有的权利。若有一天，每个人都能学会思考，帝国才可能真正被拯救。
dialogue_4143=我从未恨过那些对岸的人，他们也只是被命令驱使去赴死的父亲与儿子。或许我们之间最大的不同，只是被命运安排在了不同方向。
dialogue_4144=希望这场战役不是战争的终点，而是帝国重生的起点。
dialogue_4145=我已履行了军人的誓言……别让敌人踏进柏林一步。

event_107=诺曼底防线
event_intro_107=1944年夏，盟军在英国集结了史无前例的力量，炮火与钢铁汇成滔天怒浪，准备重新踏上英吉利海峡的另一岸。德军驻守在法国北岸，面对这场迟早会到来的风暴，士兵们在沙丘与混凝土碉堡间屏息以待。6月6日清晨，诺曼底的海面被无数登陆艇染成灰白，天空回荡着飞机的轰鸣。对德军而言，这不仅是一场防御战，更是一次无法回避的审判。滔滔炮火之下，欧洲站在了命运的十字路口，德意志士兵们也迎来了他们在西线最漫长、也最孤绝的一天。

dialogue_4154=这是一次有限突袭，首要任务为消灭西迪巴拉尼及其周边意大利据点，迅速收复并控制西迪巴拉尼海岸。
dialogue_4155=成功攻克西迪巴拉尼，英军俘虏大量意大利部队。
dialogue_4156=继续进攻。意大利利比亚集群大规模被俘，敌军绝对准备不足。我们应该进一步扩大战果！
dialogue_4157=各军团严守海岸线，昔兰尼加不容有失。
dialogue_4158=英军的攻势太凶猛，我不能把第10集团军陷在昔兰尼加。各部队整备，准备撤出昔兰尼加。
dialogue_4159=或许，我们可以横穿沙漠，阻止班加西守军向西逃离。
dialogue_4160=狐狸在开阔地带被击杀。
dialogue_4161=好，通知各部队：班加西部队已灭，全力进攻占领昔兰尼加。
dialogue_4162=击败西部沙漠的敌军，将他们赶回图卜鲁格以西。
dialogue_4163=成功占领卡普佐堡垒。
dialogue_4164=德军依托88炮和哈尔法亚山口的地势，成功挡住了英军的进攻。
dialogue_4165=第15装甲师迅速支援卡普佐，第5轻型师从英军后方穿插，支援哈尔法亚隘口。
dialogue_4166=德军即将封死我们的退路。我们绝不能让部队陷入包围。通知前线：放弃作战目标，迅速撤退。
dialogue_4167=英军成功重夺哈尔法亚山口。海岸公路的咽喉要道回到英军手中。
dialogue_4168=很好，继续沿海岸公路推进。
dialogue_4169=通知各部队，作战计划调整：停止支援哈尔法亚山口，全力围剿山口以西的敌军部队。
dialogue_4170=这一战我们必须战胜德军，解除图卜鲁格之围。
dialogue_4171=第7装甲师听令，你们的任务是拿下西迪雷泽格机场，伺机向图卜鲁格进攻。
dialogue_4172=成功拿下西迪雷泽格，图卜鲁格守军准备突围。
dialogue_4173=放弃进攻图卜鲁格的计划，维持住包围圈。迅速夺回西迪雷泽格，不能让他们用空袭威胁包围圈。
dialogue_4174=战士们，坚持住！支援部队正在赶来。我们一定要在这个机场，让“狐狸”流血！
dialogue_4175=英军进攻部队太多了，只能进攻英军后方，逼他们撤军。
dialogue_4176=装甲部队听令：从南部沙漠，绕行至埃及，全力破坏英军后方补给站，解救边境堡垒。
dialogue_4177=机动部队迅速支援西迪雷泽格，主力部队全力沿海岸向图卜鲁格推进。
dialogue_4178=巴迪亚部队向图卜鲁格方向撤退，强化图卜鲁格包围圈。
dialogue_4179=全军按计划行事：南部佯攻吸引敌军注意，北部集中优势兵力消灭敌军主力。
dialogue_4180=我需要回欧洲养病。敌军近期会有大规模动作，务必严格按照防御计划执行作战。
dialogue_4181=意德装甲军的临时指挥官阵亡；隆美尔返回北非重新接管军队。
dialogue_4182=我已经恢复了装甲军的指挥权。装甲部队向北部集中，准备夺回阵地！
dialogue_4183=放弃南部防线，有序向北部海岸线撤退。
dialogue_4184=第7装甲师调往北部参与主攻，增压行动开启。
dialogue_4185=运输油轮沉没，轴心军陷入汽油危机。
dialogue_4186=燃油补给不足，部队损失惨重。我们必须撤退，保存实力。
dialogue_4187=继续进攻，攻入海岸平原，破坏敌军补给线！
dialogue_4188=海岸平原近在眼前。稍作休整，准备攻入海岸平原！
dialogue_4189=装甲部队出动，海岸平原补给线不容有失！
dialogue_4190=战场突遇沙尘暴，战争双方都陷入视野不清的困境。
dialogue_4191=突尼斯局势不利，为避免突尼斯的失败损伤隆美尔的威名，进而动摇国内民心。隆美尔被安排离开北非。
dialogue_4192=我代表剩余的非洲德军向盟军投降。
dialogue_4193=德军崩溃后，意大利向梅塞发送了投降命令。
dialogue_4194=我代表意大利第一集团军向盟军投降。
dialogue_4195=没有预先空袭和海军火炮压制，德军无法确定我们何时突袭。进攻！用奇袭打破德军的防线！
dialogue_4196=放弃进攻吧！我们已经为你们做好了准备。
dialogue_4197=因为克拉克的错误策划，登陆部队陷入不利的境地。
dialogue_4198=该死！敌军居然预判了这次进攻。迅速通知海军，用火炮压制敌军反击！
dialogue_4199=在海军火炮的帮助下，盟军成功登陆萨莱诺。
dialogue_4200=各部队依托山地防御，拖延敌军推进。
dialogue_4201=放弃那不勒斯，各部队向冬季防线撤退。


