event_intro_4120=1941年5月，德国煽动伊拉克首相攻击英军基地以切断其石油供应。英军坚守哈巴尼亚机场，并从各地调兵反击。最终英军轰炸摩苏尔基地并推进至巴格达，于5月30日占领该城。此役挫败了轴心国在中东的扩张，确保了英国石油命脉，是二战中东战场的关键胜利。
event_intro_4121=1940年5月12日，德军执行“黄色方案”，通过阿登地区突袭色当。德空军猛烈轰炸瓦解法军防御，地面部队迅速渡过默兹河建立桥头堡。随后德军成功包围英法盟军主力。此役是德军闪击战成功的关键，直接导致法国北部盟军溃败，为法国沦陷埋下伏笔，改变了二战西线战局。
event_intro_4122=1940年5月21日，英法联军为打破德军包围，在阿拉斯发动反击。英军大量玛蒂尔达坦克初期突破德军防线，但隆美尔急调88毫米高射炮平射，摧毁英军坦克扭转战局。盟军虽被击退，但激烈抵抗使德军误判遭遇重兵，可能因此导致暂停进攻24小时，为敦刻尔克撤退赢得时间。此役是法国战役中盟军少有的战术反击，也同时展示了88炮的反坦克威力。
event_intro_4123=1942年5月26日，隆美尔率轴心国军进攻利比亚加查拉地区。德军迂回盟军防线南方，被困后向西反攻打通补给线。虽然在比尔哈凯姆遭遇自由法国军队的顽强抵抗，但在英军主力东撤后，托布鲁克也随之陷落，三万多名盟军投降。此役导致英军指挥官被撤换，由蒙哥马利接任。轴心国乘胜推进至埃及，引发第一次阿拉曼战役。
event_intro_4124=1944年6月10日，为迫使芬兰退出战争并消除对列宁格勒的威胁，苏军发动维堡攻势。列宁格勒方面军集中优势兵力，在猛烈炮火支援下，于10天内连续突破芬军两道防线，6月20日攻占维堡。但芬军退守VKT防线并顽强抵抗，苏军未能达成歼灭目标。此役是苏军“十次打击”之四，消除了列宁格勒北翼威胁，并加速了芬兰退出战争的进程。


armygroup_rule_8=8.只有在困难模式中获胜才会有相应的战斗评分。


