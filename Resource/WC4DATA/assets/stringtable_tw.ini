feat_desc_152=受到陆军或海军单位攻击时，有{1}%概率闪避该伤害；受到空袭时，有{2}%概率闪避该伤害（导弹、核弹除外）
feat_desc_153=攻击直升机时，伤害增加{1}%。每回合移动后，下回合行动力降低{2}点（下限为可移动2格），在友军城市、工程部队或航母1格范围休整1回合后，可恢复全部行动力
feat_desc_153_Lv2=攻击直升机时，伤害增加{1}%。每回合移动后，下回合行动力降低{2}点（下限为可移动2格），在友军城市、工程部队或航母1格范围休整1回合后，可恢复全部行动力
feat_desc_153_Lv3=攻击直升机时，伤害增加{1}%。每回合移动后，下回合行动力降低{2}点（下限为可移动2格），在友军城市、工程部队或航母2格范围休整1回合后，可恢复全部行动力
feat_desc_153_Lv4=攻击直升机时，伤害增加{1}%。每回合移动后，下回合行动力降低{2}点（下限为可移动2格），在友军城市、工程部队或航母2格范围休整1回合后，可恢复全部行动力
