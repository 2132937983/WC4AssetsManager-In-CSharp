event_intro_455=此战也称为日军攻占关岛战役。1941年12月8日，在珍珠港事件的第二天，日军趁机突袭关岛。关岛守军毫无防备，迅速被日军击败。12月10日，关岛守军放弃抵抗，日军获得关岛控制权。
event_intro_456=为了救援被围困在斯大林格勒的第6集团军，1942年12月12日，德军第4装甲集团军向斯大林格勒发起突击。德军的攻势让红军措手不及，并在首日取得显著进展。然而，随着苏军小土星行动的开展以及斯大林格勒周边的积极防御，德军无法继续进攻，只能放弃解救第6集团军。
event_intro_457=突出部之役，又称阿登战役，发生于1944年12月16日至1945年1月25日，是德国在二战末期于比利时阿登地区发动的攻势，旨在突破英美盟军战线并重新占领安特卫普。德军在战役初期取得了一定战果，重创了美军驻守部队，但由于物资不足，难以进一步推进，使盟军稳住阵脚并开始反攻。最终，德军参战部队遭到重创，残余部队撤退至齐格菲防线及莱茵河。
event_intro_458=巴斯托涅战役发生于1944年12月20日至27日，是美军和德军在比利时小镇巴斯托涅进行的一场战役，是突出部战役之一部分。由于阿登山区的7条主要道路均通过巴斯托涅，德军为了保障部队安全通过阿登山脉，包围了驻守当地的美军，试图占领巴斯托涅。美军誓死抵抗，始终保持对巴斯托涅的控制权，最终被乔治·巴顿的第三集团军所属单位解围，获得战斗胜利。
event_intro_459=为了解放乌克兰和摩尔达维亚，1943年12月24日，苏军发动了第聂伯河-喀尔巴阡山脉攻势。此战，苏军成功收复了大部分乌克兰和全部摩尔达维亚领土，击溃了德军南方集团军群，将战线推进至波兰至罗马尼亚一线。
event_intro_460=北角海战发生于1943年12月26日，战斗区域大致位于挪威北角外海。在这场战斗中，德国海军舰艇编队试图搜寻并攻击西方盟国向苏联运输战争物资的船队，但由于情报外泄，与准备已久的英国皇家海军遭遇，导致战列巡洋舰沙恩霍斯特号被击沉。此战后，德国再也没有能力派出大型战舰袭扰盟军的北方航线。北方航线由此变得相对安全，直至战争结束。
event_intro_461=1944年12月26日，苏军完成了对布达佩斯的合围，并迅速开始劝降布达佩斯守军。29日，投降谈判破裂，负责谈判的苏军特使被德军击毙。苏军安葬其遗体后开始进攻。布达佩斯围城战至此开始。苏军围攻布达佩斯50天，耗尽了德国国防军特别是武装党卫队的资源，最终攻克了布达佩斯，使东部战线离柏林更近了一步。
event_intro_462=由于突出部之役导致盟军大部队向北转移，德军计划对防守薄弱的阿尔萨斯地区发起进攻，以削弱敌军力量。1945年1月1日，德军向斯特拉斯堡发动攻势。尽管盟军在兵力劣势下节节败退，但最终守住了斯特拉斯堡。攻势结束后，德军占领了阿尔萨斯约40%的地区，缩短了西部战线，但未能实现削弱盟军力量的目标。
event_intro_463=1941年12月，日军向吕宋岛发起进攻。由于初期布防不利，日军成功打破海岸防线，迫使美军和菲律宾守军撤退至巴丹半岛做最后抵抗。1942年1月7日，日军开始围剿巴丹半岛。因为缺乏补给，守军节节败退，最高指挥官麦克阿瑟撤离菲律宾。最终，在坚持抵抗三个月后，1942年4月9日，剩余的守军向日军投降，巴丹半岛战役就此结束。
event_intro_464=莱特湾海战后，日军在菲律宾的军事力量遭受重创。盟军凭借制空权和制海权的优势，开始计划夺回吕宋岛。1945年1月9日，盟军登陆部队在舰队护航下从林加延湾登陆，清扫了海岸驻军后，向马尼拉推进。3月3日，马尼拉解放，日军残部撤入山区继续抵抗。8月15日，日本宣布无条件投降，吕宋岛的残余日军逐批接受停火令，吕宋岛战役至此结束。
event_intro_465=1944年1月14日，苏军集结列宁格勒方面军、波罗的海沿岸第2方面军和沃尔霍夫方面军，发起了列宁格勒-大诺夫哥罗德攻势。大约两周后，红军重新控制了莫斯科-列宁格勒铁路。1944年1月26日，德军被驱逐出列宁格勒州，列宁格勒围困被解除。苏军继续追击至3月1日，将战线推进至卢加河。
event_intro_466=在1943年9月盟军登陆意大利后，为阻止盟军推进，德军设置了“冬季防线”。为了继续推进并解放罗马，1944年1月17日，盟军向最核心的“古斯塔夫防线”发起了进攻。卡西诺山上的修道院是战斗的核心，因其战略位置使得德军能够控制周围地区。盟军多次尝试攻占修道院，但都遭遇顽强抵抗。最终，盟军在付出巨大伤亡代价后控制了该地区，获得了战役的胜利。
event_intro_467=为了消除科尔马突出部，盟军于1945年1月20日从突出部南北两侧发起进攻，成功包围并重创了德国第19集团军，解放了科尔马。
event_intro_468=科尔逊-契尔卡塞攻势是第聂伯河-喀尔巴阡山脉攻势的一部分。在1944年1月初，乌克兰第1方面军和乌克兰第2方面军从南北两侧包围了契尔卡塞东北方的德军突出部。为了剿灭突出部中的6个德军师，1月24日，苏军从南北两侧发起进攻；28日，南北两路完成会师，形成包围圈。德军很快发起突围，但还是损失了大量军官和全部重型火力。
event_intro_469=一战末期，芬兰寻求独立，形成了“白色芬兰”和“红色芬兰”两股政治势力。双方都追求芬兰独立，但意识形态不同导致矛盾不断升级。战火于1918年1月27日点燃，红色芬兰抢先动员工人群体，占领了芬兰南部几乎所有城镇和工业中心，而白色芬兰退守北部农村地区。然而，由于红色芬兰缺乏军事训练，白色芬兰在德国的军事援助下最终赢得了战争。
event_intro_470=1942年2月1日，美国海军对马绍尔和吉尔伯特群岛的日本帝国海军守备部队进行了空袭和炮击，对岛上的日本驻军造成了轻至中度的破坏。虽然此战对太平洋战局影响不大，但在经历“珍珠港事件”和“威克岛失守”后，此次行动有效提升了美国海军和公众的信心。
event_intro_471=1944年1月，苏军推进到纳尔瓦河一线。为了深入爱沙尼亚并获得进攻芬兰和东普鲁士的基地，苏军对纳尔瓦地峡发起了一系列进攻，即纳尔瓦战役。此战从1944年2月2日持续到8月10日。初期，德军猛烈反攻，苏军推进缓慢。直到7月，与利沃夫-桑多梅日攻势相配合，苏军才攻下纳尔瓦。德军退守坦能堡防线，与苏军再次僵持。


dialogue_3201=德军即将打通一条通往沿海方向的走廊。现在必须要准备撤退了。
dialogue_3202=让友军先行向海峡方向撤退，我的装甲部队会尽力拖住德军的进攻。
dialogue_3203=坚守阵地！皇家空军会持续为撤退行动提供空中掩护。
dialogue_3204=阵地战已经不适合这个时代了！全速前进，把俘虏留给后面的友军。
dialogue_3205=这……这空袭的规模根本无法阻止德军的地面进攻。如此溃败的原因到底出在哪里？
dialogue_3206=我的军团已经无法继续作战，抛下手头的一切，全速撤退吧。
dialogue_3207=我们的军队虽然失败了，但是研究成果决不能落入德军手中。
dialogue_3208=通往海峡的走廊已经打通，维持住战线，把英法主力消灭在包围圈里。
dialogue_3209=你就是奥斯本？我是本特克，奉命保护你一起撤离。
dialogue_3210=可是我接到的命令是坚守在这里，直到主力部队顺利撤离！即便情况再危急，我也不能擅自离开阵地。
dialogue_3211=你的命运远不止于此，你的征途才刚刚开始，未来还有无数可能在等待着你。但如果你坚持的话，我也会尊重你的决定。选择权在你手里。
dialogue_3212=里尔也失守了，德军开始加速收缩包围圈。阿尔弗雷德，我们得撤退了。
dialogue_3213=别忘了，我们是佣兵。完成任务、活着回来——这才是我们的唯一目标。
dialogue_3214=相信他做出的决定。
dialogue_3215=德军将被俘的人员关押在了几座临时监狱内，阿尔弗雷德也一定在其中。
dialogue_3216=你们怎么才来？再多等几天，我可真要考虑加入德军了。
dialogue_3217=你到底是谁？为什么会出现在这里？不过现在顾不了那么多了！敌人的主力已向南方进攻，这是我们唯一的救援机会！
dialogue_3218=居然还想逃跑？没有一个囚犯能从第三帝国的监狱逃脱！干脆就在这里解决了你们，免得夜长梦多。或许我还能赶回前线参战！
dialogue_3219=营救十分顺利，不过接下来才是难点。向南穿过战线前往西班牙，从那里坐船能到英国。
dialogue_3220=看来我们得在这里分开了。远征军还有一部分被困在勒阿弗尔，正面临威胁，我必须尽快赶去与他们汇合。
dialogue_3221=或许你还有一个选择。从南方撤离，梅斯方向会被打开一个缺口，你可以与在那里坚守的戴高乐将军汇合。
dialogue_3222=我们正在与德军协商停战协定的相关事项，各部队现在原地待命，等候新的指示。
dialogue_3223=法国败了。败给了德军的装甲集群，败给了优秀的指挥官，败给了闪电般的进攻速度。能决定正面战场走向的装甲部队才是战争未来的发展方向！
dialogue_3224=先进的军工科技与稳定且充足的产能，这两者合二为一才是军事实力的发展方向。我们还有希望！
dialogue_3225=贝当的政府已经抛弃了法国人民。我会为了法兰西战斗至最后一刻！
dialogue_3226=法军部队又一次被我们分隔了开来。现在巴黎已经门户大开，胜利近在眼前！
dialogue_3227=相信他，但是行动要快。德军留给你们的时间不多了，法国人自会安全撤离。
dialogue_3228=前线部队的美式装备已顺利抵达。不必道谢，我会在后方等候你们的最新战报。
dialogue_3229=我们的援军已经抵达！但德军突破了阿拉曼的防线，那里的装甲部队随时有被包围的危险！
dialogue_3230=阿尔弗雷德·西奥多·奥斯本，你在法国的英勇表现令我印象深刻！但陆地的战斗和空中完全不同，这扬起的砂砾会把你的棱角磨平，把你的锐气消耗殆尽。让我看看你能否适应这里的残酷！
dialogue_3231=敌军进攻规模的确超乎预期。重新调整防守策略，优先化解敌人的进攻。更多的援军即将抵达战场。
dialogue_3232=阿拉曼已经失守，敌人怎么会有如此多的装甲和海军部队。我们就要被包围了。
dialogue_3233=没想到你还能指挥海军。先把舰队撤回亚历山大港，增援很快就会到达。
dialogue_3234=进攻的速度还不够快，别忘了我们只有一次机会。配合意军的进攻拿下开罗，击溃盟军的士气。
dialogue_3235=目标开罗，切断盟军的兵员补给。
dialogue_3236=这些兵力就是我们的全部了。既然攻势已经失败，那就只剩下一个选择。撤退！
dialogue_3237=利刃已经出鞘。我的人会在敌军做出反应前先发制人。
dialogue_3238=我一定竭尽全力，把隆美尔赶出非洲。
dialogue_3239=新设计的两台车体已成功改进了原型车的缺陷，使其在北非战场的严苛环境中也能充分发挥火炮的威力。
dialogue_3240=空降部队已经抵达了预定位置。立即发起进攻，在海防线后方扰乱敌人的防御部署。
dialogue_3241=迅速登陆！协同空降部队夹击并瓦解阵地上的敌军。
dialogue_3242=黄金海滩防守薄弱，我的位置相对有利。可以全力配合我迅速清理出一片滩头阵地。
dialogue_3243=登陆部队已经站稳了脚跟，现在向卡昂方向发动进攻。
dialogue_3244=又是隆美尔和他的装甲部队！我只是一个战车军备专家，怎么这些硬仗都让我赶上了。
dialogue_3245=没人会在战场上在意他人的身份。你可以留在这里，只要别挡在我们冲锋的路上。
dialogue_3246=我们是防线上的一道坚实的屏障，决不能让盟军通过这里。我会死战到底。
dialogue_3247=大批盟军已经在诺曼底登陆，必须组织一次反攻，延缓敌人的推进。
dialogue_3248=我的火炮部队会限制住盟军的进攻！
dialogue_3249=有时候我真觉得自己才是这些战役的主角，应该被印在海报上、印在宣传册的封面上。
dialogue_3250=盟军对我们的进攻毫无防备。利用这个机会切断英美主力间的联系。
dialogue_3251=凭我们手头的武器装备根本无能为力。被包围的友军恐怕凶多吉少了。
dialogue_3252=加快支援的速度！难道我们只能眼睁睁地看着巴斯托涅沦陷吗？
dialogue_3253=现在有两个方案可以选择。直捣德军后方，切断敌人的兵员补给。或者从正面挡住德军主力的进攻，等待美军援军的抵达。
dialogue_3254=我来助你！援军虽然会迟到，但绝不会缺席。
dialogue_3255=巴顿将军早就提前调集了兵力，等援军主力一到就立即发起反攻！
dialogue_3256=相信你的战友们。更重要的是，相信你自己。行动起来！
dialogue_3257=我从不怀疑自己的判断。形势即将反转，我们的优势就要到来了。
dialogue_3258=英军向我们的后方发动了突击，一旦退路被切断，后果不堪设想。
dialogue_3259=撤回齐格飞防线，在盟军发动下波攻势前重新组织好防御。
dialogue_3260=我们曾经离胜利仅有一步之遥，但最后却功亏一篑。撤退吧。
dialogue_3261=占领巴斯托涅沉重地打击了盟军的士气。但是我们并没有更多的兵力来维持这样的攻势。
dialogue_3262=巴斯托涅已经失守。赶去支援的奥斯本被德军装甲部队困住了。
dialogue_3263=现在不是分析战局的时候，我们的机会稍纵即逝。
dialogue_3264=苏军再次卷土重来，现在已经占领了大半个墨西哥湾！陆军也越过了美墨边境。形势十万火急。
dialogue_3265=我们与美军一直有着密切的合作，这次行动路线绝对万无一失。选择你们也是因为大家在西线战场上并肩作战过。
dialogue_3266=听说这次还提供了许多新式装备和特殊作战人员。
dialogue_3267=他们的话只能信一半。这次倒也不是什么黑色行动。美国那些滑头不值得我信任，但你，卢卡斯，我完全信任。
dialogue_3268=我们已经抵达了预定位置。目标：摧毁苏军的导弹基地与核工厂。是你们表现的时候了！
dialogue_3269=没有人敢在天空中向我发起挑战。
dialogue_3270=当然，我们也为你准备了一架。
dialogue_3271=等等，在山间似乎有什么建筑设施，看外形不像是苏军的军事基地。
dialogue_3272=那里似乎有人影。提高警觉！从留下的痕迹来看，这些人的科技水平已经远远超过了我们。
dialogue_3273=发生什么事了？为什么前线的部队在向友军开火！
dialogue_3274=苏军部队好像被人控制了一样。其中一部分甚至把部队装备的控制权都交给了我们。
dialogue_3275=阿尔弗雷德，我无法在这里待太久。利用好这辆战车，继续向南前进。我们需要你的帮助。
dialogue_3276=该死，刚刚发生了什么，通信突然被人切断了！阿尔弗雷德，你们没事吧？
dialogue_3277=看样子我们可能要去南美一趟了。听说那里的局势相当复杂，战争随时可能爆发。
dialogue_3278=眼下还有更大的危机要处理。趁苏军还没反应过来，继续执行作战计划。
dialogue_3279=英军的部队中发现了奇特的装甲战车。我们曾见过类似的武器，现在问题变复杂了。
dialogue_3280=放弃吧，你们的计划是不会成功的。在正面战场发起进攻只会让其他势力渔翁得利。
dialogue_3281=我已经从基地撤离。这里就交给你了。
dialogue_3282=苏军的势力早已伸向了南美。现在他们发起了全面进攻，我们必须在局势无法挽回前先发制人。
dialogue_3283=美军靠着自己的多个海外军事基地，在短时间内完成了大量部队的调动。靠武力威胁着地方的政权。
dialogue_3284=看看这个世界，战争从没有改变。只有强者才有话语权，其他人只能被迫站队。
dialogue_3285=已经定位到了三处具体的坐标。离我们最近的一处附近发现了苏军，他们似乎要靠武力占领。
dialogue_3286=既然你到了这里，就已经没法回头了。守住南美的基地，我们将在这里重新开始。
dialogue_3287=阿尔弗雷德·西奥多·奥斯本，我们并没有邀请你来这里。不论这些人是怎么联系上你的，你已经被列为他们的一员了。
dialogue_3288=敌人拥有先进的武器，甚至能改变人的心智。如果无法为我们所用，就必须第一时间彻底摧毁。
dialogue_3289=我们会回来复仇的。奥斯本，你终将无处可逃。
dialogue_3290=从一开始我就知道结局，我早就选定了自己要走的必经之路。问题是，你们呢？
dialogue_3291=我一向只忠于自己和兄弟们。而奥斯本，你早就是我们的兄弟了。
dialogue_3292=也许根本就没有什么精神控制。是我们早就看清了现状，早就想要做出改变。
dialogue_3293=你们的信号干扰装置还在吧？我相信自己对你的判断，多个朋友总比多个敌人好。
dialogue_3294=来吧，好戏开场了！
dialogue_3295=也许你们能在南美获得胜利。但是请记住，我们盯上你了。
dialogue_3296=卢卡斯，这是我们所有的精锐了，你知道该怎么做。
dialogue_3297=这些部队正在他们的要塞周围不断集结。再这样耗下去我们都不会有好结果。
dialogue_3298=眼下敌人的敌人就是朋友。要想遏制住这些人，恐怕只能和苏军暂时停战了。
dialogue_3299=没人能阻止我。美军不能，苏军不能，任何人都不能。我绝不会让帝国的失败重演！
dialogue_3300=我们的战士早已潜伏在了各地，暗中推动各种军事行动，改变新世界的格局。
dialogue_3301=我们无法抵挡住敌军的突袭，开罗失守，补给线有被切断的危险！
dialogue_3302=防线已经无法再继续维持。现在战机的油料已经补给完成，我会作为一名空军继续履行我的使命。
dialogue_3303=所有的战机撤回不列颠本土重新进行补给，后续的撤离行动需要更多空中力量提供掩护。

promotable_generals=以下将领可以使用道具进修

dialogue_3138=我军兵力远胜日军，务必要将其消灭在新加坡。让美苏两国见识英国的尊严与荣耀！
dialogue_3139=东岸地势平坦，方便登陆。一定要严防日军从此处登陆！
dialogue_3140=我军兵力和补给都远逊英军，必须用战术逼迫他们投降，不能和他们打消耗战！
dialogue_3141=敌军居然如此脆弱。全力进攻，击碎他们的抵抗意志！
dialogue_3142=武吉知马已被我军占领。你们的粮仓水源已经不保。放弃这种毫无意义、绝望的抵抗吧！
dialogue_3143=精锐部队全力夺回武吉知马！不然等到物资耗尽，我们绝无可能继续战斗！
dialogue_3144=消灭英军反攻精锐部队！等到英军补给耗尽，他们就会同意无条件投降！
dialogue_3145=新加坡的物资已经耗尽，我们无法再继续战斗了。通知日军，我们同意投降。
dialogue_3146=此次行动要将主力舰队安全送达德国港口。通过海峡的机会有限，一定要快！
dialogue_3147=仔细搜查，一定要将他们击沉！没有敌人能在战时通过英吉利海峡！
dialogue_3148=目标舰队出现！将他们击沉！
dialogue_3149=突尼斯中部的各处山口是我们攻击东部平原的支点。各部队务必坚守，不容有失！
dialogue_3150=兵分两路，一路从南部攻击西迪布济德，一路向西北进攻。我们不能把这些山口留给敌人！
dialogue_3151=敌军开始撤退了。继续进攻，打他个立足未稳！
dialogue_3152=有情报称日军联合舰队主力舰只停泊在特鲁克。士兵们，该让日本还珍珠港的利息了！
dialogue_3153=日军滩头部队已被炮火压制，准许登陆！
dialogue_3154=诸君，最后的时刻已经到来！我们一定要把更多的敌人埋葬在这里！
dialogue_3155=陆地部队注意：日军有地堡用来隐藏火力，注意警戒！注意警戒！
dialogue_3156=开火！开火！所有人都不准万岁冲锋，必须坚守阵地，战斗到最后一刻！
dialogue_3157=面对数量和素质占优的陆海空攻击，卑职已尽全力，然现在险要尽落敌手，卑职万分抱歉。
dialogue_3158=德军的部队围在我军南北两侧，为了防止他们阻碍进攻，我们必须扫清他们！
dialogue_3159=我已尽全力，但势不可违。现在，我只求有一个有尊严的结局。
dialogue_3160=泗水方向发现敌军舰队。干掉他们，爪哇岛就是我们的了！
dialogue_3161=各舰注意，日军舰队正在接近泗水，准备作战！
dialogue_3162=敌军火力凶猛，受损舰只先撤退修理。
dialogue_3163=我怎能在家乡的海域里沉没？！
dialogue_3164=莱城前线现在急缺兵员。这批部队到达就能缓解局势，要确保安全送达！
dialogue_3165=各部队注意，日军运兵船已经出动。干掉他们!为前线减轻压力。
dialogue_3166=我军补给不足，不能在防线上打消耗战。出击，一定要在防线前把敌军打退！
dialogue_3167=士兵们，注意警戒！敌军马上就要进攻。没有足够的物资，他们坚持不了多久！
dialogue_3168=不行，再打下去，剩下的兵力就不够防守马雷斯防线了。全军撤退！
dialogue_3169=战士们，日军即将发动进攻。坚守阵地，严守纪律。我们一定能获得胜利！
dialogue_3170=不用担心，空投足以保证我们的补给。守住英帕尔，广袤的密林足以让敌军补给崩溃！
dialogue_3171=夺回英帕尔！
dialogue_3172=日军补给不足，攻势只会越来越疲软。战士们，让我们彰显勇气，证明日军绝非不可战胜！
dialogue_3173=日军已经无力反抗。清扫岛上日军，解放棉兰老岛！
dialogue_3174=坚持“永久抵抗”策略，绝不能轻易放弃任何一个据点！
dialogue_3175=法国的防线还是相当可靠的。坚守阵线，我们就不会失败！
dialogue_3176=正面保持压力，等待机动部队从防线左侧发起攻击，用“左勾拳”打破防线！
dialogue_3177=该死，英军是怎么到达防线右侧的？全军听令，放弃防线，向北撤退。
dialogue_3178=这条防线不能再守了。马雷斯守军迅速后撤，不要和敌军纠缠！
dialogue_3179=进攻，把他们彻底击溃！
dialogue_3180=我为国王流尽了最后一滴血。我的人生已足够光荣。
dialogue_3181=海面已经清扫，菲律宾的中部群岛也必须在我们的控制之下！
dialogue_3182=守岛部队务必用尽一切手段和敌人纠缠，全力阻止敌人夺岛！
dialogue_3183=必须保证东部平原的安全，绝不能让敌军突破我们的防线！
dialogue_3184=突破敌军防线，将战线推进到东部平原！
dialogue_3185=投降，否则不收口袋内任何一个德军作俘虏。
dialogue_3186=第1装甲集团军向西撤退，做出向西南突围的态势，随时呼应西北方向的援军！
dialogue_3187=解我的职？这个蠢货！没有他的胡乱指挥，都不会有现在这种情况！
dialogue_3188=西北方向有德军援军？阻止他们，不能让那里成为突破口。
dialogue_3189=出击！这一战要荡平东方舰队！
dialogue_3190=敌军向我军驶来？进军，把敌军的主力舰全部击沉！
dialogue_3191=你们是蠢猪吗？竟然被敌人击沉了！撤退，先回港修整。
dialogue_3192=冲绳是进攻日本本土的重要跳板，拿下它，我们才能尽快结束这场战争。
dialogue_3193=敌人发起了自杀式袭击，注意回避！
dialogue_3194=意大利游击队会支援我们。越过这道山岭，便是一马平川！进军，解放意大利！
dialogue_3195=为了我国剩余的领土，我军会配合德军防守。
dialogue_3196=封锁加尔达湖附近的山口，不能让敌军逃跑，必须一网打尽！
dialogue_3197=该死，哪儿来的暴民！镇压他们，敢干扰军政行事的全部拘捕！
dialogue_3198=我是意大利军队的最高领导。我代表意大利军队投降。


