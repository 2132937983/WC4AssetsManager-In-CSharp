synergy_tactics_9_3=・冲锋炮火：“海军陆战队第1师”炮兵单位攻击后，赋予2格内“海军陆战队第1师”单位“冲锋”buff。（冲锋：攻击力+20%，攻击后消失。）
synergy_tactics_9_4=・全地形作战：“海军陆战队第1师”装甲单位周围2格存在“海军陆战队第1师”步兵单位，攻击时无视地形减伤效果。
synergy_tactics_10_1=・所有“第51高地师”单位攻击时有25%的概率不被反击。
synergy_tactics_10_2=・分割协战：所有“第51高地师”单位，攻击被夹击的敌方单位时，伤害+15%。
synergy_tactics_10_3=・交替掩护：“第51高地师”步兵单位攻击后，赋予周围2格“第51高地师”单位“掩护机动”buff，持续1回合。（掩护机动：防御+6，行动力+2。可以叠加3次。）
synergy_tactics_10_4=・压制炮击：“第51高地师”炮兵单位攻击后，赋予2格内“第51高地师”单位“突入掩护”buff，持续1回合。（突入掩护：若攻击后不被反击，赋予攻击目标“匆忙应对”buff1回合；匆忙应对：攻击力降低10%，可叠加5次。）

