armygroup_event_desc_204=黑蝎在美国的一系列行动被相继挫败，全军大举向南撤退。多个国家在美苏的帮助下脱离了黑蝎的控制。
armygroup_event_desc_205=奥斯本同时启动了5个信标增幅器，开启了最终倒计时。在15个周期后，任何意志不坚定的人都会重新加入黑蝎。美苏英法分别派出各自的精锐部队，联合周边国家准备占领各地的黑蝎遗迹。
armygroup_event_desc_206=黑蝎在墨西哥的遗迹太阳要塞被攻破，信标增幅器被占领。全球各处秘密基地的位置被全部揭示，黑蝎在战略层面陷入了全面被动。
armygroup_event_desc_207=黑蝎在哥伦比亚的遗迹回声地堡被攻破，信标增幅器被占领。遗迹中的各项设施已被自行销毁。但残留的访问记录显示该设施的重启时间点为1933年。
armygroup_event_desc_208=黑蝎在巴西的遗迹印加之眼被攻破，信标增幅器被占领。许多特殊的武器装备没来得及转移或销毁，甚至还有一些从未见过的新式军备设计图。
armygroup_event_desc_209=黑蝎在巴西的遗迹星轨神殿被攻破，信标增幅器被占领。美苏缴获了大量的加密资料，黑蝎在世界各地的人员名单和军事部署已完全被揭露。
armygroup_event_desc_210=黑蝎在巴西的遗迹飓风灯塔被攻破，信标增幅器被占领。黑蝎主力部队与世界各地其他黑蝎成员间的通讯被暂时阻断。
armygroup_event_desc_211=黑蝎势力再次迅速发展壮大，美苏双方为根除这一威胁决定联手。华约与北约暂时停战，结成了新的军事同盟。
armygroup_event_desc_212=奥斯本被彻底击败，倒计时停止。黑蝎在南美洲的计划被彻底挫败。
armygroup_event_desc_213=黑蝎的全部遗迹设施均被占领，倒计时停止。黑蝎在南美洲的计划被彻底挫败。
armygroup_event_desc_214=奥斯本被彻底击败，倒计时停止。黑蝎在南美洲的计划被彻底挫败。所有人都听到了自由的召唤。
armygroup_event_desc_215=黑蝎的全部遗迹设施均被占领，倒计时停止。黑蝎在南美洲的计划被彻底挫败。所有人都听到了自由的召唤。
armygroup_event_desc_216=最后残余的信标增幅器已经调试完毕。由于黑蝎长期在控制区暗中投放含有Q30物质的纳米药物。钟声响起，受到药物影响的人自主意识逐渐被抑制，最终重新加入黑蝎。
armygroup_event_desc_217=玛雅遗迹中发现了新的水晶头骨。它们并非普通文物，而是记录着神庙信息与未知文明历史数据的存储设备。
armygroup_event_desc_218=新施瓦本集团军携带着黑蝎的军事装备在南美丛林中现身。也许是他们与黑蝎达成了军事合作，又或者黑蝎就是他们存在的原因。
armygroup_event_desc_219=苏联向委内瑞拉交付了大量坦克，试图建立装甲防线以抵御美军及其盟友的进攻。
armygroup_event_desc_220=黑蝎武装海盗，使其在多个海域大肆劫掠各国商船。此举激起了美苏的报复。通过进一步强化海军的装备，各国舰队联合对海盗进行了全面的清剿。
armygroup_event_desc_221=黑蝎的海军部队利用“声波迷雾”干扰雷达系统，不断地袭扰巴拿马运河周边的航线。各国军队的补给线均受到了一定程度的影响。
armygroup_event_desc_222=美国通过哥伦比亚和秘鲁向巴西秘密空运导弹部件，这条线路成功地避开了黑蝎与苏联的视线。
armygroup_event_desc_223=古巴再次遭到了袭击，地区平衡被再度打破。与此同时，苏联在短时间内向古巴提供了大规模的军事援助。
armygroup_event_desc_224=美国在加勒比海东部海域部署了大规模的声呐阵列，监视苏联潜艇。
armygroup_event_desc_225=苏联测试地壳震荡原型机引发智利、玻利维亚与阿根廷交界地区地震。因极强的不可控性，该武器的研究最终被终止。
armygroup_event_desc_226=苏联在古巴测试气象武器“风暴之眼”，成功引导了飓风袭击佛罗里达。
armygroup_event_desc_227=黑蝎控制区的各国中陆续出现了反黑蝎组织建立的电台。这些电台不断通过广播号召占领区的人民团结起来，推翻黑蝎的统治。
armygroup_event_desc_228=为阻止美苏间谍卫星对南美地区的全面侦查，黑蝎在各大洋的岛屿上建立起干扰站，从而对信号进行干扰与劫持，窃取美苏的卫星数据。
armygroup_event_desc_229=英军在百慕大地区发现了二战期间的德军核动力潜艇鹦鹉螺号。这艘U艇与美军之后建造的鹦鹉螺号完全不同。虽建造于二战期间，但舰艇仍完好无损，船内设备的技术水平远超二战时期，甚至超越现代。
armygroup_event_desc_230=巴西的雨林发现巨型油田，美、苏、黑蝎在秘鲁-巴西边境针对开采权开始了激烈的争夺。
armygroup_event_desc_231=黑蝎势力被驱逐出北美后，美军利用黑蝎设施的技术重启了费城实验。新的驱逐舰埃尔德里奇号再次从众人眼前消失。
armygroup_event_desc_232=苏联在玻利维亚建造“地球望远镜”探测地心，意外打通连接地幔的通道，成功开采了地下蕴藏的丰富资源。
armygroup_event_desc_233=亚马逊河流域突然爆发了黄热病，各国部队战斗力因此下降。但黑蝎与美苏军队中均未出现感染病例。

armygroup_event_desc_234=美国在评估盟友们的情报时，发现政府的决策链中出现了脱离美军掌控的隐秘决策点。多个国家地区的真正控制权早已在无形中易主。
armygroup_event_desc_235=奥斯本同时启动了5个信标增幅器，开启了最终倒计时。在15个周期后，任何意志不坚定的人都会重新加入黑蝎。美苏英法分别派出各自的精锐部队，联合周边国家准备占领各地的黑蝎遗迹。
armygroup_event_desc_236=在战争远离本土后，美国国内的军事工业巨头利用此次混战的机会向多国倾销军火。短期内极大提升了各国的军事实力。但也导致部分尖端武器经灰色渠道流入了黑蝎组织手中。
armygroup_event_desc_237=美苏情报机构发现，黑蝎在南美多国采用的渗透与控制手法，与二战期间德军情报组织的模式高度相似，引发了关于其历史根源的调查。
armygroup_event_desc_238=一次仿佛跳出了沙罗周期预兆的罕见日全食，异常地笼罩在赤道附近的战区上空。在长达三分钟的黑暗中，多国部队因突然失去空中侦查与通讯而陷入混乱。
armygroup_event_desc_239=一本架空历史小说在西方世界风靡。其中英国在战后维持住了殖民帝国并继续在东亚殖民，而美国则与东亚其他国家结盟。最终英美因霸权冲突开战，英国在苏联中立下获胜，成为全球唯一的殖民帝国霸权。
armygroup_event_desc_240=苏联在南美洲东岸接连发起大规模攻势，将战线不断向西推进，建立起了一条赤色防线。
armygroup_event_desc_241=黑蝎的生物克隆设施在印加之眼附近的雨林深处被发现。其中不仅存有大量处于休眠状态的士兵克隆体，还发现了早已死亡的数位将领的遗传信息样本，以及数个已被清空的培养舱。
armygroup_event_desc_242=黑蝎势力再次迅速发展壮大，美苏双方为根除这一威胁决定联手。华约与北约暂时停战，结成了新的军事同盟。
armygroup_event_desc_243=在黑蝎计划失败的最后时刻，各遗迹预设的防御协议被触发。一个强力而持久的精神干扰脉冲被释放出来，覆盖了大部分交战区域。所有非黑蝎战斗人员的行动都受到了持续性干扰。
armygroup_event_desc_244=在黑蝎计划失败的最后时刻，各遗迹预设的防御协议被触发。一个强力而持久的精神干扰脉冲被释放出来，覆盖了大部分交战区域。所有非黑蝎战斗人员的行动都受到了持续性干扰。
