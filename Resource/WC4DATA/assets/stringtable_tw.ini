feat_desc_149=本回合内，消灭{1}个单位后，射程+{2}，持续1回合。
feat_desc_149_Lv2=本回合内，消灭{1}个单位后，射程+{2}，持续1回合。
feat_desc_149_Lv3=本回合内，消灭{1}个单位后，射程+{2}，持续1回合。

feat_desc_150=每次造成致命一击后，有{0}%概率对该目标造成{1}%的额外伤害。

feat_desc_151=进入突击状态，使本回合造成的所有伤害增加{1}%，无视地形对行动力的影响，持续1回合，冷却3回合。
feat_desc_151_Lv2=进入突击状态，使本回合造成的所有伤害增加{1}%，无视地形对行动力的影响，持续1回合，冷却2回合。
feat_desc_151_Lv3=进入突击状态，使本回合造成的所有伤害增加{1}%，无视地形对行动力的影响，且无视下海时对行动力的影响，持续1回合，冷却2回合。

legend_chapter_5=勒克莱尔师

legend_army_5=勒克莱尔师

legend_stage_50101=库夫拉突袭
legend_stage_50102=拳击手行动
legend_stage_50103=法莱斯合围
legend_stage_50104=巴黎解放
legend_stage_50105=栋派尔战役
legend_stage_50106=斯特拉斯堡冲刺

legend_intro_50101=勒克莱尔师，开端自一个男人执着的爱国热忱。1940年，勒克莱尔抵达北非，成功劝服乍得总督，成立了“勒克莱尔纵队”。为了给自由法国打出声势，1941年，勒克莱尔带领部队横跨沙漠突袭了意大利控制的利比亚-库夫拉机场。在占领了库夫拉机场后，勒克莱尔带领士兵在机场立誓，必将国旗扬于斯特拉斯堡。这就是这段传奇的起源。
legend_intro_50102=由于自由法国在北非的数次军事胜利，“勒克莱尔纵队”声名也获得更多的认可。于是，1943年，“勒克莱尔纵队”获得增援，加入英第八集团军参与了突尼斯战役。在梅德宁战役和马雷斯防线战役中，面对德军装甲部队的轮番进攻，勒克莱尔纵队成功抵挡。后来，“勒克莱尔纵队”跟随盟军一路打入突尼斯，终结了北非战役。
legend_intro_50103=北非战役后，“勒克莱尔纵队”改编为法国第2装甲师，依旧由勒克莱尔带领，又称为“勒克莱尔师”。该部队于1944年开往法国，开启兑现誓言的征途。在法莱兹包围战中，第2装甲师跟随巴顿的第3军从南部合围德军，几乎摧毁德军第9装甲师和其他单位的实力，为解放法国打下了坚实的地基。
legend_intro_50104=法莱斯包围战结束后，“勒克莱尔师”的位置就已经相当接近巴黎了。为了尽快解放巴黎，勒克莱尔强硬请求盟军高层允许向巴黎进军，在政治斡旋后获得同意。勒克莱尔马上前往已经开始起义的巴黎。8 月 24 日，“勒克莱尔师”在城内起义军的配合下攻入巴黎。城内的德国守军在盟军的压力下，于25日投降。自此，自由的旗帜重新飘扬在巴黎上空。
legend_intro_50105=收复巴黎后，勒克莱尔师被安排加入阿尔萨斯-洛林地区的收复行动。9月初，缺乏经验的德军第 112 装甲旅遭受了第 2 装甲师在美国空中支援下的一系列伏击。法军装甲师和美军轰炸机联合摧毁了德军旅的大部分部队，伤亡很少。德军被迫撤退，推迟了原定的洛林反攻。
legend_intro_50106=11月22日，得到盟军指挥部的肯首，法国第2装甲师和法国第1集团军一起向斯特拉斯堡发起进攻。第 2 师强行突破萨韦尔讷峡并大胆推进，破坏了德军在阿尔萨斯北部的防御，并于 1944 年 11 月 23 日解放了斯特拉斯堡。兑现了“库夫拉誓言”。

synergy_tactics_5_1=・所有“勒克莱尔师”单位发起攻击后，为周围2格内“勒克莱尔师”单位赋予“复国誓约”1回合；复国誓约：不会进入混乱状态。
synergy_tactics_5_2=・战斗鼓舞：“勒克莱尔师”装甲单位在“复国誓约”状态下主动击杀敌军后，周围2格内“勒克莱尔师”单位士气上升1个等级，每单位1回合1次。
synergy_tactics_5_3=・内外策应：“勒克莱尔师”火炮单位在“复国誓约”状态下，攻击城市或堡垒时，若攻击目标周围1格存在“勒克莱尔师”步兵或装甲单位，伤害提升10%。
synergy_tactics_5_4=・援护追击：“勒克莱尔师”步兵单位在“复国誓约”状态下发起攻击后，2格范围内的“勒克莱尔师”部队本回合移动力+5。

dialogue_4204=法国本土已经陷落于德国手中，我们终有一日，将光复我们的祖国。
dialogue_4205=意大利在库夫拉有军用机场，我们需要占领它。向世界证明法国的不屈。
dialogue_4206=意军部队谨守堡垒，并尝试联系援军支援。
dialogue_4207=敌军的兵力收缩进堡垒了。保持压制，不能让他们联系到援军。
dialogue_4208=意军放弃抵抗，与法军协议投降。之后，勒克莱尔在库夫拉立下了“库夫拉誓言”。
dialogue_4209=我宣誓：只有当我们的旗帜，我们美丽的旗帜，飘扬在斯特拉斯堡大教堂上空的那一天，才放下武器。
dialogue_4210=接到消息，德军第9装甲师明日会通过克萨尔·吉拉内发起攻击。我建议你部后退80公里避免打击。
dialogue_4211=不行，现在撤退容易在撤退途中被追击。我部会依托现有阵地防守，但需要空军支援。
dialogue_4212=追击，不能让他们轻易逃脱！
dialogue_4213=来了，到有效射击距离再发动进攻。
dialogue_4214=做的好！接下来会有一批部队经过。掩护好他们的侧翼，和他们一起袭击特巴加隘口。
dialogue_4215=特巴加隘口失守？迅速撤退，不能落入敌人的包围圈。
dialogue_4216=向北推进到阿让唐，与加拿大军会合，将德军封死在口袋里！
dialogue_4217=前进！解放我们更多的领土！
dialogue_4218=把第352步兵师调到阿朗松，阻止盟军继续推进。
dialogue_4219=成功占领阿朗松，德军重要补给基地被占领，德军放弃反击计划转入防御。
dialogue_4220=把第116装甲师调到阿让唐，保护好我们的撤退出口。
dialogue_4221=波兰第1装甲师成功在奥尔梅尔山脊建立阵地，封堵了德军的最后出口。
dialogue_4222=指挥权已转移给我。B集团军群听令：舍弃阵地，向东撤退。援军会全力接应。
dialogue_4223=在法军积极争取后，盟军最终允许法国第2装甲师和美国第4步兵师一同行动，支援巴黎的起义军，防止再次出现华沙起义的惨剧。
dialogue_4224=不用等美军了，迅速突进！巴黎的起义军已经开始行动了。我们不能让他们孤立无援！
dialogue_4225=勒克莱尔师抵达巴黎郊外，与巴黎起义军获取了联系。
dialogue_4226=击溃郊区防线，给德军示威！告诉巴黎的人民，我们来了！巴黎将重获自由！
dialogue_4227=第4步兵师迅速向巴黎推进，不能让法国人独占这份功勋。
dialogue_4228=德国守军接到总部命令，要求他们死守巴黎。巴黎如果不变成一堆废墟，就决不能落入敌人手中。
dialogue_4229=这就是让我们陪葬！先拖住那个疯子。回电总部：我们会遵照执行。
dialogue_4230=我们要和盟军谈投降条件。我们不能为了别人送死！
dialogue_4231=德国巴黎守军最终和盟军谈判投降，巴黎城内战斗结束。郊外守军未知晓消息，依然与盟军交战。
dialogue_4232=巴黎曾被羞辱！巴黎横遭摧毁！巴黎饱受折磨！但巴黎终于自由了！
dialogue_4233=接到消息，敌军派来了精锐装甲旅支援米尔库。我们要尽快前往栋派尔阻击援军。
dialogue_4234=米尔库的情况岌岌可危，我们必须迅速支援前线。
dialogue_4235=维泰勒的德军来阻止我们了，必须尽快解决。不然援军赶来我们就陷于不利之地。
dialogue_4236=我们抢在援军到来之前，占领了栋派尔。通知空军准备空袭支援，我们要在这里歼灭敌军。
dialogue_4237=我们来迟了，迅速支援米尔库不能让美军被内外夹击。
dialogue_4238=就是现在，开火！
dialogue_4239=寻找掩体，自由反击！
dialogue_4240=我们已经被包围了。抛弃坦克，全力撤退！
dialogue_4241=继续进攻，消灭摩泽尔河西岸德军。
dialogue_4242=斯特拉斯堡近在眼前，誓言即将兑现。战士们，奋战吧！法国万岁！
dialogue_4243=孚日山脉被重兵把守，我们需要找到一条无人把守的小道突破到后方。
dialogue_4244=坚守孚日山脉。他们无法通过！
dialogue_4245=他们是怎么闯过孚日山脉的！
dialogue_4246=把难啃的骨头丢给美军，全力向斯特拉斯堡冲刺！
dialogue_4247=电告斯特拉斯堡，孚日山脉被突破，务必做好防守！
dialogue_4248=斯特拉斯堡解放了！我们完成了我们的誓言！
dialogue_4249=拿下周围据点，斯特拉斯堡不容有失！
dialogue_4250=维持住对孚日山脉的压力，不能让德军支援后方！
dialogue_4251=意大利援军开始行动。
dialogue_4252=克萨尔·吉拉内那边肯定气氛紧张了。那个老好人勒克莱尔，他真是个好人。但现在一切都结束了，我们再也见不到他了。
dialogue_4296=敌军抢占了全部的制空权。这里无法坚守，迅速撤离。
dialogue_4297=意大利守军放弃求援，坚守堡垒。
dialogue_4298=加大火力，击碎他们的抵抗意志！
dialogue_4299=巴黎的德军守军向盟军投降，城市获得解放；但郊外德军因未获知消息，仍在与盟军交战。


