event_intro_4107=苏军通过实施严密的战役伪装，包括利用夜间调动部队、构筑假阵地等措施，成功完成了主力的隐蔽集结。1942年11月19日，苏军向德军两翼的罗马尼亚军队阵地发起大规模进攻，迅速突破防线。德军对苏军的进攻规模与意图判断失误，导致南北两路苏军顺利会师，最终将德军第6集团军及部分第4装甲集团军的单位彻底合围。此役扭转了东线战场的战略态势。
event_intro_4108=1943年11月20日，美军在强大海空火力支援下于塔拉瓦环礁实施两栖登陆。由于潮汐高度远低于预期，许多部队被迫在远离海岸的地区涉水上岸。与此同时，日军已针对登陆作战加强了岛上防御，在滩头对美军造成严重杀伤。经过四天激战，美军以巨大代价全歼守军。此战为美军提供了宝贵的两栖作战经验，潮汐预报与水文勘测的重要性由此被提升至前所未有的高度。
event_intro_4109=为夺取东南亚战略资源并打破美国的经济制裁与石油禁运，日本海军于1941年12月7日对美国夏威夷珍珠港海军基地发动突袭。日军出动六艘航空母舰，分两个波次实施空袭，以极小代价重创美军太平洋舰队。尽管击毁大量飞机与舰船，但美军三艘航母均因不在港内而逃脱。次日美国对日宣战，太平洋战争爆发。
event_intro_4110=意军入侵埃及后在西迪巴拉尼暂停进攻，转而修筑防御工事并建立多处军营，等待后续支援。1940年12月8日，英军对该地意军营地发动突袭。由于行动前严格保密，意军措手不及、仓促应战，大批人员被俘。此役成果远超预期，英军随即乘胜追击，将突袭发展为“罗盘行动”的战略反攻。

dialogue_4146=在舰炮的掩护下全力完成抢滩登陆！
dialogue_4147=潮汐高度低于预期！登陆艇吃水较深，已经无法再靠近。
dialogue_4148=岛上的日军已经被分割，我们掌握着绝对的优势。提高警惕，消灭最后的这些敌人。
dialogue_4149=日军突然向登陆部队发起猛烈的反击。
dialogue_4150=这次不是演习！向意军的军营发起进攻，打他们一个措手不及！
dialogue_4151=注意敌人的主攻方向。英军的主力部队在我们后方的沙漠中。
dialogue_4152=敌人正在全线崩溃。继续进攻，扩大战果！
dialogue_4153=意军的核心兵营逐个失陷，整条防线开始动摇，部队逐渐陷入混乱。


