dialogue_4500=温哥华的守军已被击溃，西海岸的补给线已被打通。
dialogue_4501=行动开始！消灭苏军在古巴全境部署的导弹基地。
dialogue_4502=战机编队已经从基地出发。继续进攻，我们有绝对的空中优势。
dialogue_4503=尽快派出援军夺回纽约，我会在援军抵达前死守住自己的位置。
dialogue_4504=这是一场蓄谋已久的叛乱！绝不能放走这些叛军。
dialogue_4505=北约各国的援军已经抵达作战海域，优先打破格陵兰岛的包围圈。
dialogue_4506=吞并正在发生。妥协意味着失败，而我们不会失败！
dialogue_4507=登陆部队的进攻并不顺利，我们已派遣了新式的战机进行支援。
dialogue_4508=伪装到此为止了。我们的第一任务是抵挡住美军的北上，为奥斯本的东进创造条件。
dialogue_4509=前线的一部分部队临阵倒戈了！加拿大人恐怕无法处理这些问题，我们必须尽全力平定这场叛乱。
dialogue_4510=我们收到的命令是迅速驰援挪威，切断苏军的海上补给线。
dialogue_4511=低地国家已遭到苏军入侵，西德与法国恐怕也坚持不了多久了。
dialogue_4512=大量的叛军出现在列宁格勒周围，我们即将被彻底包围！
dialogue_4513=近点的威胁已经解除，把苏军全部赶回波罗的海。
dialogue_4514=截断苏联海军的退路，全速向波罗的海海域前进。不能再放走奥斯本了！
dialogue_4515=基地的最高权限已经解锁。未来充满着无限可能，现在即便只有我一个人也能亲手终结这一切。
dialogue_4516=我们还是晚到了一步。
dialogue_4517=不要与他接触，优先占领回声地堡。
dialogue_4518=不愧是你们，居然能推进到这里。现在只剩下一个办法了。
dialogue_4519=信标增幅器即将被激活，受到影响的人自主意识将逐渐被抑制，最终加入黑蝎。
dialogue_4520=马尔蒂尼的人已经离苏军不远了，尽快帮苏军解围，奥斯本随时可能会出现。
dialogue_4521=感谢你们的及时支援。因不明势力的介入，我们恐怕正在输掉这场战争。
dialogue_4522=英国那边的麻烦已经被彻底解决，现在我们可以直接干预这场战争了。
dialogue_4523=重新制定作战计划！以消灭奥斯本为第一优先。
dialogue_4524=德军的越界行为已经威胁到了我们。立刻向巴塞罗那前进，阻止那里的德军与意军。
dialogue_4525=无论是德意还是苏联，都不能让他们的势力在这里扎根。消灭他们。
dialogue_4526=政变成功了。英美的行动极其隐蔽，他们在这里安插了大量的间谍与作战人员。
dialogue_4527=奥斯本正在借助他们的力量将自己的设想转为现实。不能再让这里的问题复杂化了。
dialogue_4528=人民不需要新的国王，必须把奥斯本的势力从这里根除。
dialogue_4529=虽然收到了撤退命令，但我的部队会继续为你们提供支援。
dialogue_4530=伊朗南部的行动非常成功，英美联军已经退至霍尔木兹海峡。奥维兰，我们相信你会做出正确的选择。
dialogue_4531=美军已经被奥斯本的人渗透，我们不会坐以待毙。
dialogue_4532=情报局低估了地区局势的复杂程度，当务之急是查清这背后的势力。撤退！
dialogue_4533=等待尤丁采夫的部队接应我们撤退！我们会抵挡住苏军的进攻。
dialogue_4534=优先摧毁各类导弹发射装置，降低撤退时的防空压力。我们绝不能有任何一人倒在这里。
dialogue_4535=各地局势看似风平浪静，实则暗流涌动。一旦分崩离析，就能清除美苏内部奥斯本的势力。
dialogue_4536=识时务者为俊杰，通机变者为英豪。暂时撤退养精蓄锐，我们的战斗才刚刚开始。
dialogue_4537=苏军已经越界，我们不会与华约北约任何一方结盟。
dialogue_4538=那是当然，我们不会放过任何一个消灭奥斯本的机会。
dialogue_4539=正如你所见。
dialogue_4540=东方集团内部的分裂为我们提供了一个机会。
dialogue_4541=没有永远的朋友，也没有永远的敌人。我们的机会来了。
dialogue_4542=奥斯本与美军的合作越来越密切，整个北约正在被他拖入一场无止境的战争。
dialogue_4543=东部的战局已经无法挽回。奥斯本正是这一切混乱的始作俑者。
dialogue_4544=我们已与新加州联盟达成了协议。全力进攻，这场战争需要尽快完结。
dialogue_4545=我的部队会在这里挡住敌人的进攻。尽快终结这场混乱。
dialogue_4546=没人比我们更懂奇袭。
dialogue_4547=奥斯本正在向太阳要塞的方向撤退！
dialogue_4548=盯住德州美军的动向，我们会向南追击并消灭奥斯本的部队。
dialogue_4549=美国不需要一个软弱的总统。主动出击，向西海岸前进。
dialogue_4550=一切都是这么的熟悉，但是这次不会再有捷径了。
dialogue_4551=黑蝎的部队海路并进，留给我们的时间不多了。
dialogue_4552=与其他的基地一样，幽灵岛周围部署了重兵把守。
dialogue_4553=这些没有灵魂的躯壳并不会是我们的对手。
dialogue_4554=他早已不是最初的奥斯本了。结束这一切是我们的使命。
dialogue_4555=这场噩梦持续了太久。
dialogue_4556=现在和我们一起阻止他还来得及。
dialogue_4557=我不会为之前的决定而后悔，其他黑蝎们将战至最后一刻！
dialogue_4558=现在敌人已经群龙无首了，胜利就在眼前。而引发这一切的技术应该被永远地封存起来。
dialogue_4559=彻底消灭残余的敌军，重新夺回南极基地！
dialogue_4560=卫星控制权已被成功劫持。卫星武器已上线。
dialogue_4561=伊拉克军队在德国的空军掩护下对我们的营地发起了一波接一波的进攻。
dialogue_4562=尽可能避免无谓的战斗，全速为哈巴尼亚的友军解围。
dialogue_4563=已与友军会合。清除周边的威胁后继续向费卢杰进攻。
dialogue_4564=敌军的空中优势已不复存在。
dialogue_4565=轰炸机并没能摧毁桥梁，德军装甲部队在空中火力的掩护下正在强渡默兹河。
dialogue_4566=敌人的火炮和空军都已经被压制。全速前进！
dialogue_4567=法军正在撤退。尽快打开一个突破口，拦截敌人的主力部队。
dialogue_4568=盟军投入了大量的坦克开始向阿拉斯南部的德军阵地发起进攻。
dialogue_4569=既然无法穿透英军坦克的装甲，那就把88炮作为反坦克炮使用！
dialogue_4570=盟军已经没有多少装甲部队能够支撑他们的攻势了。反击现在开始！
dialogue_4571=第8军团的主力已被牵制在正面战场。向图卜鲁格方向进攻，切断敌人的退路。
dialogue_4572=德军的进攻矛头已经穿插至我们后方，再不后撤就要被完全包围了。
dialogue_4573=现有的兵力并不足以再守住图卜鲁格一次。向东撤退吧。
dialogue_4574=德军的武器装备已陆续运抵前线。在苏联人发动进攻前继续加固VKT防线。
dialogue_4575=拦住撤退的芬兰人，不要让他们逃进下一道防线。
dialogue_4576=维堡已经成功拿下，但我们的进攻却在VKT防线上屡次受阻。
dialogue_4577=1939年9月1日，在苏德秘密签订《苏德互不侵犯条约》后，德军悍然入侵波兰。

