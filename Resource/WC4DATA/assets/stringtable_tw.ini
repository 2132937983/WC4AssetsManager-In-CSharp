event_stage_intro_20116=克里米亚作为黑海上的一颗珍珠，具有重要的军事地位。我们的装甲师已被调往中央集团军，目前仅有步兵和火炮可用。然而，增援的古斯塔夫巨炮将助我们轰开塞瓦斯托波尔的要塞。
event_stage_intro_20117=我们的进攻势如破竹。哈尔科夫是一个重要的工业城市，我们必须加速前进，不要让苏联在我们攻下哈尔科夫之前转移那些工厂和设备。
event_stage_intro_20118=布良斯克和维亚济马是阻挡我们通往莫斯科的最后障碍，我们需要削弱敌军的防线并扩大战略空间，以便为进攻莫斯科做好准备。
event_stage_intro_20119=伏尔加河畔的斯大林格勒是高加索地区重要的工业中心，拥有大量的石油和天然气资源。敌军投入了大量兵力进行防守，只有攻占斯大林格勒才能打击苏联士气，为东线战场的胜利铺平道路。
event_stage_intro_20120=莫斯科的严寒对我军的交通和后勤补给造成了严重的影响，敌军的抵抗已经远比当初猛烈。然而，这无法阻止我们的前进。我们将在克里姆林宫品尝胜利的香槟。




