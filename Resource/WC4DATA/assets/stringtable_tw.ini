armygroup_event_desc_123=苏军在白令海峡北部率先冲破冰幕，登陆阿拉斯加并占领了诺姆。美苏再次全面开战。
armygroup_event_desc_124=以美英法为首的北约军队再度向朝鲜发起了进攻，在日韩的协助下一路北上。朝鲜人民军顽强抵抗，苏军不断向远东地区调集兵力，将战线维持在了苏维埃港一带。
armygroup_event_desc_125=黑蝎在远东与阿拉斯加潜伏的部队乘势展开行动，配合在各地扶植的武装部队，在各国部队后方发动突袭。
armygroup_event_desc_126=美、英、澳、苏多国海军追击黑蝎舰队时，在白令海中部遭遇强烈电磁风暴，一座此前未知的、拥有先进设施的岛屿出现。黑蝎在太平洋的总部遭遇各国舰队的围攻。
armygroup_event_desc_127=美、英、澳、苏的特遣队对白令海海域各地的黑蝎基地发动了一系列的海空立体突击，黑蝎的多个要塞据点相继被摧毁。
armygroup_event_desc_128=黑蝎寒霜军团的指挥体系被摧毁，极地志愿兵团失去了大量的军备援助，被迫投降，重新加入华约。
armygroup_event_desc_129=黑蝎永夜军团的指挥体系被摧毁，北境自由同盟的内部产生了混乱，大量士兵溃逃，部队被迫投降，重新加入北约。
armygroup_event_desc_130=黑蝎暗潮军团的指挥体系被摧毁，太平洋解放阵线被多国部队围困，部队被迫投降，重新加入北约。
armygroup_event_desc_131=黑蝎势力再次迅速发展壮大，美苏双方为根除这一威胁决定联手。华约与北约暂时停战，结成了新的军事同盟。
armygroup_event_desc_132=奥斯本被彻底击败，黑蝎在远东地区的计划被彻底挫败。但各地的黑蝎残部依然存在，时刻威胁着周边国家与地区。
armygroup_event_desc_133=苏联飞行员驾驶最先进的战斗机叛逃，降落在日本。美国宣布给予他政治庇护。美日的技术人员将战机拆解并进行了详细分析。
armygroup_event_desc_134=西伯利亚雅库特地区正午时分天空突然黑暗持续约三小时，大规模森林火灾产生的浓厚烟尘向东飘散，对在附近作战的部队产生了严重的影响。
armygroup_event_desc_135=在阿拉斯加遭到入侵后，美军与加拿大军队组织了一场大规模反攻。多方势力在安克雷奇北部展开混战，苏军的进攻矛头被削弱。
armygroup_event_desc_136=黑蝎组织支持的北境自由同盟同时袭击了费尔班克斯的空军基地和安克雷奇的港口，试图在苏军正面发起进攻时偷袭美军后方，率先控制阿拉斯加。
armygroup_event_desc_137=通古斯河附近再次发生剧烈爆炸。陨石的空爆摧毁了大片森林。在事发后数天内，亚洲与欧洲的夜空呈现出暗红色。多国的卫星都记录下了这一过程。
armygroup_event_desc_138=一支由英法特种部队组成的联合特遣队，在千岛群岛上搜寻并摧毁了黑蝎组织的秘密通讯中继站。行动短暂中断了暗潮军团与太平洋阵线之间的通讯。
armygroup_event_desc_139=美苏两国海军在白令海峡的圣劳伦斯岛附近爆发大规模海空战，双方均投入了大量战机与轰炸机。
armygroup_event_desc_140=随着战争陷入僵局，美苏两国内部的肃反运动变得愈加残酷。为清除对方安插在内部的间谍，以及疑似被黑蝎渗透的部队，导致大量冤案的产生。
armygroup_event_desc_141=一艘搭载有核弹头的苏联潜艇在奉命前往白令海战区时，突然切断联系并驶向黑蝎控制的“幽灵岛”方向。
armygroup_event_desc_142=黑蝎暗潮军团在撤离札幌前夕，破坏了当地的核电站。大量放射性污水流入大海，导致周边海域的海洋生物大量死亡，多个港口被长期封闭。
armygroup_event_desc_143=在盟友的支援下，苏军向马加丹地区极地志愿兵团控制的战略导弹基地发动猛攻，引发惨烈巷战。
armygroup_event_desc_144=太平洋解放阵线在札幌南部和函馆周边发动协同攻击，成功切断了北海道与日本本州的联系。
armygroup_event_desc_145=韩国军队在美军顾问支持下，向鞑靼海峡西岸的苏联远东重要港口苏维埃港发起突袭。
armygroup_event_desc_146=勘察加半岛的多处活火山同时喷发，冰川下的熔岩不断向外喷涌，打乱了各方的军事部署。
armygroup_event_desc_147=阿拉斯加湾与白令海南部海域同时发生地震，引发的海啸席卷了阿拉斯加南部沿海地区，许多军事设施与军用装备遭到了摧毁。
armygroup_event_desc_148=费尔班克斯上空出现极光，其范围内所有电子设备，包括战机火控雷达，均短暂失灵。
armygroup_event_desc_149=一股异常寒流席卷楚科奇海岸，周围地区温度急速降低。各方军队紧急采取措施应对恶劣天气，但均承受了一部分的人员与装备的损失。
armygroup_event_desc_150=为应对苏联导弹与战略轰炸机的威胁，美加两国整合并升级了从阿拉斯加到加拿大腹地的远程预警系统，建立了紧密的北美防空同盟，提升了共同防御能力。
armygroup_event_desc_151=庞大的军事需求催生了电子、计算机、航空航天等领域的技术爆炸。这些技术在加利福尼亚等地的工业园迅速实现民用转化，为美国赢得了新一轮科技和经济竞争的先机。
armygroup_event_desc_152=苏联通过经济互助委员会体系，向其盟友蒙古、朝鲜等国家提供经济援助、能源供应和市场，维持了社会主义阵营内部的经济联系和稳定。


event_4114=向日葵行动
event_4115=第三次哈尔科夫战役
event_4116=春季攻势
event_4117=马塔潘角海战
event_4118=坊之岬海战
event_4119=霍兰迪亚战役

event_intro_4114=因意大利军队在北非战场面对英军时接连受挫，德国国防军最高指挥部于2月6日决定介入以稳定战局。在随后几个月，德军部队（后整编为非洲军团）陆续抵达北非，将意军的溃败一举扭转。隆美尔的进攻决策取得了巨大的成功，但过长的补给线为后续漫长的消耗战埋下了伏笔。
event_intro_4115=苏军在斯大林格勒战役胜利后乘胜追击。曼施坦因放弃了正面防御，先集中装甲兵力击溃冒进的苏军西南方面军，再回师北上，经激烈巷战重新占领哈尔科夫。整个行动由1943年2月19日开始，苏军付出了巨大的代价，但未能改变东线整体劣势。此战形成的“库尔斯克突出部”直接导致了数月后规模空前的库尔斯克会战。
event_intro_4116=1941年3月，在希意战争陷入僵局之际，为提振士气并将希腊军队逐出意大利控制的阿尔巴尼亚地区，意大利独裁者于3月9日亲自下令发动“春季攻势”。此次行动中，意军在前线发射了十万多发炮弹，累计伤亡逾万人，却未能实现任何战略突破。攻势的失败直接导致德国不得不介入巴尔干战局，从而彻底改变了希意战争的走向。
event_intro_4117=1941年3月底，英国情报机构首次成功破译意大利海军使用的恩尼格码密码，从而掌握了其舰队动向。3月27日，英国海军据此情报在马塔潘角附近海域实施拦截，击沉多艘意大利舰船，并将意大利舰队彻底逐出东地中海控制区。
event_intro_4118=冲绳战役期间，为吸引盟军海空力量从而增加神风特攻队成功的机会，联合舰队组建了以战列舰大和号为旗舰的特攻舰队，企图让其突入冲绳海域，在座礁后作为固定炮台支援防御，进行自杀式攻击。最终大和号在美军数百架舰载机发起的多波次空袭中被击沉。此役标志着日本海军主力舰队的彻底覆灭，联合舰队基本丧失了作战能力。
event_intro_4119=为突破日军在新几内亚的防线，美军于1944年4月22日发起登陆作战。通过战术欺骗和强大的海空火力准备，美军成功登陆并迅速占领机场和港口，切断了日军增援，将敌人分割包围。此役是“跳岛战术”的成功典范，避开了日军在新几内亚东部的重兵集团，美军以较小代价实现了战略目标。

dialogue_4312=继续进攻，英军已无力迅速组织起有效的反击。
dialogue_4313=苏军的侧翼已经过分延伸。立刻发动进攻，切断他们的补给线，包围哈尔科夫。
dialogue_4314=德军的攻势异常凶猛，我军在哈尔科夫方向已无法继续坚守。先向东撤退吧。
dialogue_4315=日军舰队正在向冲绳前进。立刻出动空中力量阻止敌人，其他舰艇做好海上拦截的准备。
dialogue_4316=大和号已被击沉，日军舰船正在撤退。
dialogue_4317=我们拥有绝对的海空优势，日军的防御体系几乎被瓦解。立即登陆。


skill_name_176=马雷斯防线
skill_name_177=星陨
skill_name_178=天罗地网
skill_name_179=体系作战


skill_info_176=自身处于山地和沙漠时，自身和周围1格友军受到伤害降低[#00FF00#%d%%]。指挥陆地部队时“谣言”技能概率提升25%%，回合结束时周围2格有士气降低或混乱的敌军，则自身和周围1格友军恢复上限10%%的HP。
skill_info_177=指挥部队进攻时有[#00FF00#%d%%]概率对目标造成一次Ⅱ级卫星攻击。指挥空中悬停部队时额外提高30%%本次卫星攻击伤害。
skill_info_178=指挥部队周围3格的敌军降低[#00FF00#%d%%]防御且受到核弹、卫星攻击、无人机战术引爆伤害提高20%%
skill_info_179=指挥部队攻击和空袭时有[#00FF00#%d%%]概率造成致命一击。

dialogue_4318=难以置信，意大利人居然真的劝服了元首。这次我们可不能重蹈覆辙。
dialogue_4319=轰炸结束，第一批空降部队已经到位。预祝作战顺利！
dialogue_4320=敌袭！通知所有备战部队进入作战状态，务必守住机场！通知皇家海军，迅速支援马耳他！
dialogue_4321=皇家海军舰炮火力支援，掩护登陆部队。
dialogue_4322=第二批空降部队到位，尽快攻占瓦莱塔！
dialogue_4323=瓦莱塔已被攻克，现在，马耳他是我们的了！
dialogue_4324=向西北角撤退，皇家海军会支援我们撤离！
dialogue_4325=夺回机场，一定要保证我们空军能顺利起飞。
dialogue_4326=南部军队是攻克敌人的主力，必须保证南部军队突破敌人防线。
dialogue_4327=敌人按照预设从南部进攻了，各部队依计划行事。依托阵地，打退他们的进攻。
dialogue_4328=成功夺下英军阵地，协助装甲部队继续前进。
dialogue_4329=报告长官，前线部队反馈燃料已不够支撑进攻。
dialogue_4330=功亏一篑啊！通知前线部队停止进攻，维持战线，等待补给到位。
dialogue_4331=敌人的燃料快要耗尽，反攻的时机到了。全军出动，夺回我们的阵地！
dialogue_4332=作为意大利的精锐，必须要守住这个制高点，绝不能让我们的盟友看了笑话。
dialogue_4333=代尔穆纳西卜的高地对后续的行动十分重要。战士们，拿下那片阵地！
dialogue_4334=意大利人的火力怎么这么凶猛！装甲部队赶紧支援，用炮火压制住他们的反攻！
dialogue_4335=敌军的反抗十分顽强。以这个阵地做支点，保持火力压制，继续抢夺其他的阵地。
dialogue_4336=为夺回阵地，闪电师向后方发电请求支援。
dialogue_4337=代尔穆纳西卜阵地陷入危险，装甲部队迅速支援！
dialogue_4338=隆美尔现在因病休假，这是突袭的最好时机。出击，这一战我们要击败他们！
dialogue_4339=敌袭！全军进入作战状态，绝不能让敌军突破阵地！
dialogue_4340=成功占领前线阵地，依托阵地继续推进。
dialogue_4341=炮火覆盖失陷阵地！炮火结束后，立刻尝试夺回阵地！
dialogue_4342=火炮部队迅速加入战场，缓解前沿阵地的压力。
dialogue_4343=敌方阵地十分坚固，请求火炮支援！
dialogue_4344=隆美尔已经回归，北部战区的战局已经得到缓解。坚守阵线，转机就在眼前。
dialogue_4345=敌军正在集中部队，我们必须抢先出击，才能守住马雷斯防线。
dialogue_4346=踏出马雷斯防线，尽可能多地消灭盟军部队。
dialogue_4347=情报部门传来消息：敌人即将发起进攻。做好战斗准备！
dialogue_4348=很好！守住阵地，尽可能为友军打开进攻缺口。
dialogue_4349=南部第一道防线崩溃，预备队顶上，绝不能让敌人打进梅德宁。
dialogue_4350=装甲部队损失太大了。必须撤退，不然不够用于防守马雷斯防线。
dialogue_4351=前线部队稳住战线，后备队出动，夺回梅德宁！
dialogue_4352=英军抢占了恩菲达维尔防线的重要制高点。迅速夺回，绝不能让这道防线陷落。
dialogue_4353=敌人重新夺回了泰克鲁奈高地，请求后方支援。
dialogue_4354=太好了，支援终于到了！还有其他支援吗？没有？那看来只有我们了。
dialogue_4355=炮兵部队瞄准山顶开炮，逼迫敌人放弃山顶阵地。炮火结束后，迅速夺回高地。
dialogue_4356=德军阵地陷落，泰克鲁奈高地防守压力提高。
dialogue_4357=我们已经尽了最大的努力。坚持下去，或许其他的援军会来支援。
dialogue_4358=进攻！敌军绝不会有其他的支援了。拿下高地，恩菲达维尔防线就将形同虚设！
dialogue_4359=战士们，领袖为我们准备了充足的战备。在领袖的带领下，这一战，我们必将胜利！
dialogue_4360=继续进攻，加大火力！一定要把731号高地拿下来！
dialogue_4361=该死，希腊人是铁做的吗？顶着这么多炮弹都打反冲锋！
dialogue_4362=情报中的意大利舰队已经发现。做好战斗准备，争取将其一举歼灭！
dialogue_4363=发现英军巡洋舰队。巡洋舰试探性进攻，诱导敌舰向战列舰靠近，用战列舰的炮火消灭他们！
dialogue_4364=迅速撤退，不能让我们的舰队再受损失了。

dialogue_4365=两地的部队均已完成登陆。迅速向内陆推进，消灭机场周边的日军。


legend_intro_60101=第185伞兵师是意大利为实施空降作战而专门组建的部队。成立初期，该师曾为“C3行动”展开备战演练，计划与德军协同空降、夺取马耳他岛。然而，由于此前克里特岛登陆战役损失惨重，原定于1942年7月的行动被高层推迟。同年11月11日图卜鲁格失守后，“C3行动”最终被取消。此时第185伞兵师已于7月调赴北非战场，此后再未获得执行空降作战的机会。
legend_intro_60102=1942年7月，第185伞兵师被调往北非沙漠战场。这些本该如天际闪电般执行空降突袭的精锐，如今却要在无垠黄沙中建立功勋。8月29日，这支“闪电师”迎来了他们在北非的首场战斗。在阿拉姆哈勒法战役中，他们负责掩护德军装甲部队侧翼，接连攻占数处高地，于盟军防线内部建立起一个坚固的桥头堡。随后在盟军发起的“贝雷斯福德行动”中，该师又成功击退了意图夺回阵地的盟军部队，展现出其出色的作战素养与战斗力。
legend_intro_60103=1942年9月29日，为在即将到来的第二次阿拉曼战役中夺取有利地形，盟军发动了“布拉干萨行动”，意图攻占由第185“闪电师”驻守的阵地。面对盟军装甲部队的进攻，闪电师凭借构筑完善的战壕体系与灵活机动的战术部署，以轻步兵与有限火炮火力，成功击退了对方的装甲攻势，展现出其出色的防御作战能力。
legend_intro_60104=1942年10月23日，第二次阿拉曼战役正式打响。第185“闪电师”奉命固守战线南段，遭遇了由英军第13军（辖有著名的“沙漠之鼠”第7装甲师等部队）发起的猛烈攻势。在持续四天三夜的激烈防御战中，该师顽强守住了阵地，致使蒙哥马利不得不放弃在南线突破的计划，转而调整主攻方向。尽管在局部防御中展现出显著的战术韧性，但随着整体战局的迅速恶化，闪电师最终仍不得不随轴心国部队一同后撤，撤退过程中损失了大量的部队。
legend_intro_60105=阿拉曼战役后，残存的第185“闪电师”被调至马雷斯防线，担负阻滞盟军推进的任务。为拖延英第8军对该防线的进攻准备，轴心国军队于1943年3月发动了“卡普里行动”，向正在梅德宁地区集结的英军发起突击。此战中，闪电师作为突击精锐，成功渗透并攻占了部分英军阵地。然而因作战情报遭泄露，轴心国方面多数部队的进攻均告失败。闪电师虽取得局部突破，却因无法获得后续支援而被迫撤退。
legend_intro_60106=突尼斯战役末期，轴心国军队已退入连续防线作最后的顽抗。1943年4月20日，恩菲达维尔防线上的泰克鲁奈高地被盟军攻占。为稳住防线、迟滞盟军推进，轴心国指挥部派出第185“闪电师”仅存的部队发起反击，任务是夺回高地并拖住敌军攻势。这支最后的伞兵部队成功收复了泰克鲁奈高地，并在缺少支援的情况下坚守阵地一昼夜，直至弹药耗尽，才不得不放下武器。至此，这支本应在天空中实施突击的精锐力量，最终在一系列错误的战斗中湮没在北非的黄沙之中。

