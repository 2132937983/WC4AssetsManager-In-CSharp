elitepass_rule_2=2.每日挑战除了固定的登录游戏，剩下2个挑战任务随机生成，每天可以刷新3次挑战任务。
elitepass_rule_3=3.开启下一赛季的精英战令后，上一赛季未领取的奖励可以在打开精英战令时自动弹出领取。
elitepass_rule_4=4.未使用的高级精英战令和特级精英战令解锁次数，可以在下一赛季的精英战令开启后使用。
elitepass_rule_5=5.精英挑战任务中关于通关活动玩法的统计，以当前赛季开始后通关的次数为准。
elitepass_rule_6=6.解锁所有精英战令奖励后，每获得60点积分，可以获得额外奖励。奖励次数可以累积。
