dialogue_2944=英国的援军正在集结。向马特鲁港快速推进！不要做过多的停留。
dialogue_2945=意军的规模十分庞大。通知前方部队，且战且退。在援军到来后集中力量发起反击。
dialogue_2946=前方进攻受阻，我们的补给也无法维持这样大规模的攻势。各部队优先维持住战线，不要让英军突破。
dialogue_2947=我需要更多的支援来阻挡意军的进攻。
dialogue_2948=援军正在分批陆续抵达。我的舰队会解决海上的威胁。
dialogue_2949=主力部队已经顺利抵达了利比亚。我们会以最快的速度向东推进，清除昔兰尼加地区的英军。
dialogue_2950=我们的增援至今还未抵达。现在只能尽力拖住敌军，在必要时可以放弃阵地，向东撤退。
dialogue_2951=德军的进攻矛头即将抵达班加西。现在向图卜鲁格撤退，我们的守军会在那里构筑一道坚固的防线。
dialogue_2952=进攻开展的较为顺利，我的部队会继续向巴迪亚方向进攻。英军的主力就交给你们了。
dialogue_2953=伞兵部队已经抵达了预定位置周边，迅速攻占敌人的据点城市，在英国援军抵达前消灭克里特岛上的守军。
dialogue_2954=英军正在向克里特岛南部的海域集结。我的舰队会立即向敌军南岸的集结点发起进攻，阻止他们的撤退。
dialogue_2955=德军的伞兵已经登岛。坚守住岛上各地的据点和设施，海军援军即将抵达。
dialogue_2956=守军们战斗到了最后一刻，但已经没有更多的兵力来抵御克里特岛的德军了。
dialogue_2957=我的舰队无法在海上挡住德军的进攻。恐怕现在只剩撤退这一个选项了。
dialogue_2958=英军的反攻来势凶猛，但敌人并未集结重兵在一点进攻。
dialogue_2959=英军正试图包围我们的装甲部队。先撤回防线重新补给，为反攻做好准备。
dialogue_2960=英军仍然有着相当数量的装甲部队，想要突破塞卢姆南部的防线恐怕没那么容易。
dialogue_2961=向塞卢姆方向集结，重新建立一道防线，拦住东进的德军。
dialogue_2962=我们的攻势已经彻底失败了。现在必须集中剩余的力量击溃德军先头部队，重夺塞卢姆。
dialogue_2963=英军已经利用地形，在各关隘布置了重兵把守。想从正面突破恐怕会付出较大代价。
dialogue_2964=我的装甲部队会从图卜鲁格南部发起进攻，分割盟军的防守力量。
dialogue_2965=敌军有着规模庞大的装甲部队。正面抵挡我们将毫无胜算。向后方的阵地撤退，依托要塞和雷区进行防御。
dialogue_2966=德军已经攻入了我们的腹地，必须立即支援图卜鲁格，加固我们的防线。
dialogue_2967=德军的规模被严重错估了。但是即便现有的兵力不足以防守整个地区，我们也不能直接放弃图卜鲁格。
dialogue_2968=敌人已经是强弩之末了。继续向阿拉曼地区派遣援军，我们将在这里与德军决战。
dialogue_2969=我的部队会从阿拉曼南部向埃及的中心地带发起进攻。
dialogue_2970=反击进行的十分顺利，我们已经突破了意军的阵地，继续进攻。
dialogue_2971=敌人正在逼近苏伊士运河，我们需要更多的部队维持住开罗北部的战线。
dialogue_2972=英军在开罗周围仍有多个要塞据点。继续向东推进，小心敌人后续的增援。
dialogue_2973=封锁苏伊士运河，不要让敌人的舰队开进苏伊士湾！
dialogue_2974=盟军利用他们在地中海的海空军优势，不断干扰着我们的补给线和部队的运输。
dialogue_2975=在援军不足的情况下想彻底战胜盟军恐怕不太现实，撤退也会变得异常困难。我的装甲部队会尽全力守住突尼斯。
dialogue_2976=我们早已与盟军达成了协议。士兵们，为了法兰西而战。
dialogue_2977=全速前进。突破敌军的防线，重新建立与突尼斯守军间的联系。
dialogue_2978=一旦德军的主力回救成功，后果将不堪设想。我们正与时间赛跑，继续向突尼斯进攻。
dialogue_2979=盟军的数量过于庞大，我们已经无路可退。
dialogue_2980=消灭突尼斯境内所有的敌人，我们的反击即将开始。


event_106=斯大林格勒保卫战
event_intro_106=1941年，德国发起“巴巴罗萨”计划，席卷了苏联的广袤领土，红军在节节败退中挣扎求生，家园被摧毁，土地遭沦陷。到1942年，德军步步逼近，如同一股黑色的钢铁洪流涌向苏联的心脏。斯大林格勒，这座屹立在伏尔加河畔的城市，成为国家生死攸关的防线。对于苏联而言，这不仅是保卫一座城市，更是捍卫命运与尊严的战斗。整个国家仿佛一根绷紧的琴弦，等待即将在斯大林格勒上演的命运决战。

