synergy_tactics_7_1=・所有“大德意志师”单位，周围2格范围内每存在1个敌方单位，攻击力+2。上限20点。
synergy_tactics_7_2=・卫戍精英：“大德意志师”步兵单位周围1格存在“大德意志师”炮兵或装甲单位时，回合结束时，1格内“大德意志师”单位赋予1回合“卫戍”buff。（卫戍:周围1格内每存在1个友方单位，防御力+3，反击伤害+3%。）
synergy_tactics_7_3=・重装突破：“大德意志师”装甲单位周围1格存在“大德意志师”步兵单位时，若攻击后周围2格内无敌方单位，则使2格内“大德意志师”单位本回合行动力+5。（不可叠加）
synergy_tactics_7_4=・火力迟滞：“大德意志师”炮兵单位周围2格存在“大德意志师”装甲单位时，攻击后赋予攻击目标1回合“迟滞”buff。（迟滞：本回合行动力-3，最多叠加3次。）
synergy_tactics_8_1=・所有“第4近卫坦克师”单位，回合开始时周围1格每有1个“第4近卫坦克师”单位，本回合行动力+2，上限+6。
synergy_tactics_8_2=・火力探查：“第4近卫坦克师”步兵单位攻击后，周围2格内的“第4近卫坦克师”装甲单位获得1回合“开火预备”buff。（开火预备：下一次攻击伤害提升40%，攻击后消失。）
synergy_tactics_8_3=・集结突进：“第4近卫坦克师”装甲单位击杀敌方后，赋予周围两格“第4近卫坦克师”单位“集结”buff1回合。（集结：将自身受到伤害的30%分配给周围“第4近卫坦克师”单位。不会成为“弹道偏转”的对象。）
synergy_tactics_8_4=・炮火准备：“第4近卫坦克师”炮兵单位攻击后，赋予攻击目标1格内的敌方单位1回合“组织松散”buff。（组织松散：“第4近卫坦克师”步兵或坦克单位攻击后，士气下降1级。生效后消失，且本回合无法再次获得。）

legend_chapter_7=大德意志师
legend_chapter_8=第4近卫坦克师

