;战区规则
warzone_rule=战区规则
warzone_rule_1=1.每个战区分成普通关卡和首领关卡，只有普通关卡都通过后才能解锁首领关卡。普通关会显示本关主要的作战兵种。
warzone_rule_2=2.战区切换或者重置需要消耗指令点，指令点每天固定时间恢复。（UTC8:00和20:00）
warzone_rule_3=3.战区关卡采用积分制，对敌军造成伤害（包含堡垒及堡垒召唤的援军）就能获得积分，关卡结算后无法重复进入。每个战区的任意一关上阵的将领，本关通过后无法在当前战区的其他关卡继续上阵，建议提前规划分配将领。
warzone_rule_4=4.每个战区历史最佳分数达到一定数量可以领取一次性成就奖励，且每次通过首领关卡都会根据当前总分获得勋带奖励。（具体要求可以点击宝箱自行查看）
warzone_rule_5=5.每个战区历史最佳分数达到一定数量可以解锁扫荡功能，消耗一定数量扫荡券直接通关并获得勋带。

