skill_info_182=指挥步兵部队时提升[#00FF00#%d%%]伤害。指挥步兵部队空降后获得“蛙跳”状态：攻击时无视目标50%%防御力，歼灭敌军后，对目标周围1格的敌军造成15%%的伤害。（下海后无效）
skill_info_183=指挥步兵部队没有减益状态时，造成伤害+[#00FF00#%d%%]且歼敌后回复HP上限10%%的HP
skill_info_184=指挥装甲部队周围2格没有友军时，部队攻击力+40%%。指挥装甲部队周围2格内存在敌军时，反击伤害+[#00FF00#%d%%]
skill_info_185=指挥步兵部队时，致命一击伤害+[#00FF00#%d%%]，自身和周围1格的步兵+10%%致命一击概率。
skill_info_186=指挥装甲部队时，HP减少后攻击力不下降。指挥装甲部队HP低于50%%时，攻击力+[#00FF00#%d]，防御力+20。
skill_info_187=指挥装甲单位时，无视敌方部队[#00FF00#%d%%]防御力，无视地形减伤和将领勋带减伤，歼灭敌军后下回合行动力+3。指挥装甲单位时每2点行动力增加1%%致命一击概率和3%%致命一击伤害。

