elite_intro_97=鹞式战斗机是西方阵营中最具代表性的多用途垂直/短距起降战机，也是世界上首款实现实战化、体系化部署的V/STOL喷气式飞机。其可旋转喷口设计使其无需依赖传统跑道，可在前线简易机场或临时起降点灵活部署，显著提升生存性与机动能力。凭借稳定的悬停与低空机动性能，鹞式在近距空中支援和对地打击任务中具备持续压制高价值目标的优势。

elite_intro_98=Su-30V战斗机是苏霍伊设计局在冷战时期为华约阵营秘密研发的垂直起降战斗机项目，其外形与结构继承自Su-27、Su-30系列成熟平台，但在动力系统与飞控架构上进行了彻底重构。该机采用双发推力矢量喷口与分流升力系统，使其能够在缺乏跑道的前线区域完成短距起降，并可在低空状态下悬停，为地面部队提供持续空中火力支援。


