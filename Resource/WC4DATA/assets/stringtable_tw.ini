event_rule=规则
;集团军模式规则
armygroup_rule=集团军模式规则
armygroup_rule_1=1.本活动剧本限时开启，建议各位指挥官合理安排时间，通关并获取奖励。
armygroup_rule_2=2.完成集团军成就可以获得成就点数奖励，达到对应的点数后可领取阶段奖励。
armygroup_rule_3=3.集团军的规模与难度各不相同。通关后即可获得对应的通关奖励。
armygroup_rule_4=4.集团军模式中，玩家需要击败敌对阵营的全部集团军从而取得胜利。集团军只有在所有建筑被占领且所有部队被消灭后才会战败。宣战同国家的其他集团军后，会与所有的友军敌对。
armygroup_rule_5=5.各集团军有自己独特的援军与科技。击败敌对集团军后可以获得该集团军的援军，击败部分集团军后可以解锁对应的兵种科技。
armygroup_rule_6=6.消灭敌军部队和占领敌方建筑后会获得功勋值，通过累计一定数量的功勋值来提升功勋点数。消耗对应的功勋点数来招募援军、升级兵种科技。
armygroup_rule_7=7.消灭敌军部队和占领敌方建筑后会降低对应集团军的忠诚度。当忠诚度降至15%以下时，若玩家占领地区已达一定规模，且敌集团军城市已全部丢失，此时可通过招降功能强制使该集团军投降。

;招降描述
