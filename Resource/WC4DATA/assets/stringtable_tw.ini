legend_intro_10101=法国战场上，德国第7装甲师以“幽灵师”之名威震四方，而1940年5月21日的阿拉斯战役，正是其成名之路中最关键的一场淬炼。当日，该师作为先头部队奉命绕行阿拉斯向北推进，却意外遭遇英法联军预谋的反击力量，双方爆发激战。在突如其来的侧翼威胁下，第7装甲师一度陷入被动。然而，在隆美尔将军灵活果敢的指挥下，德军最终逆转战局，扭转危机。“幽灵师”之名，经此一役，愈加显赫。
legend_intro_10102=伴随着战争方向的调转，第7装甲师也开启了前往莫斯科的战斗。然而第一战“阿利图斯之战”就预示了一个惨烈的未来，第7装甲师与苏联第5装甲师在阿利图斯爆发一场坦克大战。第7装甲师最终击退了拥有200多辆坦克的苏联第5装甲师，占住了阿利图斯，打开了前往维尔纽斯的通路。
legend_intro_10103=1941年10月2日，第7装甲师从苏军正面突破，击溃了补防的苏军坦克部队，与第4装甲集群的第10装甲师完成了维亚济马包围圈。成功击碎了苏军的西线防御，向着巴巴罗萨计划的最终战场——莫斯科更近了一步。
legend_intro_10104=风雪呼啸，莫斯科的寒冬比以往更胜。漫长的补给线拖垮了德军，使他们不得不把攻克莫斯科的希望放在了这最后一击。1941年11月15日，第7装甲师隶属的第3装甲集群开始向莫斯科突破。凭借灵活机动，他们接连攻克克林和亚赫罗马，曾一度能遥望克里姆林宫，却最终在苏军的洪流中功败垂成。
legend_intro_10105=1943年，库尔斯克战役。久经战场的第7装甲师，此时作为一支偏师掩护第4装甲集团军的主力部队。他们依旧能在侧翼战场突破苏军防线，牵制住苏联近卫第7集团军，但这样的努力无法影响大局。随着主力部队于普洛霍罗夫卡失利，他们也不得不撤退。战场态势改变使他们再也无法像以前一样纵横驰骋。
legend_intro_10106=第二次基辅战役是第7装甲师最后一次在东线战场执行大规模机动作战。由于苏军以绝对的兵力优势进攻，第7装甲师撤出基辅，在法斯托夫-日托米尔一线灵活阻击苏军，并和援军夺回一度失守的日托米尔。虽未能扭转整个战线颓势，但为德军后撤重组争取了宝贵时间。
legend_intro_20101=美国第3装甲师的作战历史开始于诺曼底登陆。在登陆后，德军准备的树篱障碍一度阻碍着这支钢铁雄师。直到1944年7月的“眼镜蛇行动”，美军调动上千轰炸机对德军阵地实施“地毯式轰炸”，第3装甲师——“矛头师”随即挺进，凭借装甲机动优势撕裂溃散的德军防线，实现战役级别突破，打破了诺曼底僵局。
legend_intro_20102=“眼镜蛇行动”成功突破后，第3装甲师奉命挥师北上，直插法莱斯地区，与自北向南推进的加拿大和波兰部队形成合围之势。被围困的德军为求生路，发起了一轮又一轮的突围冲锋，却难以冲破第3装甲师的战线。此役近乎粉碎了德军两个集团军，而第3装甲师也在烈火考验中，再次证明了自己是盟军手中最锋利的长矛之一。
legend_intro_20103=1944年秋，第3装甲师作为第1集团军的先锋，以雷霆之势突破了齐格菲防线，兵临亚琛城下。在经历近两周惨烈的巷战，亚琛终于在10月21日被完全攻克。短暂休整后，第3装甲师于11月开始攻克许特根森林，复杂的森林地形限制了装甲机动，大量的战士牺牲在这片战场。在残酷巷战和茫茫密林的淬炼之后，这支部队不再只是进攻尖锋，更是一只适应了各种情况的坚韧之师。
legend_intro_20104=1944年12月16日，德军在阿登森林发动突然反攻。美国第3装甲师作为第1集团军的精锐预备队，被紧急调往北部战线，迅速在多个关键节点配合其他部队展开反击，成功瓦解了德军攻势。
legend_intro_20105=1945年3月，第3装甲师作为第1集团军先锋，从雷马根桥头堡向东全速突击，目标合围德军鲁尔工业区。4月1日，我师在利普斯塔特与北线美军会师，成功将莫德尔元帅的32万德军困于“鲁尔口袋”。经半月清剿，德军抵抗崩溃，莫德尔自杀，18日大规模投降。此役彻底粉碎了西线德军主力；第3装甲师以高速机动奠定胜局，却痛失师长罗斯少将，铸就胜利的丰碑，亦昭示荣光与牺牲。
legend_intro_20106=1991年2月，第3装甲师作为第7军主力，从沙特北部突入伊拉克防线。凭借M1A1坦克的科技优势，该师昼夜奔袭260公里，先后击溃伊军第9装甲旅和共和国卫队“塔瓦卡尔那”师。在诺福克坦克战中，以极小代价摧毁大量T-72坦克。百小时内，该师协同友军歼灭伊军10多个师，粉碎萨达姆精锐，以近乎零伤亡的战绩验证了现代装甲部队的绝对统治力，重塑陆地战争模式。
legend_intro_30101=1942年秋，黑海舰队水兵组成海军步兵第255旅，紧急驰援高加索战线。在图阿普谢方向的山林地带，他们以刺刀、手榴弹和莫辛纳甘步枪死守阵地，粉碎德军“阿提卡”攻势。在缺乏重武器的劣势下，凭借夜袭和迂回战术浴血奋战，于12月13日荣膺红旗勋章，用鲜血阻断了德军通往黑海的道路。
legend_intro_30102=1943年2月6日，海军步兵第255旅奉命在诺沃罗西斯克附近的梅斯哈科地区强行登陆，夺取并坚守后来被称为“小地”的登陆场。面对德军飞机、重炮的日夜猛攻，我们水兵与陆军兄弟在弹丸之地上掘壕死守，牵制了德军大量兵力，为后续解放高加索和塔曼半岛奠定了关键基础。
legend_intro_30103=1943年9月10日凌晨，海军步兵第255旅在舰炮掩护下于新罗西斯克港南侧强行登陆。面对德军密集雷区、铁丝网和岸防炮火，他们一寸寸啃下滩头阵地，为后续部队打开突破口。最终在第18集团军协同作战下，于9月16日攻克全市。此役为苏军夺取塔曼半岛、彻底终结高加索战事奠定基础，旅队也因此荣获“塔曼旅”荣誉称号。
legend_intro_30104=1943年11月，“塔曼旅”在风暴夜中强攻刻赤半岛埃利季根滩头。顶着德军探照灯与炮火封锁，他们涉血水夺取登陆场，死守36昼夜。在弹尽粮绝下，官兵以手榴弹与刺刀击退数十次反扑，科斯坚科上士更是堵枪殉国。此役虽代价惨重，但成功牵制德军主力，为北线苏军解放克里木奠定胜基。
legend_intro_30105=1944年5月，“塔曼旅”作为独立滨海集团军麾下的黑海舰队精锐，参与了解放塞瓦斯托波尔的复仇之战。此次行动彻底粉碎德军在克里米亚的最后堡垒，一雪1942年要塞陷落之耻。
legend_intro_30106=1944年8月，“塔曼旅”在雅西-基什尼奥夫攻势中强渡德涅斯特湾，夜袭阿克尔曼（今别尔哥罗德-德涅斯特罗夫斯基）滩头。他们顶着德军密集岸防火力，撕开德军防线，与第46集团军协同攻坚。经激烈巷战，8月23日攻克要塞，切断德军沿海退路，俘获甚众。此役为“塔曼旅”赢得二级库图佐夫勋章，彰显海军步兵两栖突击的致命锋芒。


