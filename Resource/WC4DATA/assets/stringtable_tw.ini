dialogue_2883=诸君，关岛现在毫无防备，必须尽快夺下!
dialogue_2884=第4装甲集团军向斯大林格勒突击，必须把第6集团军解救出来！
dialogue_2885=稳住阵地，确保包围圈完整！
dialogue_2886=第6集团军，抓住机会，尽快突围！
dialogue_2887=我们已经没有补给了。全军听令，放弃突围，等待救援。
dialogue_2888=突破敌军防线，穿过阿登山地，向安特卫普突击！
dialogue_2889=稳住阵线，绝不能让德军威胁补给！
dialogue_2890=各部队注意，向迪南集中，抵挡德军攻势！
dialogue_2891=补给已经到位！士兵们，复仇的时候到了，剿灭突出部的所有敌人！
dialogue_2892=军队已无力完成计划了。全军撤退，保存实力。
dialogue_2893=必须拿下巴斯托涅，保障部队安全通过阿登山区！
dialogue_2894=守住巴斯托涅，第三集团军很快就会增援！
dialogue_2895=快速突击，给巴斯托涅解围！
dialogue_2896=同志们，敌军的力量已经衰弱，击溃南方集团军群，解放乌克兰!
dialogue_2897=各部队必须坚守至最后一刻，绝不后撤!
dialogue_2898=奉元首命令，我来接替指挥。各部队稳固防线，交替后撤，保存实力。
dialogue_2899=瓦图京大将先行养伤，我来接替。全军听令，继续进攻！
dialogue_3100=德军沙恩霍斯特号已经出动，正在搜索我军护航队。击沉它!北极航线从此安全。
dialogue_3101=同志们，敌人残害了我们的同胞，杀害了我们的战友。我们必须为他们复仇！全军进攻！
dialogue_3102=敌人虚伪的招降，实际是要彻底消灭我们。将士们，坚守城市，等待救援，胜利一定属于我们！
dialogue_3103=布达佩斯已经无法防守了。能突围就突围，无法突围就投降吧。国家会记得我们的牺牲。
dialogue_3104=敌军大部队已经向北转移！瞄准薄弱部位，拿下斯特拉斯堡！
dialogue_3105=阿尔萨斯地区兵力薄弱，注意紧密防守。必要时，部队可撤至孚日山脉组织防线。
dialogue_3106=拿下斯特拉斯堡，把敌人赶出孚日山脉！
dialogue_3107=守住阵线，阿登山区的部队已经出发支援！
dialogue_3108=援助正在从美国运来，数千名士兵和数百架飞机正在被派出。我们的部队必须坚守，直到这些援军到达。不可能再撤退了。
dialogue_3109=我逃脱了，但是我必定回来！
dialogue_3110=老兵永不死，他们只是慢慢消逝。
dialogue_3111=你们可以俘虏我，巴丹也许会沦陷，但全世界热爱自由的人民的精神不会被击垮！
dialogue_3112=菲律宾，我回来了！各部队上岸后向东南推进，解放马尼拉！
dialogue_3113=远离海岸作战，避免敌军舰船炮火支援。守不下来就撤到山区打消耗战！
dialogue_3114=同志们，列宁格勒人民已经抵抗围困800多天。我们不能容忍这种境遇继续下去！进攻！解放列宁格勒！
dialogue_3115=列宁格勒已经解围，德军无法阻挡正义的胜利！同志们，继续追击！
dialogue_3116=屈希勒将军已被解职，现在由我来指挥。前线部队收缩战线，逐步撤至佩普西湖以西。
dialogue_3117=小股部队从左侧吸引敌军注意力，主力部队从右侧山区发起进攻，用“右勾拳”打穿防线！
dialogue_3118=依托山体和河谷来组织防线，任何一个阵地都不能放弃！
dialogue_3119=卡西诺上的修道院很可能是敌军的观察点。空军的轰炸马上到位。士兵们，拿下那片阵地！
dialogue_3120=士兵们，进攻！夺回法国的领土！
dialogue_3121=第19集团军马上撤离，不能被敌军围歼。
dialogue_3122=这一战的首要任务是消灭敌人。先从南北两侧完成包围，再对包围圈里的敌人发起进攻。
dialogue_3123=包围圈已经形成。同志们，进攻！消灭包围圈里的敌人！
dialogue_3124=迅速突围！包围圈外的部队迅速进攻，协助突围！
dialogue_3125=突出部部队快速撤离修整，其他部队稳固阵地。
dialogue_3126=先压灭奥卢周边城镇的敌军，再对抗南部敌军。战士们，战斗吧！为了独立的芬兰！
dialogue_3127=德国的支援已经到位，敌军训练水平不如我们。战士们，进攻！
dialogue_3128=敌方也有援军吗？战士们，切断运输线，延迟援军支援，胜利一定属于我们！
dialogue_3129=我会去国外继续斗争，直到一个独立和平的芬兰诞生为止！
dialogue_3130=你们在俄国的帮助下，纵使获得了胜利，但不会获得芬兰的独立！
dialogue_3131=日军的防守力量薄弱，这一战就让他们见识美国海军的厉害！
dialogue_3132=舰载机出动，用他们的身体验证航空母舰的威力！
dialogue_3133=各单位注意，敌方支援部队到了。加快行动速度！
dialogue_3134=同志们，敌人妄图用河岸负隅顽抗。让我们用炮火告诉敌人，为什么正义会胜利！
dialogue_3135=我们正站在祖国领土的边界上，任何的后退都会把战争通过空中及水路带向德国。我们绝不后退！
dialogue_3136=同志们，敌人曾一度阻碍我们前进。但此次，他们必须分兵别处。攻克防线，就在此战！
dialogue_3137=将士们，我们曾一度挡住敌军的攻势。这一次，我们依旧能做到！为了祖国！


event_208=黑蝎起源

