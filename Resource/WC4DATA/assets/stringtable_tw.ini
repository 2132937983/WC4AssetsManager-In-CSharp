feat_desc_43_Lv3=行动后可再次行动，再次行动时行动力+{2}，冷却1回合，第二次行动歼灭敌军后有{1}%的概率能够再次攻击（仅限一次）
feat_desc_46_Lv3=致命一击概率+{1}%，持续1回合，冷却2回合
feat_desc_47_Lv4=恢复1个友方目标{1}点HP，并且每回合额外恢复该目标100点HP，持续2回合。使用技能同时恢复自身HP{2}点。冷却1回合
feat_desc_49_Lv3=对陆地满血目标伤害+{1}%
feat_desc_50_Lv3=攻击敌方多个部队，对其他目标伤害不降低，造成的伤害+{2}%，致命一击伤害+{1}%
feat_desc_51_Lv3=本回合内攻击射程+2，攻击额外使目标城市或要塞HP降低{1}%（最高1200），守城部队HP降低{2}%（最高500），冷却2回合
feat_desc_52_Lv3=受到陆军、海军攻击时，有{0}%概率闪避该伤害，持续1回合，冷却2回合
feat_desc_53_Lv3=对装甲、火炮单位伤害+{1}%，持续1回合，冷却2回合
feat_desc_54_Lv3=对火炮单位伤害+{1}%，持续1回合，冷却2回合
feat_desc_55_Lv3=建造空军单位消耗金钱减少{1}%
feat_desc_56_Lv3=攻击时有{0}%的概率使敌方单位士气降低，并有相同概率使目标着火
feat_desc_57_Lv3=运输一个步兵、装甲车、野战炮或榴弹炮到目标地块，运输途中恢复HP{1}%，空运时无视防空武器
feat_desc_58_Lv3=攻击所有舰船时伤害增加{1}%
feat_desc_59_Lv3=对要塞单位伤害+{1}%,攻击陆地单位伤害+{2}%
feat_desc_60_Lv3=两格范围内最多可埋下2颗感应水雷，冷却1回合
feat_desc_61_Lv3=下次攻击可额外对目标一格范围内随机2个敌军造成伤害，冷却2回合
feat_desc_62_Lv3=对受到牵制、混乱的目标伤害增加200%。开启时使自身周围1格范围的敌军陷入不受士气上升影响的混乱状态，持续1回合，冷却3回合。影响2个或以上目标时，冷却为1回合
feat_desc_63_Lv4=对城防造成伤害提高{1}%
feat_desc_64_Lv3=溢出的致命一击概率将转化为额外伤害,每溢出{2}%，额外造成{1}%伤害，攻击时无视目标20%的防御力
feat_desc_65_Lv3=无视敌方部队{1}%防御力
feat_desc_66_Lv3=本回合对装甲单位伤害+{1}%，冷却2回合
feat_desc_67_Lv4=反击伤害+{1}%
feat_desc_68_Lv4=攻击后如果目标被歼灭，有{0}%的概率再行动一次，上限{2}次
feat_desc_69_Lv3=自身周围1格范围内友军攻击时，有{0}%概率自身参与攻击，造成的伤害+{1}%（受到领航效果影响时，该特性无效）
feat_desc_70_Lv3=攻击时对目标1格范围内其他目标造成{1}%额外伤害，持续1回合，冷却2回合
feat_desc_71_Lv4=攻击后可以额外攻击，最多生效{1}次。回合内每次攻击后，下次攻击造成的伤害增加20%，最多叠加3次
feat_desc_72_Lv4=可以使用机场内除运输机外的大部分飞机，飞机点数上限{1}点
feat_desc_73_Lv4=舰载机对装甲单位造成的伤害+{1}%
feat_desc_74_Lv4=有{1}%概率摧毁城市防空设施,并有{2}%概率无视防空武器的减伤
feat_desc_75_Lv3=被攻击目标周围一格范围内我方友军士气提升，攻击力+{1}%，持续3回合
feat_desc_76_Lv4=攻击范围变为3，能够攻击敌方多个部队，对其他目标伤害不降低，攻击时有{1}%概率使敌军无法还击，持续1回合，冷却2回合，目标地块有100%概率着火
feat_desc_78_Lv3=无视闪避和烟幕弹效果，对城防造成伤害提高{1}%
feat_desc_79_Lv4=发射烟幕弹，使自身笼罩在烟幕中，无法被陆军、海军主动攻击，有{1}%概率额外攻击1次，持续1回合，冷却2回合，有50%的概率无视闪避效果
feat_desc_80_Lv4=当处在烟幕弹效果时，攻击无视目标{1}%的防御力
feat_desc_81_Lv4=发射导弹时可装载三相弹弹头，初始拥有2颗，每{1}回合恢复1颗。上限5颗。攻击时必定触发辐射效果
feat_desc_82_Lv4=可发射洲际导弹，每回合可发射2次。代替普通攻击
feat_desc_83_Lv4=无法成为陆地单位的攻击目标，受到空军和导弹攻击伤害降低{1}%
feat_desc_84_Lv4=选择一条直线，前进最多{1}格（目标位置需为空地，会被空中悬停单位阻挡），沿途造成扫射伤害，冷却1回合。扫射击杀目标后，可再次释放扫射压制，回合内上限{2}次
feat_desc_85_Lv2=可在航母1格范围内起飞。无视任何地形对行动力的影响，无视任何地雷、水雷的影响，攻击时敌军无法还击，HP减少后战斗力不下降。对陆地单位伤害+{1}%
feat_desc_89_Lv3=在7格范围内，挖掘一条从当前位置到目标地块的地道。目标地块不能是山地，海洋，并且不能穿过海洋。己方步兵、装甲车、轻型坦克、中型坦克、野战炮、榴弹炮、火箭炮可通过地道通行。从地道通行后可获得额外行动，每条地道上限5次。当挖设新地道时，原地道消失。冷却2回合
feat_desc_90_Lv4=周围2格范围内的建筑物恢复{1}点HP，每回合生效1次
feat_desc_92_Lv4=攻击范围+1，每损失{1}点HP，提高{2}点部队攻击力
feat_desc_93_Lv4=HP减少后战斗力不会下降。濒临死亡时，HP无法被降低至1点以下，持续3回合，冷却{2}回合。保护装置结束时恢复30%HP
feat_desc_94_Lv4=当处在自身或友军领地范围内时，造成的伤害增加{1}%，回合内首次攻击时范围+1
feat_desc_95_Lv4=无视特殊地形对移动的影响，攻击、反击时无视地形减伤效果，并降低敌方{1}%防御力和行动力，持续2回合
feat_desc_96_Lv4=受到的直接伤害由自身及周围友军分摊，每分摊或闪避{1}点伤害，基础攻击力增加{2}点，增加的攻击上限为300%。持续3回合
feat_desc_97_Lv4=受到空袭（核弹除外）时有{1}%概率闪避伤害
feat_desc_98_Lv4=进入潜行状态，无法被陆军、海军主动攻击。冷却2回合。潜行时行动力+{1}，持续1回合。攻击后不会解除潜行状态。
feat_desc_99_Lv4=攻击时无法被反击。攻击部队时造成的伤害提高{1}%（潜行状态下伤害提高{2}%），攻击建筑时伤害降低50%
feat_desc_100_Lv3=呼叫直升机，将自身运至9格内的指定位置，冷却2回合，被运输机运输时，不消耗运输机使用次数（每回合限一次）
feat_desc_102_Lv4=本回合致命一击概率增加{1}%，攻击时无视目标{2}%的防御力，回合内每消灭一个目标，致命一击概率+4%，冷却2回合
feat_desc_103_Lv4=防御力增加{1}%，受到空袭（核弹除外）伤害降低{2}%
feat_desc_105_Lv4=可作为航母舰载机。每次发动攻击时能够在目标区域内额外造成{1}%伤害效果
feat_desc_106_Lv4=攻击携带核弹时，核弹造成的伤害提高{1}%
feat_desc_107_Lv4=本回合攻击时对目标1格范围内其他目标造成{1}%额外伤害，冷却2回合
feat_desc_108_Lv4=能够攻击敌方多个部队，对坦克、火炮单位伤害增加{1}%，击杀目标后，可再次攻击
feat_desc_109_Lv3=使周围2格范围内的敌方部队大部分增益状态失效，且士气严重降低，冷却2回合
feat_desc_110_Lv4=在山地和森林地形时，受到伤害降低{1}%
feat_desc_111_Lv4=发射多枚远程导弹，对目标造成远程导弹{1}%伤害，对目标周围敌军造成{2}%伤害，冷却2回合
feat_desc_117_Lv4=攻击必定造成致命一击

feat_desc_121=占领敌方城市时，自身及3格范围内友军士气上升，持续2回合
feat_desc_122=两格范围内的友方目标受到直接伤害后，恢复{1}HP。
feat_desc_123=每损失{1}%HP，受到的伤害降低{2}%，上限为25%。受到的伤害最高为300点（对核弹无效）
feat_desc_124=受到直接伤害的{1}%分摊给周围1格内敌方目标
feat_desc_125=周围2格友方目标防御力+{1}%
feat_desc_126=受到陆军单位伤害时，有{0}%概率将此伤害转移给周围一格范围内任意目标（无法转移给伤害来源单位）
feat_desc_127=攻击目标时，目标每有{1}点防御力，对其造成的伤害+{2}%
feat_desc_128=攻击目标时，目标获得每回合-10%当前HP的效果,持续2回合
feat_desc_129=每消灭一个单位时，自身攻击力+{1}%，最多可叠加{2}次，持续2回合
feat_desc_130=当处于烟幕弹效果中时，周围2格的敌方单位攻击距离降至最小（当无视烟幕弹效果时，此效果也会被无视）
feat_desc_131=当处于己方或友军领地时，行动力+{1}
feat_desc_132=空降后的当前回合内，造成的伤害+{1}%
feat_desc_133=当某回合没有移动时，下回合的行动力+{1}
feat_desc_134=可被运输机空运
feat_desc_135=在2格范围内，可最多选择{1}个目标发射鱼雷，冷却2回合
feat_desc_136=每回合结束时回复{1}%HP
feat_desc_137=无视闪避、烟幕弹、潜行和电磁静默效果
feat_desc_138=对目标造成的伤害+{1}%
feat_desc_139=轰炸目标时，无视目标{1}%的防御力
feat_desc_140=回合开始时处于周围1格的敌人会降低{1}%行动力


army_buff_desc_1023=精确狙击：致命一击概率提高90%
army_buff_desc_1043=巨炮：攻击射程+2,对城防和守城部队造成额外伤害
army_buff_desc_1053=斜面装甲：有100%的概率闪避伤害
army_buff_desc_1063=装甲杀手：本回合对装甲、火炮单位伤害增加55%
army_buff_desc_1073=火炮杀手：本回合对火炮单位伤害增加65%
army_buff_desc_1083=坦克杀手：本回合对装甲单位伤害增加65%
army_buff_desc_1093=火力压制：可额外攻击目标一格范围内随机2个敌军
army_buff_desc_1202=紧急抢救：每回合回复100点HP
army_buff_desc_1253=密集空袭：对目标1格范围内其他目标造成100%额外伤害
army_buff_desc_1304=火箭攻击：攻击范围变为3，能够攻击敌方多个部队，攻击时有100%概率使敌军无法还击
army_buff_desc_1314=烟幕弹：无法被陆军、海军主动攻击，有100%概率能够额外攻击一次，有50%概率无视闪避效果
army_buff_desc_1323=并肩作战：攻击力增加%d
army_buff_desc_1332=保护装置：HP无法被降低至1点以下，自然失效时恢复30%HP
army_buff_desc_1364=贫铀弹：致命一击概率增加50%，攻击时无视目标70%的防御力，每消灭一个目标，致命一击概率增加4%
army_buff_desc_1374=地狱火导弹：对目标1格范围内其他目标造成100%额外伤害
army_buff_desc_1421=持续压制：每回合减少10%HP
army_buff_desc_1431=火力增效：部队攻击力增加%d%%
army_buff_desc_1441=视距干扰：攻击距离降至最小
army_buff_desc_1451=空降突袭：造成的伤害增加100%
army_buff_desc_1481=飞虎攻击：部队攻击力增加10%


