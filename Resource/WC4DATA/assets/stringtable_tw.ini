event_stage_intro_20201=盟军的包围网完全封锁了我们的经济与战略资源。长此以往，帝国必然会在消耗战中败于美国。既然战争已经注定，那就必须先发制人。用一场空袭摧毁美军在珍珠港的太平洋舰队主力。
event_stage_intro_20202=“Z作战”的成功为南方作战扫清了障碍。不过英军又派遣了一支舰队增援新加坡的守军。虽然敌人数量众多，但在部队机动性上却远不如我们。以钳形攻势闪击马来亚的英军，最快速度占领新加坡。
event_stage_intro_20203=菲律宾的美军缺乏训练，武器装备也并不充足。我们将在多地发起登陆作战，让敌人南北不能兼顾。航空舰队会为登陆作战提供援助。
event_stage_intro_20204=东印度群岛有着极为丰富的资源，而盟军的联合舰队却在这里增兵集结。他们从属于不同国家，调度效率低且缺乏统一指挥。优先确保登陆作战的成功，之后再解决爪哇海上的舰队。
event_stage_intro_20205=盟军的舰队在南太平洋节节败退。他们正以莫尔兹比港为反击的支点不断集结兵力。利用敌军防备不足的机会，发动MO作战。不要给盟军任何反击的机会。
event_stage_intro_20206=美国人在珊瑚海挡住了我们的进攻，并加强了海上防备。现在的目标仍是拿下莫尔兹比港。占领防御薄弱的新不列颠，再向莱城方向前进，从而由陆路发起最终的进攻。
event_stage_intro_20207=太平洋防卫圈终于建立完成，美军现在只能退守本土。不过据情报显示，敌人在核武器研发上取得了重大突破。一旦投入实战，极有可能会扭转战局。留给我们的时间不多了。
event_stage_intro_20211=盟军的包围网完全封锁了我们的经济与战略资源。长此以往，帝国必然会在消耗战中败于美国。既然战争已经注定，那就必须先发制人。从空中发起一场突袭，摧毁美军在珍珠港的太平洋舰队主力。
event_stage_intro_20212=“Z作战”的成功为南方作战扫清了障碍。不过英军又派遣了一支舰队增援新加坡的守军。虽然敌人数量众多，但在机动性上却远不如我们。以钳形攻势闪击马来亚的英军，以最快速度占领新加坡。
event_stage_intro_20213=菲律宾的美军缺乏训练，武器装备也并不充足。我们将在多地发起登陆作战，让敌人不能兼顾。航空舰队会为登陆作战提供援助。
event_stage_intro_20214=东印度群岛有着极为丰富的各种资源，而盟军的联合舰队无疑是这里最大的威胁。敌军舰船从属于不同国家，调度效率低且缺乏统一指挥。优先确保登陆作战的成功，之后再解决爪哇海上的舰队。
event_stage_intro_20215=盟军的舰队在南太平洋节节败退。他们正以莫尔兹比港为反击的支点不断集结兵力。利用敌军防备不足的机会，发动MO作战。不要给盟军任何反击的机会。
event_stage_intro_20216=美国人在珊瑚海挡住了我们的进攻，并加强了海上防备。现在的目标仍是拿下莫尔兹比港。占领防御薄弱的新不列颠，从那里出发向莱城方向前进，从而由陆路发起最终的进攻。
event_stage_intro_20217=太平洋防卫圈终于建立完成，美军现在只能退守本土。不过据情报显示，敌人在核武器研发上取得了重大突破。一旦投入实战，极有可能会扭转战局。留给我们的时间不多了。

event_stage_intro_20301=日军无线通讯密码已被我们部分破译，敌人企图在中途岛海域设下埋伏以消灭我们的航母主力。不过约克城号已经完成了紧急抢修，中途岛的空军力量也得到了补充。各项准备均已尽力，只等联合舰队的到来。
event_stage_intro_20302=联合舰队在中途岛一战后已经损失殆尽。敌人为了巩固所罗门群岛区域的防守，开始在瓜岛和图拉吉岛上建造机场。一旦我们夺取了这些据点，就可以获得反击的支点并重新掌控周边的海域。
event_stage_intro_20303=新几内亚的日军失去了航母的支援，推进速度已经放缓。瞭望台行动也成功迫使敌人开始向所罗门群岛分兵。现在反击的时候到了。从科科达小径开始，将日本人的陆军部队赶出新几内亚。
event_stage_intro_20304=进攻的重点已经从新几内亚转向了菲律宾群岛，但日军在中太平洋的军事基地始终是一大威胁。必须夺下马里亚纳群岛，从而获得进攻菲律宾群岛的支点，并为日后轰炸日本本土做好准备。
event_stage_intro_20305=日军的太平洋防卫圈已经被层层突破，联合舰队也在菲律宾海惨败。整个西太平洋的海空军优势牢牢地掌握在我们手中。时机已经成熟，现在就是我们重返菲律宾的时候！
event_stage_intro_20306=硫磺岛上日军的玉碎并不会让我们停下脚步。冲绳岛的情况更为复杂，守军也会更多。但敌人同样也不会获得任何来自本土的增援。步步为营，谨慎地向前推进。
event_stage_intro_20307=尽管日本遭到了核打击，但他们仍然拒绝投降。指挥部决定执行没落行动，登陆日本本土作战。苏军也将配合我们同时在北方发起攻击。这就是我们最后的一场战役了，胜利属于所有的盟军战士们！
event_stage_intro_20311=日军无线通讯密码已被我们部分破译，敌人企图在中途岛海域设下埋伏以消灭我们的航母主力。不过约克城号已经完成了紧急抢修，中途岛的空军力量也得到了补充。各项准备均已尽力，只等联合舰队的到来。
event_stage_intro_20312=联合舰队在中途岛一战后已经损失殆尽。敌人为了巩固所罗门群岛区域的防守，开始在瓜岛和图拉吉岛上建造机场。一旦我们夺取了这些据点，就可以获得反击的支点并重新掌控周边的海域。
