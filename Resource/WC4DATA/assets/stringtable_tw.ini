armygroup_event_desc_173=德国与意大利联军在北非战场集结兵力，向埃及发动大规模进攻，威胁英军控制的苏伊士运河。
armygroup_event_desc_174=英军发动“罗盘行动”，对意大利在埃及的驻军发起突然袭击，迅速击溃其防线，推进至利比亚边境，扭转北非战局。
armygroup_event_desc_175=隆美尔指挥德意联军发动猛烈反攻，突破英军防线，成功占领亚历山大港，威胁苏伊士运河，北非局势急转直下。
armygroup_event_desc_176=德意联军发起进攻，围困图卜鲁格港口，试图切断英联邦部队的补给线，澳军坚守阵地，局势陷入拉锯。
armygroup_event_desc_177=英军发起“战斧行动”，多路突击德意阵地，虽初期取得进展，但遭隆美尔反击，行动最终受挫。
armygroup_event_desc_178=英联邦军发动“十字军行动”，集结大批坦克部队展开全面反攻，成功击退隆美尔，解除图卜鲁格围困，北非战局出现转机。
armygroup_event_desc_179=隆美尔因卓越战绩被授予元帅军衔，德军士气高涨，视其为不败象征。
armygroup_event_desc_180=为削弱英军地中海补给线，轴心国空军通过西班牙领空对直布罗陀港发动夜间轰炸，虽未造成重大破坏，但迫使英军加强防御部署。
armygroup_event_desc_181=隆美尔攻势直逼埃及腹地，英军在阿拉曼构筑防线死守，双方激战且未分胜负，北非战局陷入僵持。
armygroup_event_desc_182=蒙哥马利指挥英军第八军团发起全面反攻，击溃隆美尔部队，轴心国在北非的攻势彻底崩溃，战局开始逆转。
armygroup_event_desc_183=盟军部队发起“火炬行动”，在摩洛哥与阿尔及利亚多点登陆，迫使维希法军停火，轴心国腹背受敌，突尼斯战线压力剧增。
armygroup_event_desc_185=盟军东西夹击突尼斯，德意联军伤亡惨重，数十万部队被迫投降，撤出突尼斯。
armygroup_event_desc_186=隆美尔率德军装甲部队突袭卡塞林隘口，美军遭遇首次大规模战斗，指挥失误损失惨重，盟军前线被迫后撤。
armygroup_event_desc_187=盟军切断北非德军补给线，燃油与弹药日益短缺，非洲军团作战能力大幅下降，战局逐渐恶化。
armygroup_event_desc_188=英军成功恢复苏伊士运河至前线的补给线，大批物资与装备运抵，前线部队战斗力迅速回升。
armygroup_event_desc_189=盟军横渡地中海发动登陆战，迅速突破意军防线，占领西西里全岛，轴心国南翼暴露，意大利本土战局拉开序幕。
armygroup_event_desc_190=为支援意军在巴尔干的失败，德军发起“马里塔行动”，欲闪击希腊与南斯拉夫，控制整个巴尔干半岛。
armygroup_event_desc_191=德军空降兵强袭克里特岛，尽管遭遇激烈抵抗，最终攻陷全岛，但损失惨重。
armygroup_event_desc_192=北非战局波动持续扩大，逼近失衡边缘。潜伏于各地、未被任何一方记录的隐蔽武装，开始大规模解除伪装并进入战斗序列。战场构成已被改写，所有既有阵营都将面对一个从未写入历史的对手。
armygroup_event_desc_193=战局偏离既定轨道，轴心推进程度已突破临界阈值，盟军位于北非的势力将在短期内彻底瓦解。为维持时间结构稳定，伊比利亚黑蝎部队即将介入，执行干预协议。
armygroup_event_desc_194=战局偏离稳定区间，盟军推进速度已超出既定阈值，突破时间容差。轴心北非体系正在迅速瓦解，历史结构出现断裂迹象。萨赫勒黑蝎部队即将被唤醒并投入战场，执行源点修正。
armygroup_event_desc_195=检测到奥斯本个体信号完全消失，原有锚定时间源点失效。稳定区间崩塌，历史进程发生不可逆偏移。既有规则不再适用，黑蝎系统接管战局，所有节点转入统一征服态势。新纪元协议已启动。


