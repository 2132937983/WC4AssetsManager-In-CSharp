skill_info_139=指挥装甲部队处于敌方领地时，自身和周围友军致命一击伤害+[#00FF00#%d%%]
skill_info_140=攻击使敌军士气低落和士气衰落时，有[#00FF00#%d%%]概率再次攻击。攻击使敌军士气下降为混乱则100%%概率再次攻击（对已混乱的敌军不生效）
skill_info_141=指挥舰船攻击后，有50%%概率给敌军附加“颠簸”状态，降低[#00FF00#%d%%]行动力，持续2回合。指挥企业号时，除战斗机外的其他空军单位消耗减1
skill_info_142=指挥部队触发闪避后，回复自身HP上限的[#00FF00#%d%%]（一回合最多1次）
skill_info_143=指挥装甲部队在自身或友军领地范围内时，自身-[#00FF00#%d%%]受到伤害，受到敌军将领攻击时，额外返还本次伤害的50%%
skill_info_144=指挥部队进攻后，目标和其周围1格其他敌军有[#00FF00#%d%%]概率添加追踪标记，持续1回合。有追踪标记的目标受到伤害提高20%%
skill_info_145=指挥装甲部队时，周围2格每有1个敌军，造成伤害+[#00FF00#%d%%]（最高50%%），装甲部队士气高昂时受到伤害降低20%%
skill_info_146=指挥装甲部队时对敌军精英部队造成伤害+[#00FF00#%d%%]
skill_info_147=指挥火炮部队时，自身不受无法反击的技能效果影响，周围一格友军进行反击时，自身也有[#00FF00#%d%%]概率参与反击。
skill_info_148=指挥火炮部队进攻和反击时，对距离2格和以上的敌军造成伤害+[#00FF00#%d%%]
skill_info_149=指挥部队对陆地单位造成伤害+[#00FF00#%d%%]。占领敌方城市时，自身和3格范围内的其他友军部队获得“嘉奖”，部队攻击力提高15%%，持续3回合
skill_info_150=指挥部队无视烟幕弹和潜行、闪避以及电磁静默效果，攻击HP低于50%%的敌军时造成伤害+[#00FF00#%d%%]
skill_info_151=指挥部队HP上限+[#00FF00#%d%%]，HP高于50%%时士气不会混乱
skill_info_152=指挥空中悬停单位时，提升[#00FF00#%d%%]闪避率和4行动力，受到空军伤害降低30%%。空中悬停单位进攻时，闪避率每有1%%提升1%%致命一击伤害
skill_info_153=指挥空军（空降兵除外）和导弹攻击消耗降低20%%。指挥空军和导弹攻击后获得“梯次攻势”，空军和导弹攻击时无视敌军[#00FF00#%d%%]防御力，对最终防御力低于20的敌军必定造成致命一击（核弹无效），回合结束时清除。
skill_info_154=指挥部队周围1格没有敌军时，经济和工业收入+[#00FF00#%d]
skill_info_155=指挥部队进攻后使目标及其周围1格2个敌军有[#00FF00#%d%%]概率获得“疲乏”，持续1回合。有“疲乏”的部队受到攻击和空袭后额外降低6%%HP，并降低士气。疲乏效果对已士气混乱的部队不生效。



