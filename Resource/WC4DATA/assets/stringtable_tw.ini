dialogue_3304=迅速与其他人取得联系，在坐标位置的基地会合。
dialogue_3305=不明身份的武装势力突然出现在了战区！和谈已被破坏，立刻发起进攻！
dialogue_3306=通讯恢复了。奥斯本，你还活着！我的周围出现了多国部队，甚至还有大量德军！
dialogue_3307=我不畏惧死亡，因为我一直都在为自己的信仰而战。这是科尔森和我的秘钥。奥斯本，剩下的交给你了。
dialogue_3308=我早已经失败，但也注定会成功！你们的牺牲不会白费的。
dialogue_3309=为什么威廉姆斯会出现在那里？他们是哪一边的？那些是什么武器？
dialogue_3310=援军已经抵达战场。德军沿路的空袭严重拖慢了我们的行军速度。
dialogue_3311=已与基地周围的友军取得了联系，各项设施也能正常运作。现在该为死去的战友报仇了。
dialogue_3312=莱蒂西亚的领土纷争现在扩大为了全面战争。我们会协助哥伦比亚获得胜利，让德国的势力遍布整个世界。
dialogue_3313=这种形式的冲突与战争在这里不断上演。这不是第一次，也必然不会是最后一次。
dialogue_3314=为什么秘鲁的军队在向我们开火！我们是不会放下武器束手就擒的。
dialogue_3315=该死，刚才你指挥了一支小队同时攻击了哥伦比亚和秘鲁的军队。现在我们得把你弄到一个安全的地方。
dialogue_3316=我知道有个安全的地方，就在三国交界地附近的雨林中。
dialogue_3317=是你们！原来是这样。
dialogue_3318=优先消灭周围的德军部队，给科尔森他们打开一条通路。
dialogue_3319=你是谁？为什么要帮我们？
dialogue_3320=因为你们的无知，也因为你们的勇气。
dialogue_3321=我似乎在哪里见过你。
dialogue_3322=
dialogue_3323=无论如何有一点可以确定。都是因为你，我们才落到如此境地。
dialogue_3324=等清除了其他威胁后，我会在基地里向你们解释这一切。
dialogue_3325=在运输机的协助下，弗朗哥的非洲军团已经顺利抵达了前线。他们会从南面向马德里方向发起进攻。
dialogue_3326=情报显示德军的秃鹰军团主力尽出，在敌人的大规模空袭下，毕尔巴鄂恐怕会迅速失守。
dialogue_3327=死守马德里和巴塞罗那，不要让叛军对我们形成夹击。
dialogue_3328=内战果然爆发了，一切都与奥斯本描述的完全一致。
dialogue_3329=为了加速推进，形成对马德里的包围，我的空军部队会清除北部还在抵抗的共和国军。
dialogue_3330=情报显示一支意军的精锐部队已从东部登陆。从他们的行动路线来看，似乎是想穿越沙漠，潜入我们的腹地。
dialogue_3331=不要后退，利用装甲单位协助步兵防御，巩固东侧的防线。
dialogue_3332=希望我没到得太晚。英国那边的计划进行地十分顺利。
dialogue_3333=弗朗哥已经被我们击退。但叛军仍源源不断地从南部涌来。
dialogue_3334=我们的意图已被察觉，不过敌军的防御部署也被打乱了。行动终止，现在该撤退吧。
dialogue_3335=感谢你们的及时支援。但以我的判断，共和国军恐怕正在输掉这场战争。
dialogue_3336=部队已经承受了大量的伤亡。指挥部命令各志愿军部队，向东集结，准备撤退。
dialogue_3337=我们还会再见的。希望你们的救世主义情结不会让你越陷越深。
dialogue_3338=西班牙的黄金时代早已成为历史，它和过去自己的殖民地一样陷入了一种循环。我们的出路究竟在哪里。
dialogue_3339=被殖民者、军阀、资本家控制的时代已经结束了。这个世界需要一次变革。而我需要你们。
dialogue_3340=一个支持美国的伊朗政府有助于美国在中东取得地理和战略优势。我们决不能重蹈朝鲜战场的覆辙。
dialogue_3341=我们十分了解艾森豪威尔和他的盟友们。因此，我们早就做好了对策。现在开始行动吧。
dialogue_3342=我们被苏军摆了一道！他们已经控制住了德黑兰和其他北部地区城镇，甚至入侵了伊拉克与土耳其。
dialogue_3343=继续按计划执行，我们也有自己的底牌。
dialogue_3344=卢卡斯经常提起你们。我很好奇以你们的立场，这次会采取什么样的行动。
dialogue_3345=石油生意让我们在中东各国结识了许多有钱的朋友。而我们有着共同的敌人，光这一点就足够了。
dialogue_3346=你说的没错，但是这次我们在明面上必须保持中立。一点小小的军费我们还是出得起的。
dialogue_3347=我们不会主动出兵，但是会为你们的部队持续提供物资保障。
dialogue_3348=情报局早就考虑到了这一点。雇佣兵和武装人员已经提前潜伏在了各重要城市周围。
dialogue_3349=这是什么火炮？
dialogue_3350=这是我的专利。以后可以慢慢向你解释设计原理。
dialogue_3351=苏军的全面进攻已经威胁到了我们的基地。现在立即开始反击。
dialogue_3352=德黑兰的行动已经取得了成功。据可靠情报，敌人即将转移进攻的重心，向伊朗增派大量援军。
dialogue_3353=苏联的势力正在被我们赶出这片土地。
dialogue_3354=卫星控制权已被成功劫持。卫星武器已上线。
dialogue_3355=消灭周围的苏军部队，我们会确保你的安全。
dialogue_3356=南美的行动已经公开了我们的存在。没有伪装的必要了。
dialogue_3357=叛乱分子占领了我们在库页岛的研究基地，调集兵力重新夺回那里。
dialogue_3358=即使有苏军内部人员提供的资料也不可能在这么短时间内完成劫持。你究竟是怎么办到的？
dialogue_3359=匹夫无罪，怀璧其罪。原本科研上的合作已有成果，却不想招来了杀生之祸。
dialogue_3360=新的美日安保条约出卖了我们的利益！我们会一直一直战斗下去，直到胜利或死亡。
dialogue_3361=日本国内的起义分散了美军的注意力，这正是我们撤退的好时机。
dialogue_3362=不，起义军的领袖也是我们的营救目标之一。
dialogue_3363=大丈夫生居天地间，岂能郁郁久居人下。
dialogue_3364=大业未成，天命难违。
dialogue_3365=敌军的主要据点已被压制。加入我们，独自作战必然毫无胜算。
dialogue_3366=识时务者为俊杰，通机变者为英豪。我可以加入你们，我们的战斗还远未结束。
dialogue_3367=如今四海飘零，无容身之地。幸得诸位相救，能有安身之所。
dialogue_3368=这些分离主义分子在奥斯本的煽动下不断破坏着联盟的团结。必须要采取行动根除东欧的黑蝎势力。
dialogue_3369=东方集团的内部正在产生分裂，恐怕苏军早已计划好用武力来解决这些问题。
dialogue_3370=任务顺利完成，我已经证明了自己和我们家族的实力。如果你们需要，我也可以提供一些额外的军事服务。
dialogue_3371=苏军已经越界，我们不会容忍任何人在自己的领土上驻军。
dialogue_3372=没有永远的朋友，也没有永远的敌人。立刻派遣援军援助南斯拉夫与罗马尼亚，要小心黑蝎的部队。
dialogue_3373=苏军的情报显示瓦格纳已经投靠了黑蝎组织。必须立即采取行动。
dialogue_3374=这怎么可能！
dialogue_3375=为了苏军而战或是为了自己而战。现在选择权在你手中。
dialogue_3376=该死，怎么又是你们！要是想要答案，我就给你们一个答案。
dialogue_3377=没人能预知一切，没人能凭一己之力决定战争的结果。
dialogue_3378=看样子你们是不会放过我了。
dialogue_3379=继续进攻。这门火炮将在我手中发挥出它最大的威力。
dialogue_3380=波兰的苏军已经被我们压制，我的人会继续向东发起进攻。
dialogue_3381=局部的胜利也无法撼动美苏在欧洲的势力。
dialogue_3382=那是当然，但我们不会放过任何一个让敌人之间互相消耗的机会。
dialogue_3383=东部的战况趋于白热化，加州与德州的起义军在那里组成了联盟，逐渐占据了上风。
dialogue_3384=美国不需要一个软弱的总统。
dialogue_3385=天下战术无坚不破，唯快不破。
dialogue_3386=率先控制住起义军的后方总部，就能提前终结这场战争。
dialogue_3387=东部的战局已经无法挽回。这里的局势恐怕也将有新的变数。
dialogue_3388=也许该适时收手，转攻为守了。
dialogue_3389=我们先撤回墨西哥的基地，盯住德州美军的动向。
dialogue_3390=华盛顿已经被起义军联盟攻占。这个世界将会重新见证我们的决心与力量。
dialogue_3391=不论你是哪种美国人，奥斯本和他的黑蝎都是我们的敌人。美军将追你到天涯海角。
dialogue_3392=既然是这样，那就来吧。
dialogue_3393=随着国内局势的稳定，更多盟友加入了我们一同对抗黑蝎。
dialogue_3394=针对南极遗迹的技术解析取得了重大进展。不能让任何势力踏上南极一步。
dialogue_3395=我们的研究即将完成，让这些不知死活的人见识一下真正的力量！
dialogue_3396=不，怎么会这样！
dialogue_3397=看来我们的一系列行动并未延缓苏军的研发进程。不过现在我们还有时间。
dialogue_3398=黑蝎基地里的数据已经成功恢复。资料表明我们正在遭受来自未来的袭击，但是并未查到关于奥斯本的资料。
dialogue_3399=舰队已经封锁了岛屿群东侧的海域，黑蝎部队间的联系被切断了。
dialogue_3400=消灭南极的每一个敌人。没有人能活着离开这里。
dialogue_3401=新的战车原型已经完成。这些武器的威力在南美一战中已经得到了充分的展现。
dialogue_3402=苏军的研究成功了，一旦投入量产，后果不堪设想。
dialogue_3403=现在和我们一起阻止苏军还来得及。
dialogue_3404=除了这些先进军事装备外，还有一项更为惊人的技术。
dialogue_3405=奥斯本，原来无知才是你真正的武器。
dialogue_3406=大军灰飞烟灭，世界在我脚下燃烧。
dialogue_3407=奥斯本你没事吧，你的状态有点奇怪。
dialogue_3408=在遥远的未来，只有战争。
dialogue_3409=他仿佛已经变成了另一个人。
dialogue_3410=其他十二份秘钥已全部集齐并存活，这次是我赢了！
dialogue_3411=战争从未改变。

