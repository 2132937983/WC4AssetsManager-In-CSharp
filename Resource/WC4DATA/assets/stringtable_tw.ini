dialogue_2834=同志们，解放克卢日，将德匈联军赶出罗马尼亚！
dialogue_2835=向德布勒森前进，把敌人彻底摧毁！
dialogue_2836=向西北进攻，夺取加里宁！争取更进一步切断莫斯科和雅罗斯拉夫尔的联系。
dialogue_2837=加里宁方面军由科涅夫同志领导，一定要阻止德军突破加里宁！莫斯科会竭力调集资源支持。
dialogue_2838=各单位注意，以积极的方式从各个方向突击德军，消耗其力量，阻止敌军继续推进！
dialogue_2839=敌人的反抗极其强烈！一定要稳定阵线，避免后路被断。
dialogue_2840=莫斯科近在眼前，苏军已经疲惫。撕裂他们的防线，攻入莫斯科！
dialogue_2841=同志们，敌人已经逼近莫扎伊斯克防线。我们必须要守住——我们身后就是莫斯科！
dialogue_2842=同志们，仇敌的国土就在眼前，复仇的时刻已经来到。进攻！洗刷战败的耻辱，告慰战死的亡灵！
dialogue_2843=士兵们，为了普鲁士的荣耀，为了我们的家园，要不畏牺牲地抵抗到最后一刻！
dialogue_2844=各舰队注意，我们要清扫日军海上力量，为登陆提供空间。拿下菲律宾，日本海军就再无威胁！
dialogue_2845=士兵们，登岛，杀敌，洗刷我们的耻辱！
dialogue_2846=诸君，无论牺牲多少，我们必须打赢这一仗！失去菲律宾，海军就再无用武之地。
dialogue_2847=诸君继续奋战，我部来引开敌人！
dialogue_2848=我方补给远胜敌军！步兵开道，坦克歼敌，此战必胜！
dialogue_2849=我没回来前，依托地雷区防守。节省物资，等待补给。
dialogue_2850=补给舰即将抵达。装甲部队向北部集中，准备夺回阵地！
dialogue_2851=好消息，皇家空军摧毁了敌军在图卜鲁格的补给舰！
dialogue_2852=补给不足，部队的损失太大了。我们已经无法继续战斗，全军撤退！
dialogue_2853=希军装备远不如我们！士兵们，彰显意大利的荣耀，占领希腊！
dialogue_2854=希军相当有韧性，但依旧无法抵挡我们。
dialogue_2855=守住阵线，不能让他们夺回阵地！
dialogue_2856=拿下奥古斯塔皇后湾，守住它！
dialogue_2857=日军从海上来了一波增援，阻止他们！
dialogue_2858=南部部队负责吸引火力，北部部队负责主攻。同志们，解放基辅就在此战！
dialogue_2859=不惜一切代价守住基辅，战线不允许再后移了！
dialogue_2860=我们不能被困死在基辅，快速向西南撤退！
dialogue_2861=基辅已经解放，继续追击德军！
dialogue_2862=反攻！阻止敌军继续推进！
dialogue_2863=此次行动分为三路并行。虽然当地守军力量薄弱，但是动作要快，防止港口被破坏。
dialogue_2864=意大利皇家海军现在停泊在塔兰托。机会难得，此战必须摧毁他们！
dialogue_2865=防空炮反击，躲避空袭！
dialogue_2866=海军掩护陆军登陆，务必夺回机场！
dialogue_2867=侦察机传来报告：日军正在靠近瓜岛。做好战斗准备！
dialogue_2868=日军增援到了，注意防备！
dialogue_2869=敌人在南部的防备空虚。我们从这里绕过防线，吸引围城部队，解放图卜鲁格！
dialogue_2870=围攻图卜鲁格的部队继续作战。其他部队在驻地防守，等待补给。
dialogue_2871=图卜鲁格已经拿下，现在全力反击！
dialogue_2872=继续进攻，拿下罗斯托夫！
dialogue_2873=向前推进，做好包围准备。这一战，我们要重创德军第1装甲集团军！
dialogue_2874=部队不能覆灭在这里，第1装甲集团军撤出罗斯托夫。
dialogue_2875=同志们，反击的时刻已经到来。进攻，夺回我们的阵地!
dialogue_2876=守住防线，绝不能放弃任何一个阵地！
dialogue_2877=同志们，我们不能允许他们倒向德国，给列宁格勒带来危险。进攻！直到列宁格勒安全为止！
dialogue_2878=各位同胞，为了芬兰的独立，为了家乡的安全，我们要奋战到底！
dialogue_2879=集中兵力占领纳罗-福明斯克，将战线继续向莫斯科推进！
dialogue_2880=同志们，我们一定要守住这条防线，不能让敌人闯进莫斯科！
dialogue_2881=炮兵支援已经到位。同志们，让我们夺回加里宁！
dialogue_2882=各部队注意：依托阵线，沿河防守，确保加里宁不失！


dialogue_3000=先头部队已切断敌人的陆上增援，成功完成对斯大林格勒的合围。
dialogue_3001=第三帝国的命运掌握在我们手中，我们要像机器般冷酷无情地碾压敌人，斯大林格勒将见证我们的不朽！
dialogue_3002=背后就是伏尔加河，我们已无退路！任何叛逃者将被处决，而活下来的士兵将获得越级晋升！
dialogue_3003=尽管我将离开前线，但我的心依然与你们同在，逆境不过是对我们意志的考验，挺过去，胜利终将属于我们。
dialogue_3004=我到这里不是来掩护撤退，而是来彻底击败敌人。我们将在每一条街道、每一座工厂、每一块残垣断壁后面阻击敌人的进攻。
dialogue_3005=从高空俯视，敌人只不过是棋盘上的兵卒。每一次俯冲都将是对敌人的审判！
dialogue_3006=他们以为自己掌控了战局，却不知真正的力量正向他们逼近。反攻的狂潮将把他们彻底卷入困境。
dialogue_3007=敌人曾以为他们不可撼动，但我们彻底粉碎了他们的傲慢。拿下卡拉奇，将成为敌人噩梦的开端。
dialogue_3008=敌人的围困只是暂时的，一旦增援部队抵达，他们的胜利梦将彻底破灭。不惜一切代价，向斯大林格勒方向增援！
dialogue_3009=每一步都是为了胜利铺平道路，每一击都是为敌人敲响的丧钟。
dialogue_3010=在战场上，我只做一件事——决定敌人最后一次呼吸的时刻。
dialogue_3011=作为一名军人，我尽了最大的努力去履行我的职责，但在绝境面前，我们的选择已所剩无几。
dialogue_3012=我为我的士兵感到骄傲，他们在最艰难的条件下展现了无与伦比的勇气。愿在此牺牲的士兵们得以安息。
dialogue_3013=斯大林格勒的每一块砖石，都将变为敌人的坟墓！
dialogue_3014=天空失去了一只雄鹰，我的命运在此终结。即使坠落，我也会燃尽最后的光芒。
dialogue_3015=一切...都结束了吗？这颗子弹或许能夺走我的生命，却永远无法熄灭我们复仇的怒火。


