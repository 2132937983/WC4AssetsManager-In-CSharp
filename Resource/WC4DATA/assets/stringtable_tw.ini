dialogue_4366=尽管德军已兵临城下，但他们面对的绝非一座空城。他们企图以速度结束战争，而我们将以意志拖垮他们。
dialogue_4367=红场的将士们，让敌人明白：他们每向前迈出一步，都必须付出血的代价！
dialogue_4368=敌军已自南北两翼形成夹击态势，一旦得手，我军防线将被切断。必须稳住阵线，各个击破，阻止他们合围！
dialogue_4369=最后一道外围防线已被突破，我已经能看到克里姆林宫屋顶上的红星了。
dialogue_4370=没有什么能阻挡钢铁洪流的前进。道路将被碾平，防线会被撕开，任何抵抗，都不会改变结果。
dialogue_4371=朱可夫将军已抵达前线！前线各单位注意稳住阵地，让敌军在进攻中不断消耗，时间会站在我们这边。
dialogue_4372=从战术角度看，形势似乎正在向我们倾斜，莫斯科就在不远的前方。
dialogue_4373=但从现实角度看，我们的装甲部队正在被消耗，气温持续下降，车辆启动与维护时间显著增加，燃料与弹药补给无法按计划到位。
dialogue_4374=没有补给，就没有机动；没有机动，装甲部队将失去存在意义。
dialogue_4375=曼施坦因将军、龙德施泰特将军已奉命率军前来莫斯科方向支援，前线部队务必保持阵地，稳定态势，决不能后退一步！
dialogue_4376=情报确认日本短期内不会进攻苏联，远东增援部队即将抵达战场！
dialogue_4377=必须承认，当前条件对我们并不有利，但莫斯科仍是唯一具备决定性战略意义的目标。即便成功概率下降，也无法找到可替代的行动方向。
dialogue_4378=不惜一切代价，继续向莫斯科方向推进！
dialogue_4379=拿破仑的教训他们忘了吗？不，他们当然记得。他们一定研究过，分析过，甚至嘲笑过当年的失败。
dialogue_4380=只是他们和当年的拿破仑一样，相信自己会成为例外。
dialogue_4381=敌军被迫后撤，但主力尚存。然而，这已足以证明德军并非不可战胜，“闪电战”的神话自此终结。



