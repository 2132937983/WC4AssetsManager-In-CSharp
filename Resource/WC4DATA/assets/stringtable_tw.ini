dialogue_4669=日军佯攻部队未得到延迟行动通知，开始攻打海岸前沿阵地。
dialogue_4670=日军开始攻击前沿阵地，迅速增援！
dialogue_4671=日军主力部队开始行动，企图夺取亨德森机场。
dialogue_4672=愚蠢的配合。伙计们调转枪口，他们这是自寻死路！
dialogue_4673=该死！这帮混蛋真不傻！伙计们，迅速解决。我们不能让东侧的兄弟死顶！
dialogue_4674=收缩防线！收缩防线！敌人是有备而来！绝不能让他们抢下机场！
dialogue_4675=主动出击，截断日军增援通道。日军计划彻底破产。
dialogue_4676=伙计们，登岛之后，迅速向机场推进。我们要把敌人全部消灭在机场！
dialogue_4677=日军通过飞机向拉包尔总部求援，拉包尔的日军空中援护即将抵达。
dialogue_4678=西侧日军兵力向机场集中，欲力保机场不失。
dialogue_4679=机场失陷。日军向机场方向增援，企图夺回机场。
dialogue_4680=防守机场周边，别让敌人找到机会抢回机场！
dialogue_4681=日军放弃夺回计划，准备从新不列颠岛西撤离。
dialogue_4682=清扫受周围区域，别让他们再打回来！
dialogue_4683=登陆后迅速向南推进。岛西主力正在向东撤离。我们必须快点截住他们！


