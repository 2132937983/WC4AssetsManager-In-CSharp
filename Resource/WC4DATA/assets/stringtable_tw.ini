armygroup_event_desc_1=德国采用多兵种机动化闪击战术，于1939年迅速侵略波兰，引发英法对德宣战。
armygroup_event_desc_2=美国向英国和法国提供大量的军火援助，为其武器装备提供了重要支持。
armygroup_event_desc_3=苏联试图在寒冷的冬季攻克芬兰，尽管苏联取得了胜利，但也付出了巨大代价。
armygroup_event_desc_4=德国向挪威和丹麦发起进攻。
armygroup_event_desc_5=罗马尼亚丰富的石油资源为德国提供了战略性的燃料支持。
armygroup_event_desc_6=德国采用闪击战术入侵低地国家，快速突破荷兰、比利时防线。
armygroup_event_desc_7=曼施坦因计划于1940年5月启动，通过穿越阿登森林，绕过了马奇诺防线，形成了对英法联军的包围。
armygroup_event_desc_8=丘吉尔成为英国首相，他的领导力和激励性演讲巩固了英国的抵抗精神。
armygroup_event_desc_9=面对德军包围，盟军在敦刻尔克海滩进行了大规模撤退，为后续反攻打下关键的基础。
armygroup_event_desc_10=法军执行纵深防御行动和拖延战术，对德军部队造成了较大的损耗。
armygroup_event_desc_11=瑞典在二战期间通过向德国提供大量高质量铁矿石，对提升轴心国的军事实力发挥了关键作用。
armygroup_event_desc_12=巴黎沦陷象征着法国的战败，使德国在战争初期取得了战略上的重要胜利。
armygroup_event_desc_13=德军于1940年制定了全面入侵英国的“海狮计划”，企图通过海上和空中进攻，摧毁英国的军事力量。
armygroup_event_desc_14=1940年德英两国在英国上空展开决定性空战。
armygroup_event_desc_15=德国海军通过潜艇群体协同行动，对敌方舰队、商船进行无差别袭击，对盟军船队形成威胁。
armygroup_event_desc_16=二战期间在大西洋上发生了激烈海上对抗，德国潜艇通过狼群战术袭击盟军舰船，而盟军则采取护航和反潜作战。
armygroup_event_desc_17=意大利向英法宣战，出动了30万军队向阿尔卑斯山区与尼斯地区发动进攻。
armygroup_event_desc_18=波军拟定了以防御为主的作战计划，通过固守西方领土为重点，等待西线的盟军对德国发动攻击。
armygroup_event_desc_19=轴心国军队由各方向入侵南斯拉夫，在极短的时间突破了多道防线，对贝尔格莱德发动钳形攻势。
armygroup_event_desc_20=C集团军群调动了大量火炮与人员，跨越莱茵河向马奇诺防线发起正面进攻。
armygroup_event_desc_21=德国与意大利联军在北非战场集结兵力，向埃及发动大规模进攻，威胁英军控制的苏伊士运河。
armygroup_event_desc_22=英军发动“罗盘行动”，对意大利在埃及的驻军发起突然袭击，迅速击溃其防线，推进至利比亚边境，扭转北非战局。
armygroup_event_desc_23=隆美尔指挥德意联军发动猛烈反攻，突破英军防线，成功占领亚历山大港，威胁苏伊士运河，北非局势急转直下。
armygroup_event_desc_24=德意联军发起进攻，围困图卜鲁格港口，试图切断英联邦部队的补给线，澳军坚守阵地，局势陷入拉锯。
armygroup_event_desc_25=英军发起“战斧行动”，多路突击德意阵地，虽初期取得进展，但遭隆美尔反击，行动最终受挫。
armygroup_event_desc_26=英联邦军发动“十字军行动”，集结大批坦克部队展开全面反攻，成功击退隆美尔，解除图卜鲁格围困，北非战局出现转机。
armygroup_event_desc_27=隆美尔因卓越战绩被授予元帅军衔，德军士气高涨，视其为不败象征。
armygroup_event_desc_28=为削弱英军地中海补给线，轴心国空军通过西班牙领空对直布罗陀港发动夜间轰炸，虽未造成重大破坏，但迫使英军加强防御部署。
armygroup_event_desc_29=隆美尔攻势直逼埃及腹地，英军在阿拉曼构筑防线死守，双方激战且未分胜负，北非战局陷入僵持。
armygroup_event_desc_30=美英联军在法属北非三地同时登陆，展开“光明行动”，法属殖民地政权动摇，轴心国西线防线受到巨大威胁。
armygroup_event_desc_31=蒙哥马利指挥英军第八军团发起全面反攻，击溃隆美尔部队，轴心国在北非的攻势彻底崩溃，战局开始逆转。
armygroup_event_desc_32=盟军部队发起“火炬行动”，在摩洛哥与阿尔及利亚多点登陆，迫使维希法军停火，轴心国腹背受敌，突尼斯战线压力剧增。
armygroup_event_desc_33=火炬行动后，维希法国军队选择倒戈，加入盟军行列，自由法国势力迅速扩张，轴心国在北非局势愈发被动。
armygroup_event_desc_34=盟军东西夹击突尼斯，德意联军伤亡惨重，数十万部队被迫投降，撤出突尼斯。
armygroup_event_desc_35=隆美尔率德军装甲部队突袭卡塞林隘口，美军遭遇首次大规模战斗，指挥失误损失惨重，盟军前线被迫后撤。
armygroup_event_desc_36=盟军切断北非德军补给线，燃油与弹药日益短缺，非洲军团作战能力大幅下降，战局逐渐恶化。
armygroup_event_desc_37=英军成功恢复苏伊士运河至前线的补给线，大批物资与装备运抵，前线部队战斗力迅速回升。
armygroup_event_desc_38=盟军横渡地中海发动登陆战，迅速突破意军防线，占领西西里全岛，轴心国南翼暴露，意大利本土战局拉开序幕。
armygroup_event_desc_39=为支援意军在巴尔干的失败，德军发起“马里塔行动”，欲闪击希腊与南斯拉夫，控制整个巴尔干半岛。
armygroup_event_desc_40=德军空降兵强袭克里特岛，尽管遭遇激烈抵抗，最终攻陷全岛，但损失惨重。


