event_4112=维斯瓦河-奧得河攻势
event_4113=拉包尔战役

event_intro_4111=1942年12月31日，英军护航舰队与德国海军的拦截舰队在巴伦支海爆发了一场海战。德军舰船火力占优，但护航舰队凭借快速的反应与及时的增援，成功掩护了前往苏联的运输船队。德军舰队未能击沉任何一艘运输船，此役的失败直接导致德国海军司令雷德尔辞职，邓尼茨接任。德国海军战略重心彻底转向潜艇战。
event_intro_4112=维斯瓦河-奧得河攻势是苏联红军实施的一次大规模战略性进攻。为了响应西线盟军在阿登战役中的困境，苏军将原定进攻计划提前了8天，于1945年1月12日从维斯瓦河上的登陆场发起突击。在朱可夫和科涅夫元帅的指挥下，苏军两个方面军以绝对优势兵力突破德军防线并解放了华沙、克拉科夫等城市，将战争直接推进至德国腹地，为最终攻克柏林奠定了决定性基础。
event_intro_4113=拉包尔战役是日军为夺取南太平洋战略枢纽而发动的关键行动。1942年1月初，日军航母舰载机开始空袭拉包尔。1月23日，日军地面部队顺利登陆并迅速占领了拉包尔，随后将其设为坚固的海空堡垒。对盟军而言，拉包尔的失守使其与澳大利亚之间的交通线面临直接威胁。日军成功获得了至关重要的前进基地，极大便利了其后在所罗门群岛及新几内亚方向的进一步行动。

dialogue_4253=潜艇部队发现了英国运输船队的动向。
dialogue_4254=舰队分为两队，在引开英军的护卫舰后全力消灭运输船队。
dialogue_4255=英军舰船发现了西北方的德军舰队。前往拦截的同时，护航舰队施放了烟幕掩护运输船队逃离战场。
dialogue_4256=德国人的兵力已经所剩无几，而我们的援军无穷无尽。
dialogue_4257=华沙一带的防线已经被突破，德国人正在溃退。继续追击，全速前进！
dialogue_4258=克拉科夫的德军已经崩溃。敌人放弃了他们的阵地，开始向西移动。
dialogue_4259=我们占据了绝对的优势，不要放走岛上的澳军，封锁他们的撤离路线。
dialogue_4260=面对人数众多的日军登陆部队，澳大利亚守军兵力严重不足，只能开始向南撤退。
dialogue_4261=通讯效率显著提升，战斗机现在能更快地响应地面部队的空袭请求。利用好空中优势，这是属于战斗机的一天。
dialogue_4262=战况出现了偏差，但还有挽回的余地。
dialogue_4263=最高统帅部直接下达了命令，要求我们停止前进。
dialogue_4264=我们应该为后续的进攻提前执行一些“强力侦查”行动。装甲部队继续前进。
dialogue_4265=空袭的规模根本无法阻碍德军的地面进攻。
dialogue_4266=到此为止了么。
dialogue_4267=阿尔弗雷德已经阵亡，战况严重偏离预期。也许下次应该更早地接管行动。
dialogue_4268=这次的失败已成定局。但是你们会为此付出代价。
dialogue_4269=我会回来的。
dialogue_4270=隆美尔的部队已经被我们包围。
dialogue_4271=永远不要低估军人捍卫自己国家的决心。撤退。
dialogue_4272=德军还在做着无谓的抵抗。拿下卡昂，彻底摧毁敌人的防线。
dialogue_4273=你们的意志值得赞赏。
dialogue_4274=为了军人的荣誉，为了德意志，我们会继续战斗。
dialogue_4275=只有我们能拯救自己，拯救我们的国家。
dialogue_4276=恶劣的天气对双方都极为不利。要想达到预期目标就必须加快进攻的速度。
dialogue_4277=普鲁士不会有被俘虏的将军。
dialogue_4278=暴风雪结束了。反攻现在开始。
dialogue_4279=阿登森林的雪冷得刺骨，我好像已经在这里倒下过无数次。
dialogue_4280=我会记住你们这些愚蠢而又可敬的对手。你们的赞歌就是勇气的赞歌。
dialogue_4281=黑蝎在太阳要塞的实验取得了成功。信标增幅器已经调试完毕。受到影响的人自主意识逐渐被抑制，最终重新加入黑蝎。
dialogue_4282=这样的做法也许太过直接，他们总有一天会知道的。
dialogue_4283=也许吧，但即便是这样我也会选择相信阿尔弗雷德。
dialogue_4284=我们会在这削弱敌人的力量，尽可能地为你们争取时间。
dialogue_4285=太阳要塞里的记录显示，南美的3个信标增幅器将在10个实验周期后完成调试。
dialogue_4286=从一开始我就知道结局，我早就选定了自己要走的必经之路。
dialogue_4287=信标增幅器已经调试完毕。受到影响的人自主意识逐渐被抑制，最终重新加入黑蝎。
dialogue_4288=我们成功地阻止了这场灾难，但是祸根依然没有被斩断。
dialogue_4289=必须重新集结部队，夺回我们的要塞。
dialogue_4290=黑蝎在墨西哥的遗迹太阳要塞被攻破，信标增幅器被占领。全球各处秘密基地的位置被全部揭示，黑蝎在战略层面陷入了全面被动。
dialogue_4291=黑蝎在哥伦比亚的遗迹回声地堡被攻破，信标增幅器被占领。遗迹中的各项设施已被自行销毁。但残留的访问记录显示该设施的重启时间点为1933年。
dialogue_4292=黑蝎在巴西的遗迹印加之眼被攻破，信标增幅器被占领。许多特殊的武器装备没来得及转移或销毁，甚至还有一些从未见过的新式军备设计图。
dialogue_4293=黑蝎在巴西的遗迹星轨神殿被攻破，信标增幅器被占领。美苏缴获了大量的加密资料，黑蝎在世界各地的人员名单和军事部署已完全被揭露。
dialogue_4294=黑蝎的全部遗迹设施均被占领，倒计时停止。黑蝎在南美洲的计划被彻底挫败。
dialogue_4295=奥斯本被彻底击败，倒计时停止。黑蝎在南美洲的计划被彻底挫败。

