event_stage_intro_20614=部队已经在列宁格勒周边集结完毕，这座被围困了近3年的英雄城市即将迎来完全的解放。不过德军在西边建立了一道坚固的防线。必须发动一场攻势，打败北方集团军，打通向西前进的道路。
