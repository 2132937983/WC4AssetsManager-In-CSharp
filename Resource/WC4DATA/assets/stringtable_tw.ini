feat_desc_98=进入潜行状态，无法被陆军、海军主动攻击。冷却2回合。潜行时行动力+{1}，持续1回合。攻击后解除潜行状态。
feat_desc_99=攻击时无法被反击。攻击部队时造成的伤害提高{1}%（潜行状态下伤害提高{2}%），攻击建筑时伤害降低50%
feat_desc_100=呼叫直升机，将自身运至5格内的指定位置，冷却2回合
