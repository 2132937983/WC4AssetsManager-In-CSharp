event_108=莫斯科保卫战
event_intro_108=1941年秋，德军在东线战场连战连捷，迅速逼近苏联首都莫斯科。他们试图用速度与钢铁终结战争，以一场决定性胜利迫使苏联崩溃。然而，随着战线不断拉长，补给日益紧张，严寒也正悄然逼近。面对迫近的危局，苏联将最后的力量投入莫斯科，将时间、寒冬与牺牲化作武器。这场原本追求速度的进攻，正在被拖入一场以意志与消耗为代价的决战。这里没有退路，只有生死。


