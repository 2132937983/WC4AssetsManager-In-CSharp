event_stage_intro_20917=盟军顺势南下突袭了我们位于墨西哥的军事设施，敌人掌握了我们在太平洋岛屿群上基地的坐标，干扰器装置已经失去了意义。南极的苏军迟早会发现我们的基地。现在形势紧迫，立即集结所有可调动的部队，向苏军的南极研究所发动进攻。


