legend_intro_90101=美国海军陆战队第1师是海军陆战队中历史最久、规模最大的师级部队，绰号“老派”（The Old Breed）。其师徽上铭刻的“GUADALCANAL”字样，正是为了纪念该师组建后参加的首场大型战役——瓜达尔卡纳尔岛战役。其中最为激烈的战斗，当属亨德森机场之战。1942年10月23日，借助“东京特快”积蓄了约2万兵力的日军，趁夜向机场发起猛攻。海军陆战队抓住日军协同不力的弱点，连续击退数次冲锋。此役过后，日军损失惨重，彻底丧失了夺回瓜岛的企图，而陆战第1师也首次在太平洋战场打响了名声。
legend_intro_90102=夺下瓜岛后，美军迅速以此为支点，在西太平洋展开攻势，逐步拔除日军据点。1943年12月26日，为清剿新不列颠岛上的日军，陆战1师奉命夺取格洛斯特角附近的两座机场，由日军第17师团部分兵力防守。经历过瓜岛的洗礼，陆战1师已深谙雨林作战之道，五天内便成功控制机场。然而，撤入密林的日军凭借地形持续顽抗，使得稳定机场周边的清剿行动一直持续到1944年2月才渐趋平息。
legend_intro_90103=无力夺回新不列颠岛西部的格洛斯特角机场后，加之美军封锁圈日渐收紧，岛西日军开始向东部的拉包尔转移，以缓解补给压力。察觉这一动向的美军，以陆战1师第5团为骨干组建A战斗队，试图从岛屿中部的威洛梅兹半岛登陆，切断日军退路。1944年3月6日，A战斗队在空袭掩护下成功登陆，随即向半岛上的简易机场推进。日军守军迅速反应并紧急增援，竭力迟滞美军。经过四天激战，日军主力最终完成转移，但A战斗队夺取了威洛梅兹半岛，并以此为支点，不断袭扰撤退中的日军。
legend_intro_90104=为了夺取进攻日占菲律宾的前沿跳板，1944年9月15日，美军发起“欠行2号”行动，剑指帕劳群岛。此时的美军信心十足，此前数月的战斗已让他们摸索出一套克制日军滩头阵地的成熟战术。然而，屡遭败绩的日军此番彻底改变战法：放弃滩头，转而构筑起层层纵深的陆地阵地群，将陆战1师拖入残酷的阵地消耗战。登陆之初异常顺利，可一旦向岛内纵深推进，美军的攻势便被重重阵地死死迟滞。原本计划四天结束的登陆战，演变成一场长达两个月的惨烈消耗。最终，陆战1师以伤亡超过全师三分之一的巨大代价，与第81步兵师协同，全歼岛上日军。美国海军陆战队国家博物馆将此役称为“海军陆战队在战争中最激烈的战斗”。
legend_intro_90105=1945年4月1日，休整完毕的陆战1师踏上冲绳岛——这座二战太平洋战场最大的绞肉机。此战，日军融汇佩莱利乌与硫磺岛的血战经验，照例放弃滩头，将冲绳南部打造成了比硫磺岛更为严密的堡垒群。美军轻松拿下北部，可一旦向南推进，便立刻陷入惨烈的阵地绞杀。陆战1师虽已有类似苦战经历，在这样的战场上仍倍感艰难。最终，美军付出5万伤亡的惨重代价，终于攻克冲绳。陆战1师也在这场炼狱般的战斗中淬火成钢，战功卓著，成为二战后美军最为倚重的快速反应部队。
legend_intro_90106=1991年2月27日，为反击伊拉克对科威特的入侵并夺回科威特城，美军发起科威特国际机场战役。陆战1师作为战场主力之一，与陆战2师并肩突击，在信息化战术的加持下势如破竹。仅以阵亡5人、负伤48人的轻微代价，便击溃伊军7个师，俘虏逾8000人。这场近乎零伤亡的教科书式胜利，标志着陆战1师已从二战丛林浴血的“老派”步兵师，蜕变为一支以信息化、机械化优势碾压对手的现代两栖劲旅。
legend_intro_100101=第51高地师始建于1908年，历经两次世界大战，功勋卓著。然而在二战初期，这支劲旅便遭遇了一场莫大的耻辱。1940年6月初，魏刚防线崩溃，法国败局已定。为保存有生力量，高地师奉命从勒阿弗尔撤退。但德军迅速截断了通往勒阿弗尔的道路，只有第154步兵旅及配属部队成功抵达勒阿弗尔。高地师大部只得与法国第9军团的部队一道，退守滨海小港圣瓦勒里，仓促组织防御。由于港口狭小、地形不利，救援行动困难重重。盟军最终仅从圣瓦勒里撤出3000余人，负责阻击的高地师万余官兵主力被俘。然而，正因他们与法国第9军团在圣瓦勒里的殊死抵抗，盟军得以从勒阿弗尔成功撤出万余人，为日后的反攻保留了珍贵火种。
legend_intro_100102=经历了“循环行动”的惨重损失后，第51高地师在英国重建。经过近两年的防御与战斗训练，该师被投入北非战场，参加决定性的第二次阿拉曼战役。1942年10月23日夜，第51高地师在猛烈炮火掩护下，向德军雷区阵地发起强攻，成功建立前沿阵地并顶住了德军的第一波反击，为后续工兵在雷区中开辟装甲通道赢得了关键时间。依靠装甲通道，盟军装甲师得以入场，奠定了胜利基础。在后续激烈交锋后，德军无奈败退。这支曾遭德军重创的步兵师，以阿拉曼的胜利重铸威名，就此踏上复仇之路，一路从阿拉曼征战到突尼斯，彻底终结了轴心国对北非的控制。
legend_intro_100103=北非战役结束后，第51高地师随即编入第8集团军，投入“哈士奇”行动。1943年7月10日，该师从西西里岛东南端海岸登陆，一路北上，相继攻克维齐尼、弗兰科丰泰等据点，协同主力部队突破敌军防线，最终辅助美军拿下墨西拿，为西西里岛解放划上句号。
legend_intro_100104=哈士奇行动结束后，第51高地师经过半年多休整，再次踏上征途，登陆诺曼底。然而，这支重组的劲旅似乎对迥异于北非沙漠的西欧战场环境颇不适应，登陆初期作战表现不佳，直到“总计行动”才重新展现出往日风采。1944年8月7日夜，加拿大第2军团发起“总计行动”，第51高地师作为主力之一，在弹幕掩护下成功突破德军卡昂南部防御阵地，为后续装甲部队打开深入敌后的通道，前锋一度推进至距法莱斯仅十几公里处。这一战，标志着该师已完全适应了原野与密林的作战法则。
legend_intro_100105=1945年2月，战线已经推进至德国边境。为突破德军齐格菲防线，扫清莱茵河西岸，盟军于2月8日发起“真实行动”。第51高地师作为主力，在炮火掩护下成功突破德军防线，一路向东南推进，2月18日，该师向齐格菲防线的重要枢纽戈赫发起总攻，经数日激战，于2月21日完全占领戈赫，顺利完成既定任务。此役中，德军炸毁鲁尔河水坝，洪水泛滥导致美军“手榴弹行动”推迟，第51高地师在侧翼一度独自承受德军全部压力。直至2月23日美英两军形成合力，方才彻底瓦解德军在莱茵河西岸的防御，盟军渡河条件至此成熟。
legend_intro_100106=1945年3月下旬，一切渡河准备就绪。23日夜，第51高地师在轰隆炮火中强渡莱茵河，于东岸与守军血战后建立桥头堡。自此，通往柏林的道路洞开，合围鲁尔区的态势形成，第三帝国的寿命进入倒计时。此后，第51高地师随第30军向不来梅方向一路挺进，并在当地受降德军，迎来了欧洲战区的胜利消息。二战后，随着英国不断裁军，第51高地师最终解散，但其历史已与苏格兰民族精神熔铸一体，功勋代代相传。

