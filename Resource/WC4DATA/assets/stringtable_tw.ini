skill_info_158=指挥陆地部队进攻后有[#00FF00#%d%%]概率给自己和周围1格友军添加持续1回合“协调”。拥有“协调”的部队伤害+15%%，被添加减益状态（降低士气触发的除外）时抵消该减益状态，然后清除“协调”。
