;噩梦关规则
operation_nightmare_rule_1=1.本活动剧本限时开启，建议各位指挥官合理安排时间，通关并获取奖励。
operation_nightmare_rule_2=2.噩梦难度剧本中，敌军会获得4个增益状态（活动开启时随机4个，直到活动结束），请各位指挥官挑战噩梦难度剧本时，谨慎规划行军路线。
operation_nightmare_rule_3=3.当前难度的剧本，每关中阵亡的将领，下一关中无法上阵，只有重置进度后，才能上阵。
operation_nightmare_rule_4=4.关卡胜利后会记录当前难度最高通关战绩，通关指定关卡可以领取阶段奖励。
operation_nightmare_rule_5=5.进度重置只能重置剧本当前难度的通关进度。

defensive_nightmare_rule_1=1.本活动剧本限时开启，建议各位指挥官合理安排时间，通关并获取奖励。
defensive_nightmare_rule_2=2.噩梦难度剧本中，敌军会获得4个增益状态（活动开启时随机4个，直到活动结束），请各位指挥官挑战噩梦难度剧本时，谨慎规划行军路线。
defensive_nightmare_rule_3=3.守住所有关键区域才能胜利。关卡失败或胜利后都会记录当前难度最高防守回合数，达到指定防守回合数可以领取阶段奖励（全歼敌军后可领取全部阶段奖励）。
defensive_nightmare_rule_4=4.关卡可以重复挑战，但关卡中途退出不会记录当前难度最高防守回合数。


