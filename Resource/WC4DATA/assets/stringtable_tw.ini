legend_army_8=第4近卫坦克师

dialogue_4382=追击敌军，迅速突破敌军防线。我们必须尽快完成莫斯科包围圈！
dialogue_4383=稳住阵线，有序撤退。把后背漏给敌人，就是自寻死路！
dialogue_4384=收拢部队，依图拉一线组织防线。任务只有一个：绝不能让敌人把脚伸到图拉以东！
dialogue_4385=叶廖缅科同志，辛苦你带领部队撤回来了。接下来由你接管防线，绝不能放敌军通过。
dialogue_4386=保证完成任务！
dialogue_4387=同志们，坚持住！图拉每在一天，莫斯科就能多一天准备反攻！
dialogue_4388=迅速支援图拉防线！必须拖住敌人，给反攻争取时间！
dialogue_4389=继续向东，打穿他们的防线！
dialogue_4390=组织第10集团军支援图拉，不能让敌军威胁莫斯科南部防线。
dialogue_4391=撕开突破口，包围图拉！
dialogue_4392=同志们，我们必须截断哈尔科夫以西的德军支援，绝不能让草原方面军的兄弟承受不必要的压力！
dialogue_4393=同志们，任务很艰巨，但荣耀更伟大！消灭肯夫特遣军团，解放哈尔科夫！
dialogue_4394=前线将士尽最大努力维持防线。我会向后方发报，支援很快会到。
dialogue_4395=继续向南突击，切断“波尔塔瓦—哈尔科夫”交通线。支援一断，哈尔科夫守军必定溃退！
dialogue_4396=预备队出动！绝不能让敌军切断交通线，必须保证哈尔科夫的交通畅通！
dialogue_4397=成功收复别尔哥罗德。迅速清剿守军残部，准备向哈尔科夫进攻！
dialogue_4398=电报指挥部：别尔哥罗德已陷落。全城守军迅速向哈尔科夫撤退。
dialogue_4399=德军已被扫除，哈尔科夫再次归于人民！
dialogue_4400=这一战我们败了。收拢防线，整理战备，准备撤离哈尔科夫地区。
dialogue_4401=我军王牌装甲师已经到位。准备反攻，消灭敌军突出部！
dialogue_4402=勒热夫突出部一直是莫斯科的心腹之患，此次行动必须将它彻底扫除！
dialogue_4403=敌人调来了更多的部队。我会向后方要求更多支援。继续按照既定战线防守，我们一定能守住。
dialogue_4404=我从其他战区调来了精锐部队，这一次必须把第9集团消灭！
dialogue_4405=真是个难缠的对手。继续维持攻势！敌人的补给受限，他们不可能一直维持这种强度的防线。
dialogue_4406=预备队顶上，迅速填补缺口！我们人数有限，不能允许他们肆意拉长战线！
dialogue_4407=突击部队出击，把这道伤口狠狠撕开！
dialogue_4408=加大攻势，让敌人无法分出人手回防！
dialogue_4409=收缩防线，保证逃脱通道。不能让敌人将我们包围。
dialogue_4410=摧毁第聂伯河防线的机会就在眼前！继续推进，把他们赶到河对面去！
dialogue_4411=苏军的战线不断扩张，他们的战线会有不可避免的漏洞。现在，反击时刻到了！
dialogue_4412=迅速突围，向哈尔科夫方向撤退！重新集中力量来应对敌军反攻。
dialogue_4413=巴普洛格勒重归我军掌控。继续推进，追击撤退敌军！
dialogue_4414=哈尔科夫守军向河对岸撤退，其余部队稳住防线，绝不能自乱阵脚！
dialogue_4415=敌人的自大把城市还给了我们，我们可不能重蹈覆辙。继续进攻，尽可能的消灭敌人有生力量！
dialogue_4416=太好了！这下哈尔科夫地区的主动权重回我手。
dialogue_4417=之前的过度推进，严重损害了部队的战斗能力。我们必须收拢力量，准备下一次作战。
dialogue_4418=你们这一路负责直插库尔斯克。敌人的防守很严密，做好攻坚准备。
dialogue_4419=先用步兵防线削弱敌军的战斗能力。等敌人疲惫之后，就出动装甲部队消灭敌军。
dialogue_4420=之前没有发现苏军装甲部队，小心提防，防止他们突袭。
dialogue_4421=敌军已经露出了疲态。装甲部队出动，消灭敌军坦克！
dialogue_4422=电报军部：以我们目前的兵力，很难达成既定目标。我们需要支援！
dialogue_4423=他们过不了河。预备队出动，把他们定在河对岸！
dialogue_4424=普罗霍罗夫卡方向出现大批敌军坦克部队，无法分出部队支援。你们只能谨慎推进。
dialogue_4425=明白，我们会全力完成任务！
dialogue_4426=进攻！拿下波尔塔瓦，将德军赶到河对岸去！
dialogue_4427=波尔塔瓦是克雷门丘克前最后一个重镇。尽可能的依托它拖延敌军推进。
dialogue_4428=迅速向克雷门丘克撤退，全军到河西依河防守。
dialogue_4429=追击撤退部队，向克雷门丘克前进！
dialogue_4430=波尔塔瓦有被包围的风险。放弃波尔塔瓦，迅速撤到到对岸。
dialogue_4431=通知前线部队：迅速向克雷门丘克突击，尝试截住敌军退路。
dialogue_4432=你们有一个最重要的任务：把守克雷门丘克，最后一个从克雷门丘克撤离。能做到吗？
dialogue_4433=保证完成任务！
dialogue_4434=同志们！同胞们！昨日，德军将不义的暴行施加于我们的国土；今日，我们将用铁与血给予他们报应！
dialogue_4435=我们绝不能让敌人占领光荣的普鲁士！战士们，为了我们的家乡，战至最后一刻！
dialogue_4436=快速后撤到下一个防御节点，只有活着才能继续阻击敌人！
dialogue_4437=留下部分部队整肃城市，解放集中营。主力部队继续进攻！
dialogue_4438=战友们，与你们奋战到现在，我虽死无憾。继续坚持下去，为了家乡，为了祖国！
dialogue_4439=联系附近部队，让他们支援我们进攻。绝不能让敌人阻挡我们终结战争的步伐！
dialogue_4440=切尔尼亚霍夫斯基阵亡。白俄罗斯第3方面军行动暂停，直到新指挥官上任。
dialogue_4441=现在由我接任指挥。所有情报向我汇报，原有计划继续执行。
dialogue_4442=同志们，之前的失利不算什么，现在我们要夺回我们丢失的荣耀和阵地。进攻，夺回日托米尔！
dialogue_4443=迅速稳定阵线，绝不能让敌人再次摧毁我们好不容易建立的防线。
dialogue_4444=迅速后撤，休整一下，准备对苏军的攻击箭头打反冲锋。
dialogue_4445=继续推进，不能再给敌人夺回基辅的机会！
dialogue_4446=基辅南部的风险点解除。继续向南，打出足够大的缓冲区。
dialogue_4447=不能让敌人继续扩张控制区了，被合围的风险太大。预备队出动，全力阻击敌军部队。
dialogue_4448=突击部队出动，阻击他们的先锋部队，压制他们的推进。
dialogue_4449=开始进攻，迅速截断利沃夫—敖德萨铁路线。只有切断这条铁路线，才能把敌人分割包围。
dialogue_4450=一定要保住铁路。乌克兰西部已经无法防守了。等我劝服他同意撤退，就可以从这条路线撤离。
dialogue_4451=尽可能拖延敌军切断捷尔诺波尔到普罗斯里夫铁路的时间。这条线还在，我们就还有快速调兵的手段！
dialogue_4452=向捷尔诺波尔突击，争取打敌人个措手不及！
dialogue_4453=大型的要塞城市还没丢，还有机会！出动预备队，夺回沿线小镇，再次打通这条铁路。
dialogue_4454=很好！这下敌人就没办法利用这条铁路进行转移了。尽快拿下两座大型城市，彻底绝了他们的念想。
dialogue_4455=该死！第1装甲集团军已经没法从这条线撤了。全力阻止敌军推进，给撤离争取时间。
dialogue_4456=扫荡守军残部，防止敌人夺回。先锋部队继续推进，我们要在这围歼第1装甲集团军！
dialogue_4457=这一战，我们要解放波兰，打通前往柏林的道路。让那个战争犯直面我们的兵锋！
dialogue_4458=我们这一路要解放波兰南部。尤其是西里西亚工业区，解放这里就能削弱德国的工业能力。
dialogue_4459=继续推进，拿下卡托维兹，把上西里西亚全抢下来！
dialogue_4460=华沙解放，波兰的战友们终于再次可以回到他们的首都！
dialogue_4461=迅速后撤，沿山脉重新组织防线。利用山地，尽可能的拖住敌军。
dialogue_4462=尝试打进下西里西亚，做不到就把他们堵在山口。大部队继续向柏林推进，上西里西亚才是核心。
dialogue_4463=上西里西亚工业区被苏军彻底控制，德军工业能力被严重削弱。
dialogue_4464=德军已是穷途末路。进攻，攻克柏林，消灭法西斯！
dialogue_4465=我会尽可能阻止苏军推进，来履行一名军人的职责。
dialogue_4466=施泰纳呢？他为什么还不回援？柏林要撑不住了！
dialogue_4467=长官，施泰纳集团已经停止回复了。
dialogue_4468=干！
dialogue_4469=苏军成功与美军于易北河会师。柏林守军再无转圜之地。
dialogue_4470=战争已经结束了，我代表柏林守军无条件投降。
dialogue_4471=柏林已经解放！广播投降令，清剿残余抵抗部队。
dialogue_4472=盘踞南方的中央集团军群不打算投降，计划依靠捷克继续顽抗。
dialogue_4473=同志们，我们要迅速解放布拉格，起义军正在等待我们支援！
dialogue_4474=同志们，翻过这座山，法西斯的最后抵抗力量将在在这一战被摧毁。
dialogue_4475=布拉格守军尽快镇压叛乱，不能让叛乱影响到前线。
dialogue_4476=现在迅速调集布拉格资源支援前线。他们耽误了太多事，就先抄他们家来填补军资！
dialogue_4477=我们还是行动太慢了。拿下布拉格，为牺牲的同志复仇！
dialogue_4478=布拉格的市民同志们，今天起，布拉格重归布拉格的人民！
dialogue_4479=失去了布拉格，仅凭剩下的城镇，我们还能抵抗多久？
dialogue_4480=市民们，虽然你们之前遭受了残忍的迫害，但一切的牺牲终究换来了布拉格的解放！
dialogue_4481=如果没有那帮暴民，我们或许能把他们挡在山脉以北。但现在说什么都是徒劳了。


army_buff_desc_1691=卫戍:周围1格内每存在1个友方单位，防御力+3，反击伤害+3%。
army_buff_desc_1701=迟滞：本回合行动力-%d。
army_buff_desc_1711=开火预备：下一次攻击伤害提升40%，攻击后消失。
army_buff_desc_1721=集结：将自身受到伤害的30%分配给周围“第4近卫坦克师”单位。不会成为“弹道偏转”的对象。
army_buff_desc_1731=组织松散：“第4近卫坦克师”步兵或坦克单位攻击后，士气下降1级。生效后消失，且本回合无法再次获得。

