elite_intro_55_S1=冰雪会掩埋一切，却无法掩盖王者锋芒。
elite_intro_58_S1=当尖啸撕裂长空，恐惧便已占领敌人的心智。
elite_intro_49_S1=沉默并非仁慈，而是猎手给予猎物最后的体面。
elite_intro_53_S1=有些声音会消散于风中，而有些声音注定在岁月中回响。
elite_intro_100_S1=并非所有光芒都会照亮黑暗。
elite_intro_70_S1=有些航程没有终点，因为探索本身就是答案。
elite_intro_61_S1=暮色降临海面，却无法遮蔽远方的航向。


dialogue_4593=根据情报，东南方有个日本人的应急机场。我们先端掉那里，防止他们空中骚扰我们推进。
dialogue_4594=日军得到情报，紧急增援威洛梅兹半岛。确保西侧部队顺利撤离。
dialogue_4595=好！现在敌人没有就近的机场能用了。全速南下，绝不能放他们跑了！
dialogue_4596=日军西侧部队大部已撤到威洛梅兹半岛东侧，美军原定目标破产。
dialogue_4597=总部发来新指示：中止截击任务，改为占领威洛梅兹半岛，压缩日军活动范围。
dialogue_4598=日军再次加强增援，誓死确保大部队撤退。
dialogue_4599=近岸舰炮覆盖结束，登陆部队可以行动。
dialogue_4600=真安静啊，海岸也没什么敌人的阵地。跟之前差别真大。
dialogue_4601=嗯……也许这次炸的比较彻底，都被炸成灰了？
dialogue_4602=日军从地下堡垒中出动，开始对登岛美军发起猛烈反击。
dialogue_4603=哪里来的炮击？他们不该都死了吗？敌袭！掩护！
dialogue_4604=不行，这么消耗下去，光凭我们是绝对不够拿下这座岛的。我们需要援军！
dialogue_4605=第81步兵师已到位，优先把伤员撤换下来。陆战1师已经消耗得太严重了！
dialogue_4606=海岸轰炸结束，登陆准备完毕。陆军可以行动。
dialogue_4607=这稀疏的防线……我怎么感觉似曾相识呢？伙计们，小心埋伏！
dialogue_4608=我就知道！伙计们，注意警戒，咱们争取都活着回家！
dialogue_4609=日军冲绳岛防御体系大部分已被攻克。
dialogue_4610=坊之岬海战爆发，美军成功击沉大和号。
dialogue_4611=那霸城已经撤空了。提高警戒，他们一定打算在后面的阵线做最后一搏！
dialogue_4612=日军指挥中心被毁，攻势暂缓。
dialogue_4613=冲绳岛北部完全攻克。北部美军即将南下增援。
dialogue_4614=任务目标：解放科威特城，占领科威特国际机场。途中所有阻碍力量全部清除。
dialogue_4615=科威特成功解放，接下来清扫科威特境内伊拉克残余部队，抢救油田。
dialogue_4616=伊拉克不敌盟军，计划点燃科威特境内油井后，撤离科威特。
dialogue_4617=指挥部传来消息：敌军正在计划性的焚毁油田，我们必须加快动作。
dialogue_4618=各位，海军可能会试图用船把我们带走，但这一切的前提是我们必须通力合作。
dialogue_4619=现在，所有人以纪律为第一优先，围绕圣瓦勒里建立阵地。我们防守东西两侧，法国人负责南侧。
dialogue_4620=长官，通往勒阿弗尔的道路已截断。
dialogue_4621=很好。现在进攻圣瓦勒里，消灭包围圈内的敌军。
dialogue_4622=海军运输船抵岸，撤离开始。德军也派出轰炸机，轰炸运输船。撤离行动艰难进行。
dialogue_4623=由于弹尽粮绝，且撤离已无可能，法军先英军一步投降德军。
dialogue_4624=该死！赶紧夺回港口。但如果抢不会来的话……要投降吗？我需要好好想想。
dialogue_4625=够了，已经结束了。向德军发报，我们协议投降。
dialogue_4626=穿过雷区建立阵地！敌人的反击会很猛烈，但你们必须坚持到装甲部队入场。
dialogue_4627=通知前线阵地：谨守前沿阵地，全力阻止敌军的排雷行动。绝不能让敌人的装甲部队通过雷区。
dialogue_4628=阿拉曼德军最高指挥官突发心脏病去世，柏林紧急指派隆美尔回前线指挥。
dialogue_4629=雷区通道已经完成。装甲部队出动，撕开敌军防线。
dialogue_4630=我向罗马争取了弹药和燃料增援，补给暂且有了保障。
dialogue_4631=以当前局势来看，敌军接下来的进攻重点在北部。我们必须主动出击，消灭掉他们的进攻桥头堡。
dialogue_4632=向柏林发报：兵力已消耗殆尽，无力对敌军下一次突破组织任何有效抵抗。继续作战，将有倾覆之危。
dialogue_4633=柏林回电：必须坚守阵地，倾尽所有火炮和士兵投入战斗。
dialogue_4634=这是在要求一项不可能的任务！
dialogue_4635=上级命令不应再被重视。我们必须拯救那些还能拯救的东西。
dialogue_4636=各部队登陆后迅速北上解放卡塔尼亚，优先占领卡塔尼亚机场。
dialogue_4637=尽可能的利用山地地形和敌人周旋。总部不会放弃西西里岛，增援必将到达。
dialogue_4638=德军增援部队抵达西西里岛。
dialogue_4639=全力阻碍敌军推进，务必确保至墨西拿的路线畅通。
dialogue_4640=继续北上，我们要比美国佬先一步拿下墨西拿。
dialogue_4641=因西西里战事失利，罗马爆发政变。轴心军指挥官因此犹疑不定。
dialogue_4642=西西里战事预计是以失败告终了，我得提前做好撤离准备。
dialogue_4643=我军已完全解放西西里岛西侧，现在需要你们配合我们的突击墨西拿，截断轴心军退路。
dialogue_4644=所有部队执行弹幕推进，今天必须把敌人的阵线砸碎。
dialogue_4645=前线部队锁紧防线，必须将敌人挡在法莱斯以北！
dialogue_4646=以装甲部队为先锋继续向法莱斯推进，趁敌人反应不及，截断他们的退路。
dialogue_4647=绝不能让盟军继续深入。如果让他们占领法莱斯，后果不堪设想。
dialogue_4648=党卫军第12师迅速北上，不惜一切代价阻止敌军南下。
dialogue_4649=他们会成为我的虎式炮管上下一排“死亡圈”。
dialogue_4650=魏特曼被击杀，坦克王牌的传奇被终结。
dialogue_4651=德军在法莱斯被重新修筑防线。仅凭此战拿下法莱斯，机会渺茫。
dialogue_4652=行动开始！美军会配合我们从南面合围，这一战要将莱茵河以西的德军彻底歼灭!
dialogue_4653=果然，敌军还是选择从齐格菲防线最北端的薄弱点进攻了。
dialogue_4654=启动预案：打开鲁尔河大坝，截断美军进攻。驻守部队全力阻击北部敌军。
dialogue_4655=德军打开鲁尔河大坝，鲁尔河水位暴涨。美军“手榴弹行动”被迫延期。
dialogue_4656=得到消息，德军截断了美军的进攻路线。前线部队做好应对敌军增援的准备。
dialogue_4657=南下支援戈赫方向部队。
dialogue_4658=整备后继续南下，做好和美军合围敌军的准备。
dialogue_4659=齐格菲防线最北端还是被攻克了。发报柏林，我们需要撤退到莱茵河东岸，依托河流防守。
dialogue_4660=柏林回电：必须利用敌军无法配合的时段，对敌人发起打击。撤退只是拖延不可避免的战斗。
dialogue_4661=他到底明不明白前线的状况？这怎么可能做到！
dialogue_4662=火炮压制开始，各部队迅速渡河。
dialogue_4663=敌军开始渡河了，各防线做好战斗准备！
dialogue_4664=渡河部队成功建立第一座桥头堡。
dialogue_4665=联系周围部队，深入敌军腹地，阻断敌军支援。
dialogue_4666=预备队出动，把敌军的桥头堡清除，维持防线完整。
dialogue_4667=成功与伞兵部队会合。伞兵部队将与我部配合行动。
dialogue_4668=伞兵部队已经到位，敌军的联络节点已摧毁。各部队注意支援。

army_buff_desc_1751=警惕：受击时减伤40%，受击后消失。
army_buff_desc_1761=冲锋：攻击力+20%，攻击后消失。
army_buff_desc_1771=掩护机动：防御+%d%，行动力+%d%。
army_buff_desc_1781=突入掩护：若攻击后不被反击，赋予攻击目标“匆忙应对”buff1回合。
army_buff_desc_1791=匆忙应对：攻击力降低%d%%。


