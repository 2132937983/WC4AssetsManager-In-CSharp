event_intro_4125=在苏军连续突破防线并占领维堡后，得到德军装甲部队增援的芬兰军队，在VKT防线组织了顽强防御。1944年6月25日，苏军再度发动进攻，但攻势在芬军猛烈的炮兵火力覆盖下被遏制，未能实现突破。此役的受挫，令苏联高层确信彻底征服芬兰的代价过高，因而主动停止进攻并提议和谈。
event_intro_4126=为彻底解放乌克兰并进军波兰，苏联最高统帅部命令科涅夫元帅的乌克兰第一方面军发起进攻，目标是歼灭德军“北乌克兰”集团军群。1944年7月13日，苏军发动了利沃夫-桑多梅日攻势。在成功突破德军防线后，苏军完成了对德军重兵集团的合围与歼灭，解放了利沃夫。此役中建立的桑多梅日登陆场，成为后续维斯瓦河-奥得河战略性进攻的关键跳板。
event_intro_4127=为获取轰炸日本本土的前沿战略基地，美军于1944年7月24日进攻了距离塞班岛仅5海里的天宁岛。登陆部队采用声东击西战术，成功将大量日军吸引至西南岸，主力则在防御薄弱的西北岸顺利登陆。完全占领天宁岛后，美军迅速将其改建为大型轰炸机基地。为扫清地面障碍、加快作战进程，美军在此战中首次实战使用了凝固汽油弹。
event_intro_4128=1945年8月11日，苏军从库页岛北部发起进攻。但由于日军第5方面军下达了“保卫库页岛至最后一人”的严令，岛上的守军在日本宣布投降后仍继续抵抗。苏军随后发动两栖登陆，最终占领了南库页岛的行政中心丰原（今南萨哈林斯克），岛上日军全部投降。此役日军约1.8万人被俘，苏军由此结束了日本对南库页岛长达40年的统治。
event_intro_4129=为夺回瓜达尔卡纳尔岛并消灭美军航母舰队，日军派出包含三艘航母在内的特混舰队南下，并于8月24日空袭了亨德森机场。在双方舰队互相发现后，日军轻型航母“龙骧”号被击沉，美军“企业”号航母遭重创。此战日军损失了更多舰载机，其增援船队也因失去空中掩护而被迫折返。美军成功保住了制海权与亨德森机场，从而巩固了在南太平洋的战略主动权。

dialogue_4578=芬军获得了大量来自德国的军备援助。我们要在敌人的增援抵达前全力撕开这道防线。
dialogue_4579=防线即将被突破，立刻发动反击抵挡苏军的攻势。
dialogue_4580=为避免被完全包围，德军主力部队开始向西南方向撤退。
dialogue_4581=收紧包围圈，不要放走德军主力。
dialogue_4582=我们的援军正在不断抵达战场。继续前进，追击撤退的敌军。
dialogue_4583=苏军在利沃夫方向发起了全面进攻，轴心国的部队开始向喀尔巴阡山脉一带撤退。
dialogue_4584=日军部队被西南方的登陆行动所吸引，分兵增援攻击西南方佯装登陆的美军。
dialogue_4585=美军成功在西北海岸登陆。日军开始加强天宁岛上的各条防线。
dialogue_4586=不要畏惧苏军的进攻，我们会保卫桦太至最后一人！
dialogue_4587=苏军海陆并进的同时，空降部队也直接发起空降行动。
dialogue_4588=我们尽全力战斗到了最后一刻。
dialogue_4589=苏军已经发起了全面进攻，尽可能将人撤回北海道。
dialogue_4590=胡蜂号已被紧急召回。我们必须阻止日军舰队前进，尽可能消灭敌军的舰载机与航母。
dialogue_4591=企业号已经被我们重创，继续消灭剩余的航母。
dialogue_4592=亨德森机场起飞的战机重创了日军的登陆部队与护卫舰，日军登陆部队与第8舰队开始向北方撤离战场。

