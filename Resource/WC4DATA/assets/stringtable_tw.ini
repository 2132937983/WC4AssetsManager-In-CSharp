dialogue_4000=快速绕过阿拉斯，我们要尽快占据斯卡尔普河上的桥梁。第5装甲师已经接到命令，很快就会来支援。
dialogue_4001=此时，法军和英军分别接到指令准备在阿拉斯发起一次反攻。
dialogue_4002=接通第25装甲团，我需要他们停止自由搜索，配合师部行动。
dialogue_4003=点击组编按钮。
dialogue_4004=点击想要组编的军团。
dialogue_4005=点击需要编入的单位。
dialogue_4006=点击确认编入按钮。
dialogue_4007=第25装甲团听令：谨慎前进、保全自己，等待步兵主力一起控制桥梁。
dialogue_4008=该死！敌人坦克的装甲太厚了！通知前线，把88炮放平当反坦克炮用！
dialogue_4009=正面强攻？…这要付出代价的。但有时候，最直接的路线反而能打乱敌人所有算计！
dialogue_4010=法军为掩护英军右翼而向前推进,但因沟通不畅，把英军也识别成敌军。
dialogue_4011=冲突后，双方确认了友军身份，法军继续推进。
dialogue_4012=通知空军，敌军攻势异常猛烈，我部需要轰炸支援！
dialogue_4013=敌军正在撤退。全体追击，拿下阿拉斯！
dialogue_4014=快速推进到涅曼河畔，抢占阿利图斯。
dialogue_4015=很好，守住阿利图斯的桥梁，绝不能让苏军夺回！
dialogue_4016=此时，苏联第5装甲师正在迅速赶往阿利图斯支援。其第一波先头部队即将抵达。
dialogue_4017=苏第5装甲师主力部队抵达阿利图斯。
dialogue_4018=阿利图斯的情况我已了解，已通知空军轰炸支援。你部务必守住阿利图斯！
dialogue_4019=空军侦察到阿利图斯有大量部队增援，优先攻击涅曼河上游桥梁，逼迫敌军分出部队支援。
dialogue_4020=不愧是“幽灵师”！苏军援军已溃，通知其他部队，全力进攻，占领涅曼河以西城镇！
dialogue_4021=命令第3、第4装甲集群从正面突破苏军防线，在维亚济马后侧完成合围。
dialogue_4022=从第19集团军和第30集团军的结合部突破，与第4装甲集群在维亚济马后侧会合。
dialogue_4023=调集第19、30、49集团军的坦克部队围堵敌军，不能让他们继续突破！
dialogue_4024=通知前线部队放弃阵地，向后撤退，避免被敌军包围。
dialogue_4025=第4装甲集群击退布琼尼领导的预备队方面军，准备攻入维亚济马。
dialogue_4026=成功与第4装甲集群会合，维亚济马包围圈形成。
dialogue_4027=全力向东突围，绝不能让德军俘虏！
dialogue_4028=这是我们最接近胜利的时候。不要考虑其他，你们只有一个任务：攻占亚赫罗马，从北面打进莫斯科！
dialogue_4029=士兵们！战争已经到了最关键的时刻，我们必须胜利，只能胜利！
dialogue_4030=西伯利亚，雪风呼啸。恶劣的天气极大的影响了德军的视野和作战能力。
dialogue_4031=克林已被第7装甲师拿下，莫斯科北部防线收窄。
dialogue_4032=通知罗科索夫斯基：不管用什么办法，16集团军必须把克林方向的部队拦下来！绝不能让他们打进莫斯科！
dialogue_4033=亚赫罗马被攻克，德军完成莫斯科大包围的北部条件成熟。
dialogue_4034=第1突击集团军守住防线，绝不能让德军打过红军城！
dialogue_4035=克里姆林宫的轮廓依稀可见，但第3装甲集群的燃料和弹药已经见底。攻入莫斯科的可能，只剩下奇迹。
dialogue_4036=不可思议！第7装甲师攻入了莫斯科市区。但这也激发了莫斯科里最激烈的抵抗力量。
dialogue_4037=莫斯科城防军队就位，消灭所有踏入莫斯科的敌人。光荣的时候到来了！我们就是莫斯科！
dialogue_4038=南方集团军群听令：以第4装甲集团军为主力，肯夫特遣军团掩护侧翼，消灭近卫第6集团军。
dialogue_4039=隶属于肯夫特遣军团的第7装甲师也接到命令，准备向别尔哥罗德以东发动进攻。
dialogue_4040=第7装甲师成功强渡北顿涅兹河，成功在近卫第7集团军防线构建桥头堡。
dialogue_4041=通知近卫第7集团军：拖住敌军，不要让他们有机会支援主力。
dialogue_4042=桥头堡进一步扩大，已经可以对主力部队进行掩护。
dialogue_4043=电告总参谋长：敌人即将向普洛霍罗夫卡发起突击。请求坦克增援。
dialogue_4044=已调集近卫第5集团军前往支援。你部不惜一切代价阻止敌军继续突破！
dialogue_4045=苏军哪来这么多坦克！撤退，不能把所有部队都陷阱去。
dialogue_4046=火炮压制后，全军出击。今日，我们要拿下基辅！
dialogue_4047=守住基辅已经不可能。第7装甲师迅速支援法斯托夫，不能让我们的退路被堵死。
dialogue_4048=所有部队撤往法斯托夫组织防线，阻止敌军进一步扩张。
dialogue_4049=所有部队撤往白采尔科维。
dialogue_4050=电报柏林：基辅已经失守。
dialogue_4051=迅速回援日托米尔，不能让铁路枢纽落到敌人手里。
dialogue_4052=第48装甲军从法斯托夫向北突击，我们要在日托米尔打一个包围，才能阻止苏军进一步推进。
dialogue_4053=迅速突围，各部队稳固战线，不要轻敌冒进！
dialogue_4054=空军地毯式轰炸即将到位，轰炸结束后，直接冲破敌军防线！
dialogue_4055=轰炸结束，进军！
dialogue_4056=预备队压上填补缺口，不能让他们突破防线。
dialogue_4057=第3装甲师成功突破防线，德军被迫收缩收缩防线。
dialogue_4058=抽调第2装甲师和第116装甲师驰援，必须阻止敌军扩大战果。
dialogue_4059=逐步推进，收窄袋口。不能让敌军逃出包围圈。
dialogue_4060=向东有序撤退，不能让他们完成合围。
dialogue_4061=我已经尽力，是时候结束这场战争了。再继续下去，将是德国的灾难。
dialogue_4062=炸弹刺杀案事发。克鲁格解职，莫德尔接任指挥。
dialogue_4063=全力攻击包围圈，给受困部队制造逃生缺口。
dialogue_4064=包围圈形成，受困德军发起决死突围。
dialogue_4065=亚琛政治意义重大，拿下它，对敌军士气有极大打击。
dialogue_4066=亚琛归我们了！休整一下，向许特根森林发起进攻。
dialogue_4067=通知后方征召更多填线部队，我们必须在许特根森林拖住敌军。
dialogue_4068=许特根森林复杂的地形，极大削弱了第3装甲师。
dialogue_4069=坚守堡垒，党卫军正在前往支援。
dialogue_4070=这是关系到国家命运的一战。只许胜，不许败！
dialogue_4071=全军出击，穿过阿登山区，拿下安特卫普！
dialogue_4072=装甲部队迅速向阿登森林支援，阻止敌军进一步推进。
dialogue_4073=北线和南线受阻，兵力向中部集中，必须打出阿登森林。
dialogue_4074=拿下巴斯托涅，不能让他挡在我们的进攻路线上。
dialogue_4075=第101空降师拒绝投降，坚守巴斯托涅。
dialogue_4076=迅速支援巴斯托涅，绝不能让德军控制交通枢纽。
dialogue_4077=巴斯托涅失陷，德军支援部队可以迅速行动。德军攻势进一步加强。
dialogue_4078=第1集团军突破莱茵河防线，从南部封锁鲁尔工业区。
dialogue_4079=第3装甲师接到命令，快速推进至利普施塔特，与第9集团军部队会合。
dialogue_4080=向包围圈内广播：缴枪投降，盟军会保证战俘的权益。
dialogue_4081=作为帝国的元帅，我不能授权投降，但我会尽力为士兵留下逃生的希望。
dialogue_4082=传我命令：B集团军群解散。所有作战部队要么以有组织的队形突围，要么放下武器回家。
dialogue_4083=我至少战斗到了生命的最后。
dialogue_4084=第3装甲师师长在作战中阵亡，但其勇猛的作战精神，激励了部队的作战意志。
dialogue_4085=莫德尔拒绝投降，饮弹自尽。
dialogue_4086=1991年2月24日，沙漠风暴行动开始。第3装甲师作为美军主力之一向伊拉克发起进攻。
dialogue_4087=科威特被攻克，联合国军队声势大振。
dialogue_4088=美军电子干扰系统启动，伊拉克军队的电子通讯系统失效。
dialogue_4089=伊拉克陆军大部分被消灭，联军取得压倒性胜利。伊拉克政府请求投降。
dialogue_4090=海军步兵第255旅被派往第56集团军和第18集团军之间的交界处，阻止德军进一步推进。
dialogue_4091=为拿下图阿普谢，德军发动“阿提卡行动”。
dialogue_4092=德军先锋部队抵达图阿普谢城外，请紧急回援。
dialogue_4093=图阿普谢被德军攻占，苏军集中兵力，围攻占城德军。
dialogue_4094=收复图阿普谢，苏军乘势向德军发动反击。
dialogue_4095=海军步兵第255旅成功开辟桥头堡，苏军迅速投入大量援军。
dialogue_4096=新罗西斯克守军出动，阻止苏军进一步扩大桥头堡。
dialogue_4097=苏军攻势达到极限，准备固守桥头堡，作为下一次行动的支点。
dialogue_4098=为消灭桥头堡，德军加大进攻兵力。
dialogue_4099=桥头堡被压缩。一位政委跟随物资到来，鼓舞战士们一定要保住小地。
dialogue_4100=海军步兵第255旅奉命从新罗西斯克港内登陆，计划从内侧攻克敌军防线。
dialogue_4101=成功突破外围防线，与德军进入巷战阶段。
dialogue_4102=新罗西斯克的外围堡垒被攻克，苏军逐步掌控新罗西斯克。
dialogue_4103=成功解放新罗西斯克，德军向西北方撤退。苏军乘势展开追击。
dialogue_4104=第18集团军突破新罗西斯克北侧防线，形成北部合围。
dialogue_4105=第18集团军登陆部队成功突破海军封锁，登陆埃利季根。轴心军迅速集中兵力反扑。
dialogue_4106=埃利季根突出部成功牵制德军主力。第56集团军登陆部队乘势出击，登陆科赤东北部。
dialogue_4107=敌军岸防部队火力凶猛，科斯坚科上士壮烈殉国。
dialogue_4108=刻赤北部桥头堡巩固，德军全力进攻埃利季根。
dialogue_4109=苏联奇兵突袭刻赤，轴心军紧急回援。
dialogue_4110=成功攻克巴拉克拉瓦，对萨蓬山区的第49山地军形成包夹。
dialogue_4111=对萨蓬山区的第49山地军被苏军击退。敌军退守塞瓦斯托波尔防线。
dialogue_4112=攻克梅肯济高地。敌军北部防线崩溃。
dialogue_4113=塞瓦斯托波尔解放，德军被迫向西撤退，准备从海上逃离。
dialogue_4114=罗马尼亚舰队被击退，撤离部队士气崩溃。
dialogue_4115=苏军完成对塞瓦斯托波尔的封锁。困守轴心军决心拼死防守。
dialogue_4116=海军步兵第255旅奉命乘夜渡过德涅斯特湾，为46集团军主力部队建立登陆桥头堡。
dialogue_4117=轴心军岸防部队发现登陆部队，抢滩作战一触即发。
dialogue_4118=成功建立北部滩涂阵地。拔除阿克尔曼，为主力部队扫清滩涂阵地。
dialogue_4119=阿克尔曼成功解放，敌军被迫放弃河口防线。
dialogue_4120=战场北方的苏联第37集团军取得重大突破，敌军为避免包围开始撤军。

