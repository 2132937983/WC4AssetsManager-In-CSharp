event_stage_intro_20701=总理一再催促我们向英军发起进攻。但是部队的机械化程度过低，缺乏大量的装备与物资补给，这场攻势必然无法持续。现在也只能凭借我们的人数优势来弥补其他方面的不足。向埃及前进吧。
event_stage_intro_20702=英军的反攻速度十分惊人，但是敌人错估了我们的部队规模。现在他们已经是强弩之末，我们有足够的力量可以将昔兰尼加的守军逐个击破。以歼灭英军的有生力量为主要目标，全速前进，不要放过任何敌人！
event_stage_intro_20703=希腊的盟军已经被我们全部击败，克里特岛已是敌人在地中海上的最后一个重要据点。一旦夺取了岛屿，我们便能以此为跳板进而占领塞浦路斯，甚至是从海上向埃及发起进攻。
event_stage_intro_20704=英军发起了新的攻势以打通前往图卜鲁格的道路。我们早已重新加固了原有的防御设施，构筑了新的阵地以应对英军的推进。之后补给和援军将会陆续抵达，我们将重新掌握北非战场的主导权。
event_stage_intro_20705=图卜鲁格及其周边区域的包围圈即将完成，但是目前我们仍缺乏大量的物资与装备来发起一场大规模的进攻。不过英军的主动出击正好帮我们解决了这个问题。速战速决，消灭敌人的有生力量，避免补给线过长而引发的一系列问题。
event_stage_intro_20706=我们的补给线长度已经到达了极限。敌人的海空军仍然在地中海海域对我们造成了不小的威胁。以英军为首的盟军部队还在通过红海和苏伊士运河源源不断地获得兵员物资的补充。形势严峻，但这就是我们在北非战场的最后一战，也是决定我们命运的一战。
event_stage_intro_20707=盟军已经在摩洛哥和阿尔及利亚卷土重来。美军加快了陆路的推进速度，英国海军也集结了地中海全部的战力在向突尼斯湾集结，当地维希法国的守军可能已与盟军取得了联系。危机已经逼近，我们会用剩余的力量在突尼斯坚守到底，等待隆美尔的主力抵达。
event_stage_intro_20711=总理一再催促我们向英军发起进攻。但是部队的机械化程度过低，缺乏大量的装备与物资补给，这场攻势必然无法持续。现在也只能凭借我们的人数优势来弥补其他方面的不足。向埃及前进吧。
