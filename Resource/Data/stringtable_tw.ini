operation_stage_name_21015=加拿大
operation_stage_name_21016=北海
operation_stage_name_21017=北欧

event_stage_intro_21001=战争的形势已被改写。苏军在西海岸的攻势已被成功阻滞。敌人因补给线过度延伸导致战术进攻效能持续衰减，但集团军级兵力优势仍然存在。务必依托预设工事实施梯次防御，保卫好援军的集结点直至战略反攻阶段启动。
event_stage_intro_21002=我们秘密训练的部队已经做好了进攻准备。特遣舰队将针对猪湾实施两栖夺控，同时确保瘫痪该区域的防空体系。地下抵抗组织也会接应我们的行动。中情局已做出保证，这次突袭将会万无一失。
event_stage_intro_21003=苏军北方舰队特混编队已经完成了对纽约外海的封锁，但形势并非不可挽回。立即启动应急通讯协议，执行要塞拔除作战。联系各地的部队重新组建进攻集群，削弱东海岸苏军的力量。
event_stage_intro_21004=苏军对我们本土的直接进攻已经被一系列的反击所挫败。现在敌人转移了进攻的重心，把矛头对准了周边的国家和地区。欧洲本土早已启动了防卫措施，但苏军仍在极短的时间内占领了冰岛，现在格陵兰岛和加拿大就是他们的下一个目标。
event_stage_intro_21005=加拿大的叛军与国内的反对势力组成了联军，控制了五大湖地区并向东部发起了进攻。在我们调集部队的同时，苏军趁虚而入重新登陆。情报显示叛军与苏军双方并非协同作战，利用好这两股势力发生冲突的间隙，驰援各地的友军，平定叛乱驱逐外敌。
event_stage_intro_21006=欧洲与苏联的冲突已经演变为一场热战。北方舰队的进攻速度令我们始料未及，就连我们最重要的盟友英国也没能幸免。英国本土已有多地被苏军占领，欧洲需要我们的援助，特遣舰队与战略运输机已经准备就绪，随时可以集群出动！
event_stage_intro_21007=苏军正集结最后战略预备队实施困兽之斗。其方面军指挥系统已出现明显裂隙，各成员国之间也许并没有我们认为的那么团结。我们必须联合一切可以联合的力量向东进攻，把苏联人赶回自己的土地。这是个扩大我们在欧洲影响力的绝佳机会。
event_stage_intro_21011=战争的形势已被改写。苏军在西海岸的攻势已被成功阻滞。敌人因补给线过度延伸导致战术进攻效能持续衰减，但集团军级兵力优势仍然存在。务必依托预设工事实施梯次防御，保卫好援军的集结点直至战略反攻阶段启动。
