elite_intro_96=豹2主战坦克是德国研制的第三代主战坦克，以性能均衡、可靠性高、服役范围广而闻名。其标志性的120毫米滑膛炮拥有极高的初速与精准度，可发射多种高效穿甲弹，对远距离目标仍具强大伤害性。强劲的动力系统赋予豹2卓越的机动性能，使其在崎岖地形中依然保持惊人的速度与灵活性，展现出现代主战坦克中难以匹敌的综合战斗能力。

