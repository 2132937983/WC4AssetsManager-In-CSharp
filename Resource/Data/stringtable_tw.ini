feat_desc_110=在山地和森林地形时，受到伤害降低{1}%
feat_desc_111=发射多枚近程导弹，对目标造成近程导弹{1}%伤害，对目标周围敌军造成{2}%伤害，冷却3回合
feat_desc_111_Lv2=发射多枚近程导弹，对目标造成近程导弹{1}%伤害，对目标周围敌军造成{2}%伤害，冷却2回合
feat_desc_111_Lv3=发射多枚中程导弹，对目标造成中程导弹{1}%伤害，对目标周围敌军造成{2}%伤害，冷却2回合
feat_desc_112=每回合开始时恢复HP上限的{1}%。满血时受到伤害降低{2}%
feat_desc_113=对非建筑单位造成伤害+{1}%
feat_desc_114=攻击后，敌方有{0}%概率获得无法普通攻击和反击的状态，持续1回合
feat_desc_115=歼敌后，目标周围1格其他敌军有{1}%概率士气降低

