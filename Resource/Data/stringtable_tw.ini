event_stage_intro_20901=基地已经自毁，我们是最后一批成功撤离的部队。最后时刻设置的临时坐标应该会把我们带到南美丛林中的基地附近。这次我们将会有更多的时间筹划这一切。
event_stage_intro_20902=西班牙的内战已经全面打响，在德意苏三方介入后，不干涉协议已经名存实亡。过去的日不落帝国已然分崩离析，新的日不落帝国也会步此后尘。即便这一战的结局已经无法改写，但我们还是要投入战斗。因为那里有我们的战友。
event_stage_intro_20903=二战后马歇尔计划让美国在中东收获了土耳其这个盟友。但此时在苏联的煽动下，伊朗民族主义情绪日渐高涨，在伊朗生产石油变得越发困难。这严重危害了我们的利益！在新总统艾森豪威尔的批准下，中情局与军情六处合作策划了一场政变。这次行动必须成功。
event_stage_intro_20904=奥斯本的计划成功地让各方势力在南美丛林中打得不可开交。日本与苏联的民族主义者们也利用这个间隙主动攻击了驻日美军的基地。据说苏军已经研制出了卫星武器，这正是我们抢夺这项技术的好时机！尤丁采夫安排了一位通信卫星方面的专家，他会在库页岛的苏军基地附近与我们会合。
event_stage_intro_20905=马歇尔计划加速了西欧的重建，各国经济飞速发展。但近期意大利国内腐败滋生，社会动荡，甚至总理都遇刺身亡。与此同时苏军迅速占领了捷克斯洛伐克全境，并持续向巴尔干半岛增兵。东欧这个火药桶已被我们点燃，欧洲格局即将被重构。
event_stage_intro_20906=美国的分离主义者们因不满总统的连任而发起了武装起义。奇怪的是我们并未干预过这次的选举，而且在我的印象里也没有发生过类似的战争。现在总统居然主动联系我们来平定这场叛乱。这次的行动充满了不可预知性，要时刻注意各支美军部队的动向。
event_stage_intro_20907=盟军顺势南下突袭了我们位于墨西哥的军事设施，敌人掌握了我们在太平洋岛屿群上基地的坐标，干扰器装置已经失去了意义。南极的苏军迟早会发现我们的基地。现在形势紧迫，立即集结所有可调动的部队，向苏军的南极研究所发动进攻。
event_stage_intro_20911=基地已经自毁，我们是最后一批成功撤离的部队。最后时刻设置的临时坐标应该会把我们带到南美丛林中的基地附近。这次我们将会有更多的时间筹划这一切。
