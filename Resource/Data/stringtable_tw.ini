skill_info_170=指挥装甲部队伤害增加[#00FF00#%d%%]，进攻后回复造成伤害10%%的HP，拥有增益状态时致命一击概率提升10%%且无视敌军30%%防御。指挥装甲部队移动时无视敌军部队的阻挡，攻击后若目标未被消灭则可以再次攻击（一回合1次）
skill_info_171=指挥装甲部队士气不会降低，攻击时敌军[#00FF00#%d%%]概率无法反击，歼敌后获得持续1回合的“收割”（效果为造成伤害提高20%%，无视闪避）。指挥装甲部队攻击力每有30则提升5%%致命一击伤害，攻击力不低于180时自身射程+1
skill_info_172=指挥步兵部队有[#00FF00#%d%%]概率造成致命一击，每回合回复上限15%%的HP。指挥步兵时，自身及周围2格步兵伤害提高30%%，受到伤害降低25%%（拥有该技能时，步兵指挥官效果无效）
skill_info_173=指挥陆军部队在场时，回合内已消耗经济的[#00FF00#%d%%]将会在下回合获得（上限1200）。指挥陆军部队周围3格内敌人被消灭则获得40工业和4科技（1回合最多触发3次）
skill_info_174=指挥潜艇（核潜艇除外）无视敌军防御，进攻时射程+1。指挥潜艇歼敌后有[#00FF00#%d%%]概率再次攻击，造成致命一击时额外提升25%%概率。
skill_info_175=指挥潜艇受到伤害降低[#00FF00#%d%%]，受到空军和导弹攻击时有50%%概率闪避。指挥潜艇部队每回合回复5%%上限的HP。

army_buff_desc_1631=收割：造成伤害提高20%，无视闪避


