feat_desc_98=进入潜行状态，无法被陆军、海军主动攻击。冷却2回合。潜行时行动力+{1}，持续1回合。攻击后解除潜行状态。
feat_desc_99=攻击时无法被反击。攻击部队时造成的伤害提高{1}%（潜行状态下伤害提高{2}%），攻击建筑时伤害降低50%
feat_desc_100=呼叫直升机，将自身运至5格内的指定位置，冷却2回合
feat_desc_100_Lv2=呼叫直升机，将自身运至9格内的指定位置，冷却2回合
feat_desc_101=部队损失过半后，下回合回复上限{1}%的HP
feat_desc_102=本回合致命一击概率增加{1}%，攻击时无视目标{2}%的防御力，冷却2回合
feat_desc_103=防御力增加{1}%
feat_desc_104=防空武器无法防御来自超高空轰炸的攻击
feat_desc_105=无法作为航母舰载机。每次发动攻击时能够在目标区域内额外造成{1}%伤害效果
feat_desc_106=攻击携带核弹时，核弹造成的伤害提高{1}%
feat_desc_107=本回合攻击时对目标1格范围内其他目标造成{1}%额外伤害，冷却2回合
feat_desc_108=能够攻击敌方多个部队，对坦克、火炮单位伤害增加{1}%
feat_desc_109=使周围1格范围内的敌方部队大部分增益状态失效，冷却3回合
feat_desc_109_Lv2=使周围2格范围内的敌方部队大部分增益状态失效，冷却2回合

