skill_info_162=指挥舰船时士气不会下降，舰船攻击造成致命一击时提高[#00FF00#%d%%]伤害。指挥舰船时，周围2格有友军航母或自身为航母则自身使用空军，导弹，核弹时提高30%%伤害，周围2格友军航母获得效果为使用空军时提高15%%伤害
skill_info_163=指挥舰船时，攻击和使用空袭时有[#00FF00#%d%%]概率造成致命一击（拥有该技能时，舰队指挥官和空军指挥官效果无效）
skill_info_164=指挥精英步兵时，1格范围内友军（含自身）对陆地单位造成伤害+10%%（精英部队等级不低于9级时，加成变为15%%），范围内每多1个友军精英部队则额外+[#00FF00#%d%%]，合计上限25%%
skill_info_165=指挥步兵进攻后回复造成伤害[#00FF00#%d%%]的HP，周围1格存在友军装甲或火炮时，自身攻击和反击射程+1



