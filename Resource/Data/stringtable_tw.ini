army_buff_desc_1371=地狱火导弹：对目标1格范围内其他目标造成25%额外伤害
army_buff_desc_1372=地狱火导弹：对目标1格范围内其他目标造成50%额外伤害
army_buff_desc_1373=地狱火导弹：对目标1格范围内其他目标造成80%额外伤害
army_buff_desc_1381=颠簸：行动力降低30%（相同类型不叠加）
