feat_desc_88=1格范围内部署地雷，地雷可以造成{1}点伤害，冷却1回合
feat_desc_88_Lv3=2格范围内部署地雷，地雷可以造成{1}点伤害，冷却1回合
feat_desc_89=在4格范围内，挖掘一条从当前位置到目标地块的地道。目标地块不能是山地，海洋，并且不能穿过海洋。己方步兵、装甲车、轻型坦克、中型坦克、野战炮、榴弹炮、火箭炮可通过地道通行。从地道通行后可获得额外行动，每条地道上限3次。当挖设新地道时，原地道消失。冷却2回合
feat_desc_89_Lv2=在7格范围内，挖掘一条从当前位置到目标地块的地道。目标地块不能是山地，海洋，并且不能穿过海洋。己方步兵、装甲车、轻型坦克、中型坦克、野战炮、榴弹炮、火箭炮可通过地道通行。从地道通行后可获得额外行动，每条地道上限3次。当挖设新地道时，原地道消失。冷却2回合
