skill_info_156=指挥装甲部队士气不会降低，提升[#00FF00#%d%%]伤害。指挥装甲部队歼灭敌军后获得“英雄”状态，提升10%%致命一击概率，持续1回合。
skill_info_157=指挥装甲部队时，对城市驻军以外的非建筑单位+20%%伤害。攻击后如果无法攻击且无法移动，则有[#00FF00#%d%%]概率再次攻击（一回合只能1次），且本回合每次歼敌都将提高20%%概率（最高100%%），使效果变为再次行动。
skill_info_158=指挥陆地部队进攻后有[#00FF00#%d%%]概率给自己和周围1格友军添加持续1回合“协调”。拥有“协调”的部队伤害+15%%，被添加减益状态（降低士气触发的除外）时抵消该减益状态，然后清除“协调”。
skill_info_159=在自身领地时攻击力+15，被致命一击的概率降低[#00FF00#%d%%]。


