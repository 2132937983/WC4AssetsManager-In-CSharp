dialogue_3536=我们会为你们的部队持续提供物资保障。
dialogue_3537=做好准备！接下来的一系列战斗将比之前任何一场战役都更加严酷。
dialogue_3538=看着眼熟吗？这样的场景，此时此刻正在世界各地上演。你们可能就是下一个。
dialogue_3539=敌人并非不可战胜，反击从现在开始！
dialogue_3540=敌人从各个方向发起进攻，许多城市已经沦陷。
dialogue_3541=我会向所有人证明自己拥有追求自由的力量与勇气！
dialogue_3542=指挥部收到了大量关于敌军部队和武器装备的情报。提供这些资料的指挥官也将在之后的行动中与我们并肩作战。
dialogue_3543=这是我们所有的精锐了，你知道该怎么做。
dialogue_3544=我们根本无法阻挡住敌人的进攻。
dialogue_3545=先撤回远东的基地，盯住那里苏军的动向。
dialogue_3546=根据阿尔弗雷德提供的情报显示，苏门答腊岛的敌军防御更为薄弱。
dialogue_3547=我们会在这里发动突袭，牵制住奥斯本。
dialogue_3548=仅凭这点兵力就敢向新加坡方向发动进攻，英军的举动十分可疑。
dialogue_3549=死守核设施周边的防线！绝不能让苏军占领那里！
dialogue_3550=我们会在海上发起进攻，封锁敌人的撤退路线。
dialogue_3551=尽快实施登陆作战，消灭南部的敌军。我们将从这里向北发动反攻。
dialogue_3552=识时务者为俊杰，通机变者为英豪。
dialogue_3553=你们让我别无选择。
dialogue_3554=沿着海岸线的方向进攻！协助友军夹击并消灭沿海的守军。
dialogue_3555=敌人海军的主力似乎并不在这里。我们会消灭这里所有的敌军舰队。
dialogue_3556=在援军抵达前我会死守住自己的位置。
dialogue_3557=你们的胜利毫无意义，我们还会再来的。
dialogue_3558=黑蝎基地里的数据已经成功恢复。但是并未查到关于奥斯本的资料。
dialogue_3559=阿尔弗雷德，之前的战役中你已经向我们证明了自己的价值。相信你一定有办法能彻底解决奥斯本。
dialogue_3560=交给我吧。
dialogue_3561=是时候了，开始行动。
dialogue_3562=黑蝎早已经历过失败，也许远不止两次。
dialogue_3563=你为什么会在这里？
dialogue_3564=为了见证你的结局，那个不惜要献祭我们所有人来达到的结局。
dialogue_3565=我会替你完成自己的愿望。
dialogue_3566=我就是你，我们在另一边见。
dialogue_3567=我从不怀疑自己的判断。
dialogue_3568=敌军的战斗力远超我的预计。
dialogue_3569=天命难违。
dialogue_3570=我们的战斗还远未结束。
dialogue_3571=行动终止，现在撤退吧。
dialogue_3572=到此为止了。
dialogue_3573=美苏的统治地位依然不可动摇。
dialogue_3574=情报屡次出错，我们必须对战场形势做出自己的判断。
dialogue_3575=阿尔弗雷德，你成功地终结了一切却又什么都没有终结。
dialogue_3576=设施已经启动，我们早已做好了离开的准备。再见了另一个我。
dialogue_3577=这里的设施只会扫描并创造出一个新的你，完全继承先前的所有。
dialogue_3578=而你只是一缕旧世的余念。将和我一起在这里消散。
dialogue_3579=也许你是对的，但即使是在最可怕的梦魇里，我仍然认为我会是我。
dialogue_3580=也许我们用不了多久还会再见的。
dialogue_3581=你们可以动手了。
dialogue_3582=我们为这个真相而感到遗憾。
dialogue_3583=彻底消灭残余的敌军，重新夺回南极基地！

