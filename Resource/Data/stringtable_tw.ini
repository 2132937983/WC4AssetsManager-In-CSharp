event_stage_intro_20801=德军已经轻易地突破了马奇诺防线，低地国家也相继沦陷。司令部制定了发电机行动，命令全力掩护法军主力和远征军向敦刻尔克和加莱方向撤退。这是一个崇尚武力的时代，绥靖政策的恶果只能由我们自己承担。我们会坚定的执行命令。为了家族的荣耀！为了我们的战友！为了皇家空军！为了大英帝国！
event_stage_intro_20802=我们错过了最佳撤退时机，阿尔弗雷德在空战中跳伞逃生，生死未卜。然而，有人却悄悄向我们提供了目击情报——阿尔弗雷德和其他被俘的战友暂时被关押在山间小镇，不久后就会被转移到柏林。时间已经不多了，无论情报多么不确定，我们都必须一试，不能放弃自己的战友。
event_stage_intro_20803=盟军在西线的失败证明了地面战场才是当下战争中最为重要的一环，而装甲部队正是地面战场的关键。此时陆军在北非战场的败退，正如彼时彼刻的欧洲战场。不同的是德军攻势虽然依旧迅猛，但装备和兵员的补给确是我们占优。我们的装甲师将会在北非战场所向披靡。
event_stage_intro_20804=欺骗行动已经奏效，德军在诺曼底的防御工事还未完成！我们面前的黄金海滩上也未侦查到敌人的重火力。我会迅速清理出一片滩头阵地，随后协助友军完成登陆。
event_stage_intro_20805=为什么德军还能有如此多的兵力组织大规模的进攻？巴斯托涅的守军已经无法撤出包围圈了。援军部队除非能预知敌军的行动提前向我们发起支援，否则就只能把希望寄托在英军手中了。
event_stage_intro_20806=战争彻底改变了世界形势，美苏两极成为了新的霸权。各殖民地相继独立，帝国的疆域也不断缩小，昔日的荣耀与辉煌已经不再。在新政府的领导下我们早晚会沦为美国的附庸。不过眼前威胁尚存，苏军占领了墨西哥东部地区，正沿陆路北上入侵美国。新时代的战争已经打响，我们必须拥有一支属于自己的武装力量。
event_stage_intro_20807=在遗迹的发现同时引起了美苏双方的注意。划时代的武器与技术足以改变这个世界，双方都已开始了行动。不过在未知信号的引导下，我们的先遣队率先发现了南美的遗迹群。不论这些人是谁，他们的目的似乎与我相同。打破现状，重新建立起一个新的世界格局。
