dialogue_3199=开始行动！必须抢在英国佬察觉前控制丹麦全境并占领挪威战略港口。
dialogue_3600=舰队出动，港口必须在我们的控制之下！
dialogue_3601=丹麦已经投降。各部队保持战备状态继续向挪威进军！
dialogue_3602=英军之前的袭击绝非孤立事件，必须全力守住纳尔维克！
dialogue_3603=保持战备状态，英军绝不会坐视我们获得不冻港。务必做好一切防守准备！
dialogue_3604=我已经做完了一切可能的准备工作，但愿能抵御敌人的进攻。
dialogue_3605=我们相较其他军团有更短的进攻路线，攻占柏林的光荣使命必须由我们完成！
dialogue_3606=最短的路线有最硬的骨头。抢先攻下柏林的军队，未必不是我们！
dialogue_3607=我的装甲部队将在北方为主攻部队扫除一切障碍。
dialogue_3608=前线已经崩溃了，现在我只能确保更多的人免于战火。
dialogue_3609=柏林城防部队听令：元首已经自杀，立即停止战斗，不要再让更多人无谓牺牲。
dialogue_3610=这次任务是护送杜立特到起飞点。轰炸机升空后，舰队全速撤离——别跟日军纠缠，一秒钟都别浪费！
dialogue_3611=舰队已经被日军发现，必须提前行动。轰炸机中队听令，即刻登机！
dialogue_3612=杜立特中队已全部出动，赶紧撤！
dialogue_3613=敌集团已丧失战略弹性，战役进入最后阶段。命令各部：压缩敌军防御纵深，先攻克突尼斯，再进攻比塞大。
dialogue_3614=我代表非洲集团军向盟军投降。
dialogue_3615=不用继续进攻了，我代表意大利第1集团军接受无条件投降。
dialogue_3616=不能放任轴心国在爱琴海积蓄力量。必须派特种部队攻击岛屿驻军，破坏海军观察站和无线电台。
dialogue_3617=盟军近期在德文郡附近海岸有大规模行动。S艇编队绕过海峡防线前去武装侦察。
dialogue_3618=日军的海军已经不足为虑。解放婆罗洲，回收岛上的机场和石油资源！
dialogue_3619=井上中将，这三支航母编队交由你指挥以执行“MO计划”，务必确保登陆部队抵达莫尔兹比港！
dialogue_3620=情报显示，日军近期计划进攻莫尔兹比港。立即将可调动的4艘航母全数调往珊瑚海，务必挫败日军企图！
dialogue_3621=根据侦察机情报，日军进攻主力已出动。出击，在乔马德海峡将敌人葬身大海！
dialogue_3622=我会保护好翔鹤与瑞鹤，并令其将来犯之敌悉数击溃！
dialogue_3623=B集团军群听令：向低地国家实施战略佯动，诱使英法主力北移比利时，为A集团军群创造决战窗口！
dialogue_3624=A集团军群听令：阿登森林为主攻方向，形成佛兰德合围圈，务必歼灭盟军重兵集团！
dialogue_3625=装甲集群全速突击！三日抵达马斯河，次日强渡马斯河！
dialogue_3626=北线部队立即前出比利时建立阻击防线，绝不容许德军突破！
dialogue_3627=遵照贝当元帅命令，法兰西已与德国签署停战协定。各部队维持现有建制，向指定区域有序转移。
dialogue_3628=战争还没有结束，法兰西的抵抗也没有结束。我要去伦敦，带领法兰西人民继续抵抗！
dialogue_3629=同志们！以伊久姆突出部和沃夫昌斯克为进攻轴线，拿下哈尔科夫！
dialogue_3630=南方集团军群注意：苏军在哈尔科夫前线大规模集结，这是苏军进攻的前兆，做好防御准备。
dialogue_3631=向伊久姆突击，配合第1装甲集团军封闭伊久姆包围圈。
dialogue_3632=
dialogue_3633=第7装甲旅沿沙漠侧翼推进，第22近卫旅主攻哈尔法亚山口与卡普佐，海岸纵队夺取塞卢姆。
dialogue_3634=稳住战线，死守卡普佐要塞！我马上从图卜鲁格抽调部队支援！
dialogue_3635=夺回卡普佐要塞和哈尔法亚山口，不能让围城的部队还要经受后方的威胁！
dialogue_3636=卡普佐附近部队后撤至哈尔法亚山口，不要和德军纠缠。
dialogue_3637=空降部队优先控制目标机场，待占领后迅速投送补给及增援部队。
dialogue_3638=皇家海军封锁周边海域，严防敌军运输舰靠岸！
dialogue_3639=第2装甲师主攻布洛涅，第1、10装甲师分进合击加莱！必须快速夺下海峡港口！
dialogue_3640=加莱守军全体注意：务须死守城区48小时！每拖延德军一小时，就能为友军争取万人撤离时间！
dialogue_3641=皇家空军出动，重点截击斯图卡轰炸机群，掩护陆军撤离！
dialogue_3642=A、B集团军群恢复进攻，迅速形成海岸合围，绝不能让敌军逃走！
dialogue_3643=比利时投降了？该死，立即收缩里斯河防线，补充比利时的缺口！
dialogue_3644=迅速向敦刻尔克推进，不能让敌军逃跑！
dialogue_3645=法国第一集团军听令：破釜沉舟，决不后退！我们必须保卫我们的国土！
dialogue_3646=快速占领里尔，我们的脚步不能被拖在这里！
dialogue_3647=我必须突围，去其他战场继续保卫祖国！
dialogue_3648=偷袭敌方港口，切断敌海上交通线，压制其战略物资投送能力！

