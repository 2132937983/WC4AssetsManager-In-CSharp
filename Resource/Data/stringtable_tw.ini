legend_stage_40106=意大利追击

legend_intro_40101=英国第7装甲师由驻埃及机动部队改编，因驻地跳鼠吉祥物得名“沙漠之鼠”。在1940年12月韦维尔将军发起的罗盘行动中，该师充分发挥装甲部队机动优势，成为进攻主力。他们连续攻占巴迪亚、图卜鲁格等重镇，更以大胆的沙漠穿插，成功截击从班加西撤退的意大利军团，俘获大量敌军。此役第7装甲师纵横昔兰尼加，以卓越战绩首次让“沙漠之鼠”的威名响彻北非战场。
legend_intro_40102=1941年，为解救被隆美尔非洲军团围困的图卜鲁格，英军发动“战斧行动”。在此战中，第7装甲师作为进攻矛头，展现出高度的机动力与突击能力，成功攻占卡普佐堡，一度突破德军防线。虽因友军进攻受挫及德军强势反击，最终未能扭转战局，但第7装甲师在逆境中仍成功组织撤退，保存了主力，为其后北非战场的反攻留下关键力量。
legend_intro_40103=吸取经验教训后，1941年11月18日，新任中东地区总司令奥金莱克策划了十字军行动，意图一举歼灭包围图卜鲁格的德军装甲部队，解放图卜鲁格。第7装甲师作为进攻主力，迅速突进到了西迪雷泽格。隆美尔为防止盟军突破包围圈，调集装甲部队向西迪雷泽格发起猛攻。面对德军的包围，第7装甲师展现了卓越的韧性和战斗力，不但顶住了德军的反击，还在沙漠中进行快速穿插，打击敌军指挥和后勤补给线，为盟军的胜利奠定了基础。
legend_intro_40104=在第二次阿拉曼战役中，英国第7装甲师作为英军第8集团军的锋利尖刀，展现了卓越的机动性与突击能力。战役初期，该师在战线南段牵制敌军。当战局陷入僵持，英军指挥部果断将第7装甲师北调，以加强主攻方向的力量。在决定性的“增压”行动中，第7装甲师与兄弟部队一同向德军防线纵深发起猛烈突击。他们最终成功突破德意联军防线，并与第1、第10装甲师共同投入到广阔的沙漠追击战中，为盟军赢得这场关键战役的胜利做出了至关重要的贡献。
legend_intro_40105=在突尼斯战役中，英国第7装甲师作为盟军先锋部队，于1943年3月率先向马雷特防线发起突击。该师凭借出色的机动战术，在崎岖地形中迅速突破敌军防线，成功迂回至德军侧翼。在瓦迪阿卡里特河战役中，第7装甲师再次展现其沙漠作战专长，以精准的装甲突击撕开意军阵地。作为第一支攻入突尼斯城的英军部队，"沙漠之鼠"以娴熟的装甲协同和快速推进能力，为最终歼灭北非轴心国集团立下赫赫战功，为其辉煌的战史再添浓墨重彩的一笔。
legend_intro_40106=1943年，转战意大利的第7装甲师面临全新挑战：从开阔沙漠转入狭窄山地，作战环境截然不同。然而这支“沙漠之鼠”展现了惊人的适应与攻坚能力。他们自萨勒诺登陆后，不仅顶住德军猛烈反击，更一路向北推进，成功攻占那不勒斯，为加速意大利退出战争做出重要贡献，再次证明其不愧为一支能征善战的精锐之师。

synergy_tactics_4_1=・所有“沙漠之鼠”单位在沙漠地块上移动时，行动力消耗-1；
synergy_tactics_4_2=・火炮压制：炮兵单位攻击后,自身周围2格内的敌方单位获得“火炮压制”；“火炮压制”：被“沙漠之鼠”攻击时，受到伤害提升10%。
synergy_tactics_4_3=・装甲游猎：装甲单位每击杀一个处于“火炮压制”状态的敌方单位，下回合行动力+2。最多增加20点行动力。
synergy_tactics_4_4=・机械维修：每回合结束时，“沙漠之鼠”步兵单位一格范围内“沙漠之鼠”炮兵和装甲单位恢复50点HP。

army_buff_desc_1581=火炮压制：被“沙漠之鼠”攻击时，受到伤害提升10%。

