;;normal texts,tips
;__font_type[font_text_1]
tips_1 = QQ群: 787334300 作者:祝San, 帝国遗产
tips_2 = 看到我就去催帝国更新!!!!
tips_3 = 潜艇战的胜负取决于能否击沉对方的运输船。—— 邓尼茨
tips_4 = 我宁可当锤子而不是砧子。—— 隆美尔
tips_5 = 从没有人成功的守住任何东西，只有进攻，进攻再进攻。—— 隆美尔
tips_6 = 一切战术都可以归结为一句话：集中兵力，主动进攻。—— 古德里安
tips_7 = 为国家民族死之决心，海不清石不烂，决不半点改变。—— 张自忠
tips_8 = 如果我们输了空中战场，我们就会输掉这场战争并且输得很快。—— 丘吉尔
tips_9 = 一个现在被强行执行的好计划强于一个下周执行的完美计划。—— 巴顿
tips_10 = 我没有时间俘虏你们，你们要放下武器，离开道路，免得挡道。—— 古德里安
tips_11 = 如果战端一开，无论何人，皆有守土抗战之责任。—— 蒋介石
tips_12 = 我选择了军人作为一生的事业，我就立志要成为最好的军人。—— 艾森豪威尔
tips_13 = 意志力是人体的主体。—— 蒙哥马利
tips_14 = 我死则国生，我生则国死。—— 戴安澜
tips_15 = 在准备战斗的时候我总是发现计划是毫无用处的，但是计划过程是不可或缺的。—— 艾森豪威尔
tips_16 = 历史表明没有无敌的军队，从来没有。—— 斯大林
tips_17 = 仅有不怕死的人才配活着。—— 麦克阿瑟
tips_18 = 我们决心与华北人民共甘苦，共生死。—— 左权
tips_19 = 以尽快的速度，向一切可以推进的地方前进。—— 朱可夫
tips_20 = 我们所不得不畏惧的唯一东西，就是畏惧本身。—— 罗斯福
tips_21 = 只有伟大的目的才能产生伟大的毅力。—— 斯大林
tips_22 = 战死者荣，偷生者辱。荣辱系于一身者轻，而系于国家民族者重。—— 佟麟阁

