feat_desc_92_Lv2=攻击范围+1，每损失{1}点HP，提高{2}点部队攻击力
feat_desc_92_Lv3=攻击范围+1，每损失{1}点HP，提高{2}点部队攻击力
feat_desc_93=HP减少后战斗力不会下降。濒临死亡时，HP无法被降低至1点以下，持续2回合，冷却{2}回合
