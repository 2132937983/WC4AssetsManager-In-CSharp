feat_desc_76=攻击范围变为2，能够攻击敌方多个部队，攻击时有{1}%概率使敌军无法还击，持续1回合，冷却2回合
feat_desc_76_Lv3=攻击范围变为2，能够攻击敌方多个部队，对其他目标伤害不降低,攻击时有{1}%概率使敌军无法还击，持续1回合，冷却2回合
feat_desc_77=受到装甲单位伤害降低{1}%
feat_desc_78=无视闪避和烟幕弹效果，对城防造成伤害提高{1}%
feat_desc_79=发射烟幕弹，使自身笼罩在烟幕中，无法被陆军、海军主动攻击，持续1回合，冷却3回合
feat_desc_79_Lv2=发射烟幕弹，使自身笼罩在烟幕中，无法被陆军、海军主动攻击，持续1回合，冷却2回合
feat_desc_79_Lv3=发射烟幕弹，使自身笼罩在烟幕中，无法被陆军、海军主动攻击，有{1}%概率额外攻击1次,持续1回合，冷却2回合
feat_desc_80=当处在烟幕弹效果时，攻击无视目标{1}%的防御力
feat_desc_81=发射导弹时可装载原子弹弹头，初始拥有2颗，每{1}回合恢复1颗。上限4颗
feat_desc_81_Lv2=发射导弹时可装载氢弹弹头，初始拥有2颗，每{1}回合恢复1颗。上限4颗
feat_desc_81_Lv3=发射导弹时可装载三相弹弹头，初始拥有2颗，每{1}回合恢复1颗。上限4颗
feat_desc_82=可发射近程导弹，每回合可发射2次。代替普通攻击
feat_desc_82_Lv2=可发射中程导弹，每回合可发射2次。代替普通攻击
feat_desc_82_Lv3=可发射远程导弹，每回合可发射2次。代替普通攻击
feat_desc_83=无法成为陆地单位的攻击目标，受到空军和导弹攻击时降低{1}%伤害
feat_desc_84=选择一条直线，前进最多{1}格（目标位置需为空地，会被空中悬停单位阻挡），沿途造成扫射伤害，冷却2回合
feat_desc_85=无视任何地型对行动力的影响，无视任何地雷、水雷的影响，攻击时敌军无法还击，HP减少后战斗力不下降
feat_desc_87=受到陆军、海军攻击时，有{1}%概率闪避该伤害

event_105=珍珠港事件
event_intro_105=二战初期，日本对亚太地区的野心不断增长，试图通过军事行动来实现其战略目标。然而，随着日本的侵略和扩张，美国逐渐对日本的石油、钢铁等各种资源贸易进行了限制。这些限制措施严重影响了日本的军事实力。在这种背景下，日本采取了越来越激进的立场，试图通过一次隐秘而彻底的突然袭击，一举歼灭美国在太平洋的军事力量。


