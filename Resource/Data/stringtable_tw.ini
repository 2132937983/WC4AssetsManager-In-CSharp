elite_intro_93=88毫米36式高射炮是德国在二战期间广泛使用的一款多用途火炮，原本用于高射防空，但因其优异的穿甲性能，也被广泛用于对付坦克，特别是在北非战场上对抗英军装甲部队时表现突出。这款火炮精准、威力强，被盟军士兵称为“坦克杀手”，成为德军标志性武器之一。


