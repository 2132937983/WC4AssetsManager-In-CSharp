event_intro_490=为了确保德国军事工业的铁矿石供应，德军于1940年4月9日凌晨启动"威瑟堡行动"。丹麦在开战后迅速投降。挪威虽依托地形优势并接受盟军的支援，仍于6月10日沦陷。此役使德国成功控制北海与波罗的海战略要地，斯堪的纳维亚铁矿运输线由此得到全面保障。
event_intro_491=由于纳尔维克是瑞典铁矿石运输的重要北大西洋不冻港，挪威战役开始后，盟军和德军展开了激烈争夺。1940年4月9日，德国成功入侵并占领了纳尔维克。英军得知后立即派兵尝试夺回，并在4月10日和13日爆发了两场海战。然而，由于陆战准备不足，英军虽然击毁了多艘德军舰艇，但未能占领港口。
event_intro_492=1945年4月16日，苏军集结三个主力方面军向柏林发起最后一次攻势，史称柏林战役。困守柏林的德军高层负隅顽抗，但随着苏军炮火逼近，其防线逐渐崩溃。4月30日，元首地堡传来一声枪响。两日后，柏林城防司令魏德林签署投降令，德意志第三帝国彻底覆灭。
event_intro_493=为了鼓舞珍珠港事件后低迷的美国民众士气，1942年4月18日，16架B-25轰炸机从“大黄蜂”号航母起飞，成功空袭东京等城市后，1架迫降苏联，其余在中国浙江等地跳伞或迫降。此次行动虽未造成重大破坏，但震慑了日本军方。
event_intro_494=为拔除轴心国在北非最后据点，1943年4月22日，盟军发起火神行动。英军主攻突尼斯市，美军向比塞大推进。德意军队依托山地工事顽强抵抗，但受制于补给短缺以及绝对制空劣势，防线于5月6日崩溃，最终25万人于5月13日投降。此役清除地中海航道威胁，使盟军得以在两个月后发起哈士奇行动。
event_intro_495=1943年9月意大利投降后，德军全面接管爱琴海诸岛防御。为配合诺曼底登陆进行战略欺骗，1944年4月24日，英国皇家海军特殊舟艇中队（SBS）突袭圣托里尼岛，摧毁德军海岸观测站与无线电中继设施。此次突袭有效干扰德军爱琴海航运监控，迫使德军增调驻防岛屿，间接支援了盟军地中海战区主力作战。
event_intro_496=1944年4月28日诺曼底登陆演习期间，因盟军内部通讯不畅，德军9艘E艇成功在莱姆湾突袭盟军T-4护航队，击沉2艘、重创1艘LST登陆舰，造成至少749人丧生，成为诺曼底登陆前盟军单次伤亡最惨重事件。此次惨痛教训迫使盟军统一通信频率，保证了诺曼底登陆时指挥协调。
event_intro_497=婆罗洲战役是盟军在西南太平洋战场的收官之战。1945年5月1日至7月21日，澳大利亚第1军分阶段实施打拉根、文莱湾及巴厘巴板登陆，旨在夺取油田与机场以切断日军燃料供给。然而盟军战前轰炸摧毁导致岛上基础设施严重受损，加之战役发起时日军主力已战略收缩，最终实际军事效益有限。
event_intro_498=为夺取南太平洋战略主动权，日军决定启动MO作战，从海上进攻莫尔兹比港。美军在破获情报后，派出第17、第11特混舰队拦截。于是，1942年5月4日史上首次航母对决——珊瑚海海战爆发。此战，美军击沉掩护登陆部队的轻型航母祥凤号，重创翔鹤号；日军则击沉列克星敦号，重创约克城号。战术层面双方损失相当，但盟军成功粉碎日军作战目标，获得战略胜利。
event_intro_499=1940年5月10日，德军启动“曼施坦因计划”，以B集团军群佯攻荷兰与比利时中部，A集团军群主力穿越阿登森林直插盟军防线薄弱处。盟军按“D计划”将法军第1集团军群与英国远征军前推至迪勒河-布雷达防线，但德军第19装甲军5月14日突破色当后急速西进，成功将35万盟军合围。比利时国王利奥波德三世在交通枢纽尽失、防线崩溃后，于5月28日单方面投降。
event_intro_4100=1942年5月12日，苏军发动第二次哈尔科夫战役试图扩大冬季反攻成果，初期推进至哈尔科夫城郊，但因南翼防御薄弱，5月17日遭德军“腓特烈行动”南北夹击。三日内24万苏军被合围，至5月28日损失超20万人，导致南线崩溃。战役的失败使德军得以在6月发动“蓝色行动”直扑高加索，成为苏德战场战略转折的关键诱因。
event_intro_4101=1941年5月15日，英军突袭利比亚塞卢姆防线，短暂占领哈法亚山口与卡普佐要塞。然而，德军迅速增援并发动反击夺回了要塞，并在5月27日重新占领哈法亚山口，导致盟军必须通过“战斧行动”重新攻占哈法亚山口。
event_intro_4102=1941年5月20日，德军发动史上首次大规模空降作战“水星行动”，旨在夺取克里特岛以阻断盟军对巴尔干地区的空袭威胁。约1.3万德军空降兵与山地师强攻岛内三处机场，遭英联邦及希腊守军顽强抵抗。此战，德军虽达成战略目标，但空降兵伤亡惨重导致后续停止使用同类行动，却为盟军后续空降作战提供关键经验。
event_intro_4103=1940年5月22日，德军第10装甲师围攻加莱。4000名守军死守古城，与德军缠斗至26日。除了200名伤兵撤离，其余部队全部战死或被俘。此战成功抵抗牵制德军三天，使敦刻尔克防线得以巩固，为后续“发电机行动”创造了时间窗口。
event_intro_4104=1940年5月，德军凭借修订版“黄色方案”突破色当防线，将盟军北翼30余万人合围于佛兰德斯地区。为了避免被德军围歼，5月26日，盟军启动“发电机行动”，在9天时间里成功从敦刻尔克紧急撤离33.8万人，为后续反攻保留了火种。
event_intro_4105=1940年5月28日，德军完成对里尔法国第1军团4万人的合围。里尔守军顽强抵抗，甚至在激战中俘获一名德军中将，直至6月1日才最终投降。这场战役有效牵制了德军7个师的兵力，为敦刻尔克大撤退争取了宝贵时间，使盟军得以多撤离至少10万人。
event_intro_4106=1942年5月31日至6月8日，日军为切断澳大利亚与美国的战略物资运输线，派遣潜艇部队对悉尼港发动多轮突袭，重点攻击盟军舰船。尽管日军在9天攻势中仅击沉1艘海军补给舰，但此次袭击意外促使澳军方全面升级港口防御体系，为太平洋战场后期作战提供了防御经验。

dialogue_3016=你们以为，进攻是勇气的体现，但真正的勇气，是在知道敌人就在眼前时，仍能保持冷静的射出每一颗子弹。
dialogue_3017=敌人的数量与力量固然强大，但我们的意志远比他们更为坚韧。在这片我们捍卫的土地上，每一寸都承载着芬兰的骄傲与尊严。
dialogue_3018=他们的防线看似稳固，但我们有我们的决心和信念。我们并非站在撤退的边缘，而是站在历史的起点！
dialogue_3019=我们的计划遇到了意想不到的阻力，我们必须考虑调整战略，避免陷入长期作战。
dialogue_3020=英法说会保护我们，苏联说不会侵犯我们，这真是个笑话。
dialogue_3021=苏波互不侵犯条约在苏联人面前就像是一张废纸。他们比德国人更狡猾，等到我们西线崩溃时，他们才从背后捅刀。
dialogue_3022=感谢苏联人重新定义了“互不侵犯”的标准——他们不会攻击我们，直到他们想攻击为止。未来还会有人相信苏联人口中的“和平”吗？
dialogue_3023=法国人花了十年建造的防线，我们只用了十天绕过它。
dialogue_3024=所有的战术预案都没有考虑过这种情况……我们被彻底欺骗了，我们一直在防守错误的地方！
dialogue_3025=我们已经失去了时间，不能再失去勇气。全体部队立即集结，稳住阵线。我们必须拖住他们，我们仍然能战斗，法兰西不会轻易倒下！

army_buff_desc_1461=梯次攻势：指挥空军和导弹攻击时无视敌军15%防御力，对最终防御力低于20的敌军必定造成致命一击
army_buff_desc_1462=梯次攻势：指挥空军和导弹攻击时无视敌军30%防御力，对最终防御力低于20的敌军必定造成致命一击
army_buff_desc_1463=梯次攻势：指挥空军和导弹攻击时无视敌军45%防御力，对最终防御力低于20的敌军必定造成致命一击
army_buff_desc_1464=梯次攻势：指挥空军和导弹攻击时无视敌军60%防御力，对最终防御力低于20的敌军必定造成致命一击
army_buff_desc_1465=梯次攻势：指挥空军和导弹攻击时无视敌军75%防御力，对最终防御力低于20的敌军必定造成致命一击
army_buff_desc_1471=疲乏：受到攻击和空袭后额外降低6%HP，并降低士气。疲乏效果对已士气混乱的部队不生效。


